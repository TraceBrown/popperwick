function stage1Block(rnd) {
  const frag = document.createDocumentFragment();
  const sess = S.session;
  const seats = Object.keys(sess.members || {});
  const ordered = orderedSeats(seats);
  const compare = S.compare.has(rnd.index);

  /* superseded answers always stay visible, above the current one, stacked */
  ordered.forEach(seat => {
    (rnd.reruns || []).filter(r => r.seat === seat).forEach((r, i) => {
      frag.appendChild(answerMessage({
        seat: seat, tier: (r.result || {}).tier, round: rnd.index, result: r.result,
        status: (r.result || {}).status, superseded: true, stageBadge: "stage 1 · superseded #" + (i + 1),
        packetKey: "pk|sup|" + rnd.index + "|" + seat + "|" + i, canRerun: false
      }));
    });
  });

  const current = [];
  ordered.forEach(seat => {
    const res = (rnd.stage1 || {})[seat];
    const entry = liveFor(rnd.index, "stage1", seat) || liveFor(rnd.index, "rerun", seat);
    /* C1, second half: even before a prune runs, a record entry that IS the run
       the placeholder is waiting on outranks the placeholder. */
    const settledByRecord = !!(res && entry && entry.runId && res.run_id === entry.runId && TERMINAL[res.status]);
    if (res && (!entry || entry.settled || settledByRecord)) {
      current.push(answerMessage({
        seat: seat, tier: res.tier, round: rnd.index, result: res, status: res.status,
        stageBadge: (rnd.reruns || []).some(r => r.seat === seat) ? "stage 1 · current" : "stage 1",
        packetKey: "pk|s1|" + rnd.index + "|" + seat, canRerun: true
      }));
    } else if (entry) {
      current.push(liveMessage(entry, { stageBadge: entry.stage === "rerun" ? "re-run" : "stage 1" }));
    }
  });
  if (compare && current.length) {
    const grid = el("div", "compare");
    grid.style.setProperty("--cols", String(Math.min(current.length, 3)));
    current.forEach(n => grid.appendChild(n));
    frag.appendChild(grid);
  } else {
    current.forEach(n => frag.appendChild(n));
  }
  return frag;
}

/* ---------------------------------------------------------- timed blocks
   A round's stages are shown in the order they HAPPENED, by their own

   reads before it. Stage 1 is always first (it is the round), the round's
   controls always last, and anything still in flight sorts to the end. */

function disagreementCard(rnd, res, superseded, histIndex) {
  const box = el("div", "msg" + (superseded ? " superseded" : "") + (res.status !== "done" ? " bad" : ""));
  const head = el("div", "mhead");
  head.appendChild(tileFor((S.session.protocol || {}).reader_seat || "glm"));
  head.appendChild(el("span", "who", "Disagreements"));
  head.appendChild(el("span", "tier", res.tier || ""));
  head.appendChild(el("span", "grow"));
  if (superseded) head.appendChild(el("span", "badge sup", "superseded"));
  head.appendChild(statusPill(res.status, { elapsed: res.elapsed_s }));
  box.appendChild(head);
  box.appendChild(el("p", "cli", res.header || "(no CLI header)"));
  const body = el("div", "mbody");
  if (res.mapping) {
    const keys = Object.keys(res.mapping).sort();
    body.appendChild(el("p", "hint mono", "letter key: " + keys.map(k => k + " = " + seatLabel(res.mapping[k])).join("  ")));
  }
  const text = res.text || "";
  if (!text.trim()) {
    body.appendChild(el("p", "stub", res.status === "done" ? "empty extraction — the reader returned no text" : "no output was captured"));
  } else {
    /* every block gets its own control that seeds this round's relay prompt */
    const holder = el("div", "prose");
    mdBlocks(text).forEach((block, bi) => {
      if (block.kind === "hr") { holder.appendChild(el("hr")); return; }
      if (block.kind === "list") {
        const list = el(block.tag);
        block.items.forEach((item, ii) => {
          const li = el("li");
          li.innerHTML = item.html;
          li.appendChild(document.createTextNode(" "));
          li.appendChild(seedButton(rnd.index, item.text, "disagreement line"));
          list.appendChild(li);
        });
        holder.appendChild(list);
        return;
      }
      const node = el("div");
      node.innerHTML = block.html;
      node.appendChild(seedButton(rnd.index, block.text, "disagreement line"));
      holder.appendChild(node);
    });
    body.appendChild(holder);
  }
  if (res.status !== "done") {
    const note = el("div", "errnote");
    note.textContent = res.stderr_tail || "the reader call failed";
    body.appendChild(note);
  }
  const disKey = "pk|dis|" + rnd.index + "|" + histIndex;
  if (res.packet) body.appendChild(packetDisclosure(disKey, res.packet));
  box.appendChild(body);
  /* R1: this card's own action strip. It carries exactly one control — the
     packet — because nothing else here addresses a seat; the per-line "relay
     this" buttons live in the extraction itself, beside the line they seed. */
  if (res.packet) {

    acts.appendChild(packetButton(disKey, res.packet));
    box.appendChild(acts);
  }
  return box;
}
function seedButton(roundIndex, text, what) {
  const b = el("button", "mini", "relay this");
  b.title = "Seed this round's relay prompt with this line";
  b.addEventListener("click", () => seedRelay(roundIndex, text, what));
  return b;
}
function seedRelay(roundIndex, text, what) {
  const draft = relayDraft(roundIndex);
  const full = String(text || "").trim();
  draft.prompt = full.slice(0, MAX_RELAY_PROMPT);
  /* if the server cap forces a cut, SAY SO on the field rather than shortening quietly */
  draft.trimmed = full.length > MAX_RELAY_PROMPT ? { kept: draft.prompt.length, total: full.length } : null;
  openRelayFor(roundIndex);                     /* P6: seeded from the round, so preselect it too */
  S.relaySeed["round" + roundIndex] = what || "the transcript";

function reviewStamp(review) {
  const results = (review && review.results) || {};
  let best = Infinity;
  Object.keys(results).forEach(r => { best = Math.min(best, stampOf(results[r])); });
  return best;

function reviewUnits(rnd) {
  const out = [];
  (rnd.review_history || []).forEach((old, i) => {
    out.push(unit(reviewStamp(old), group([
      sysCard("Review round — superseded run #" + (i + 1), "kept on the record"),
      reviewCard(rnd, old, true, i)])));
  });
  const liveRows = [];
  S.live.forEach(entry => { if (entry.sid === S.sid && entry.round === rnd.index && entry.stage === "review" && !entry.settled) liveRows.push(entry); });
  const results = (rnd.review && rnd.review.results) || {};
  if (Object.keys(results).length || liveRows.length) {
    const statuses = Object.keys(results).map(k => results[k].status);
    const worst = liveRows.length ? null : worstStatus(statuses);
    const nodes = [sysCard("Review round" + (worst ? " complete" : " running"),
      Object.keys(results).length + " of " + (Object.keys(results).length + liveRows.length) + " reviewers back · " +
      (((S.session.protocol || {}).anonymize || {}).review ? "anonymised, a fresh letter map per reviewer" : "not anonymised") +
      (worst && worst !== "done" ? " · worst child status: " + (STATUS_LABEL[worst] || worst) : ""))];
    if (Object.keys(results).length) nodes.push(reviewCard(rnd, rnd.review, false, -1));
    liveRows.forEach(entry => nodes.push(liveMessage(entry, { stageBadge: "review" })));
    out.push(unit(liveRows.length ? Infinity : reviewStamp(rnd.review), group(nodes)));
  }
  return out;
}
function reviewCard(rnd, review, superseded, histIndex) {
  const results = (review && review.results) || {};
  const reviewers = Object.keys(results);
  const statuses = reviewers.map(r => results[r].status);
  const worst = worstStatus(statuses);
  /* a thread, not a card: the reviewers' own message cards live inside it */
  const box = el("div", "thread" + (superseded ? " superseded" : ""));
  const head = el("div", "thead");
  head.appendChild(el("span", "tname", "Rank matrix"));
  head.appendChild(el("span", "hint", reviewers.length + (reviewers.length === 1 ? " reviewer" : " reviewers")));
  head.appendChild(el("span", "grow"));
  if (superseded) head.appendChild(el("span", "badge sup", "superseded"));
  if (worst) head.appendChild(statusPill(worst, {}));
  box.appendChild(head);

  const body = el("div", "card" + (worst && worst !== "done" ? " bad" : ""));
  const widest = reviewers.reduce((n, r) => Math.max(n, (results[r].ranking_seats || []).length), 0) || 3;
  const wrap = el("div", "tablewrap");
  const table = el("table");
  const thead = el("thead"), hr = el("tr");
  hr.appendChild(el("th", null, "Reviewer"));
  for (let i = 0; i < widest; i++) hr.appendChild(el("th", null, ["1st", "2nd", "3rd"][i] || (i + 1) + "th"));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el("tbody");
  reviewers.forEach(r => {
    const tr = el("tr");
    tr.appendChild(el("td", null, seatLabel(r)));
    const ranks = results[r].ranking_seats;
    if (!ranks || !ranks.length) {
      const td = el("td", "unparsed", "ranking not parsed — see raw text");
      td.colSpan = widest;
      tr.appendChild(td);
    } else {
      for (let i = 0; i < widest; i++) tr.appendChild(el("td", null, ranks[i] ? seatLabel(ranks[i]) : ""));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  body.appendChild(wrap);
  /* L6 (round five): this sentence was printed unconditionally, so a session
     with anonymize.review off told the reader a flat lie about what the
     reviewers were shown — and the rank matrix is the one place that claim
     changes how you read the numbers. The system card above already branches on
     the same flag (reviewUnits); this line now agrees with it. */
  const anonReview = !!((((S.session || {}).protocol || {}).anonymize || {}).review);
  body.appendChild(el("p", "hint", anonReview
    ? "Cells are de-anonymised for you; the reviewer saw letters only."
    : "This session did not anonymise the review round — each reviewer saw the seats named, exactly as these cells show them."));
  box.appendChild(body);

  reviewers.forEach(r => {
    const res = results[r];
    const mapping = ((review && review.mapping_per_reviewer) || {})[r] || {};
    const key = Object.keys(mapping).sort().map(k => k + " = " + seatLabel(mapping[k])).join("   ");
    const sub = el("div");
    sub.appendChild(el("p", "hint", seatLabel(r) + "'s full review" + (key ? " · letter key: " + key : "")));
    sub.appendChild(answerMessage({
      seat: r, tier: res.tier, round: rnd.index, result: res, status: res.status,
      stageBadge: "review", isReview: true, superseded: superseded,
      packetKey: "pk|rev|" + rnd.index + "|" + histIndex + "|" + r, canRerun: false
    }));
    box.appendChild(sub);
  });
  return box;
}

function relayUnits(rnd) {
  const out = [];
  (rnd.relays || []).forEach((run, ri) => {
    const thread = el("div", "thread");
    const head = el("div", "thead");
    const stepName = run.step ? "Persona step: " + run.step : "Relay";
    head.appendChild(el("span", "tname", stepName));
    head.appendChild(el("span", "hint", run.order.map(seatLabel).join(" then ") + " · " +
      run.turns + (run.turns === 1 ? " turn each" : " turns each")));
    const liveRows = liveForRelay(run.run_id).filter(e => !e.settled);
    const status = liveRows.length ? null : (run.status || worstStatus((run.entries || []).map(e => e.status)));
    head.appendChild(el("span", "grow"));
    if (status) head.appendChild(statusPill(status === "running" ? "working" : status, {}));
    else head.appendChild(el("span", "badge warn", "running"));
    thread.appendChild(head);
    const seed = S.relaySeed[run.run_id];
    thread.appendChild(el("p", "hint", "topic: " + run.prompt + (seed ? "  ·  seeded from " + seed : "")));
    (run.entries || []).forEach((entry, ei) => {
      thread.appendChild(answerMessage({
        seat: entry.seat, tier: entry.tier, round: rnd.index, result: entry, status: entry.status,
        stageBadge: "turn " + (ei + 1), packetKey: "pk|rel|" + rnd.index + "|" + ri + "|" + ei, canRerun: false
      }));
    });
    liveRows.forEach(entry => thread.appendChild(liveMessage(entry, { stageBadge: "turn " + ((run.entries || []).length + 1) })));
    if (status && status !== "done" && status !== "running") {
      thread.appendChild(el("p", "hint", "this thread stopped early — stop_on_error is " +
        ((S.session.protocol || {}).stop_on_error ? "on" : "off") + " for this session"));
    }
    out.push(unit(stampOf((run.entries || [])[0]), thread));
  });
  return out;
}

/* the round's stage controls live at the end of the round, where their output lands */
function turnRange() { return ((S.config && S.config.ranges) || {}).turns || [1, 5]; }
function relayDraft(roundIndex) {
  if (!S.relay[roundIndex]) S.relay[roundIndex] = { order: [], turns: 1, prompt: "", open: false };
  return S.relay[roundIndex];
}
/* the seats that actually produced text in a round, in the server's seat order */
function answeredSeats(roundIndex) {
  const sess = S.session;

  return orderedSeats(Object.keys(sess.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text));
}
/* P6: opening the relay builder from a round preselects the seats that answered

function openRelayFor(roundIndex) {

}
function roundActions(rnd) {

function relayBuilder(rnd, answered, draft) {

  fs.appendChild(turnsRow);

  /* R2 (round five): readiness used to be computed ONCE, at render, and the
     `input` handler only stashed the text on the draft. So the reader picked two
     seats, typed the whole relay topic, and Run relay sat there disabled with
     "pick at least two seats" underneath it until some unrelated event happened
     to rebuild the form. The fix is not to re-render on every keystroke — that

  prompt.placeholder = "What are they arguing about? (max 4000 characters)";

  fs.appendChild(prompt);
  if (draft.trimmed) {
    fs.appendChild(el("p", "hint", "trimmed to " + draft.trimmed.kept + " of " + draft.trimmed.total +

  }

  const go = el("div", "row");
  const run = el("button", "primary mini", "Run relay");

  go.appendChild(run);
  const why = el("span", "hint");
  why.dataset.k = "relaywhy-" + rnd.index;
  go.appendChild(why);
  fs.appendChild(go);
  syncRelayReady = () => {
    const fewSeats = draft.order.length < 2;
    const noTopic = !String(draft.prompt || "").trim();
    run.disabled = fewSeats || noTopic || busy();
    why.textContent = fewSeats ? "pick at least two seats"
      : noTopic ? "write the topic they are arguing about"
      : "seats outside the order stay silent and their answers never enter the packet";
  };
  syncRelayReady();
  return fs;
}

/* Stable prose-block anchors keep a paragraph in place when answers above it
   arrive, or when the reader returns at a different width. Pixels are only a
   fallback (and keep the geometry-free headless harness useful). */
function markReading(box, key) {
  box.dataset.readingKey = key;
  let i = 0;
  $$(".prose", box).forEach(p => Array.from(p.children).forEach(n => {
    n.dataset.readingKey = key + "|block|" + i++;
    if (n.tagName === "PRE") n.dataset.k = n.dataset.readingKey;
  }));
}
function readingPosition() {
  const host = $("#stream");
  const pos = { top: host.scrollTop, bottom: host.scrollHeight - host.scrollTop - host.clientHeight < 80 };
  if (!pos.bottom && host.clientHeight) {
    const edge = host.getBoundingClientRect().top;
    const nodes = $$("[data-reading-key]", host);
    /* Prefer a paragraph to its much taller enclosing message. */
    const visible = nodes.filter(n => { const r = n.getBoundingClientRect(); return r.height && r.top + r.height > edge; });
    const node = visible.find(n => n.dataset.readingKey.indexOf("|block|") >= 0) || visible[0];
    if (node) { pos.key = node.dataset.readingKey; pos.offset = node.getBoundingClientRect().top - edge; }
  }
  return pos;
}

  const host = $("#stream");
  if (pos.bottom) { host.scrollTop = host.scrollHeight; return; }
  const node = pos.key && $$("[data-reading-key]", host).find(n => n.dataset.readingKey === pos.key);
  host.scrollTop = node
    ? host.scrollTop + node.getBoundingClientRect().top - host.getBoundingClientRect().top - pos.offset
    : pos.top || 0;
}
function renderStream() {
  const host = $("#stream");
  if (!host) return;
  const position = S.readingPending || readingPosition();
  withFocus(host, () => {
    clear(host);
    const wrap = el("div", "wrap");
    host.appendChild(wrap);
    if (S.view === "new") { wrap.appendChild(setupSurface()); return; }
    if (!S.session) {
      wrap.appendChild(sysCard("No session open", "pick one from the list, or start a new one"));
      return;
    }
    const sess = S.session;
    if (sess.migrated_from === 1) {
      wrap.appendChild(sysCard("Migrated from schema 1",
        "this session never ran under a v2 configuration, so it carries no frozen config hash"));
    }
    if (!(sess.rounds || []).length) {
      wrap.appendChild(sysCard("Session created", "no round yet — ask the first question in the composer below"));
      wrap.appendChild(configSummary(sess, "Effective configuration (frozen at creation)"));
    }
    (sess.rounds || []).forEach(rnd => {
      const div = el("div", "rounddiv");
      div.dataset.readingKey = "round|" + rnd.index;
      div.appendChild(el("span", "rlabel", "Round " + (rnd.index + 1)));
      div.appendChild(el("span", "hint num", whenLabel(rnd.asked_at)));
      /* aggregate, from the record: how much of this round actually came back */
      const roster = Object.keys(sess.members || {});
      const got = roster.map(s => (rnd.stage1 || {})[s]).filter(Boolean);
      const answered = got.filter(r => r.status === "done").length;
      const failed = got.filter(r => r.status === "error" || r.status === "timed_out" || r.status === "cancelled").length;
      div.appendChild(el("span", "badge num", answered + "/" + roster.length + " answered"));
      if (failed) {
        const chip = el("span", "pill p-error num");
        chip.appendChild(el("span", "dot"));
        chip.appendChild(el("span", null, failed + " failed"));
        div.appendChild(chip);            /* the error hue only ever appears when X > 0 */
      }
      div.appendChild(el("span", "rule"));
      wrap.appendChild(div);
      wrap.appendChild(sysCard("Round started",
        Object.keys(sess.members || {}).map(seatLabel).join(", ") + " received the same packet, blind and in parallel" +
        (sess.mode === "persona" ? " · persona step: briefs" : "")));
      wrap.appendChild(questionMessage(rnd));
      wrap.appendChild(stage1Block(rnd));                 /* stage 1 IS the round: always first */
      const timed = disagreementUnits(rnd).concat(reviewUnits(rnd), relayUnits(rnd));
      timed.sort((a, b) => (a.t === b.t ? 0 : (a.t < b.t ? -1 : 1)));   /* stable on ties */
      timed.forEach(u => wrap.appendChild(u.node));
      wrap.appendChild(roundActions(rnd));                /* the controls always last */
    });
    if (sess.mode === "persona" && sess.persona_state && sess.persona_state.done) {
      wrap.appendChild(sysCard("Persona sequence complete",
        "there is no judge step — the verdict is the decision you write in the info pane"));
    }
  });
  if (S.session || S.view === "new") {
    restoreReading(position);
    S.readingPending = null;       /* a loading placeholder never consumes it */
  }
}

/* ========================================================= SETUP SURFACE
   EVERYTHING below is built from /api/config: the seat list, each seat's tiers,
   each knob's TYPE and range, the modes, the roles, the bound names and the
   turn range. Nothing here names a seat, a knob or a bound. A knob the server
   adds tomorrow renders with no change to this file.
   The same builders serve two drafts — the New session surface and the info
   pane's "settings for the next session" — so the allow-list logic exists once
   and cannot drift between them. */
const NEXT_KEY = "rt2.nextdraft";
let DRAFT_SEQ = 0;

function blankDraft(cfg, id) {
  const pd = (cfg && cfg.protocol_defaults) || {};
  const seats = Object.keys((cfg && cfg.seats) || {});
  const bounds = {};
  Object.keys((cfg && cfg.ranges && cfg.ranges.bounds) || {}).forEach(key => {
    const range = cfg.ranges.bounds[key] || [100, 2000];
    bounds[key] = (pd.bounds || {})[key] != null ? pd.bounds[key] : range[0];
  });
  const draft = {
    id: id, title: "", mode: (pd.mode) || ((cfg && cfg.modes) || ["roundtable"])[0],
    members: {}, roles: {}, charters: {},
    protocol: {
      reader_seat: (pd.reader_seat && seats.indexOf(pd.reader_seat) >= 0) ? pd.reader_seat : seats[0],
      reader_tier: pd.reader_tier || null,
      anonymize: { review: (pd.anonymize || {}).review !== false,
                   disagreements: !!((pd.anonymize || {}).disagreements) },
      bounds: bounds,
      stop_on_error: pd.stop_on_error !== false,
      live_log: pd.live_log !== false

  };
  seats.forEach(seat => { draft.members[seat] = { on: true, tier: cfg.seats[seat].default_tier, knobs: {} }; });
  if (!draft.protocol.reader_tier) {
    const rs = ((cfg && cfg.seats) || {})[draft.protocol.reader_seat];
    draft.protocol.reader_tier = rs ? rs.default_tier : null;
  }

}
/* stored defaults are applied field by field and anything the server no longer

function mergeDraft(base, saved) {
  const cfg = S.config;
  if (!saved || typeof saved !== "object" || !cfg) return base;
  if (saved.mode && (cfg.modes || []).indexOf(saved.mode) >= 0) base.mode = saved.mode;
  Object.keys(saved.members || {}).forEach(seat => {
    const target = base.members[seat], src = saved.members[seat];
    if (!target || !src) return;
    if (typeof src.on === "boolean") target.on = src.on;
    if (src.tier && cfg.seats[seat].tiers[src.tier]) target.tier = src.tier;
    Object.keys(src.knobs || {}).forEach(name => {
      if ((cfg.seats[seat].knobs || {})[name]) target.knobs[name] = src.knobs[name];
    });
  });
  const p = saved.protocol || {};
  if (p.reader_seat && base.members[p.reader_seat]) base.protocol.reader_seat = p.reader_seat;
  if (p.reader_tier) base.protocol.reader_tier = p.reader_tier;
  if (p.anonymize) {
    if (typeof p.anonymize.review === "boolean") base.protocol.anonymize.review = p.anonymize.review;
    if (typeof p.anonymize.disagreements === "boolean") base.protocol.anonymize.disagreements = p.anonymize.disagreements;
  }
  Object.keys(p.bounds || {}).forEach(k => { if (base.protocol.bounds[k] != null) base.protocol.bounds[k] = p.bounds[k]; });
  if (typeof p.stop_on_error === "boolean") base.protocol.stop_on_error = p.stop_on_error;
  if (typeof p.live_log === "boolean") base.protocol.live_log = p.live_log;
  (cfg.roles || []).forEach(r => {
    if ((saved.roles || {})[r] && base.members[saved.roles[r]]) base.roles[r] = saved.roles[r];
    if ((saved.charters || {})[r]) base.charters[r] = saved.charters[r];
  });

}
function defaultDraft() {                    /* a FRESH draft for a new session */
  return normalizeReader(mergeDraft(blankDraft(S.config, "new" + (++DRAFT_SEQ)), lsGet(NEXT_KEY, null)));
}
function nextDraft() {                       /* the single editable next-session object */
  if (!S.next) S.next = normalizeReader(mergeDraft(blankDraft(S.config, "next"), lsGet(NEXT_KEY, null)));
  return S.next;
}
function draftSeats(d) { return Object.keys(d.members).filter(s => d.members[s].on); }

  const tiers = Object.keys((((S.config || {}).seats || {})[d.protocol.reader_seat] || {}).tiers || {});
  if (tiers.length && tiers.indexOf(d.protocol.reader_tier) < 0) d.protocol.reader_tier = tiers[0];

function knobVisible(spec, mode) { return !spec.modes || spec.modes.indexOf(mode) >= 0; }

function setupSurface() {
  const cfg = S.config;
  const box = el("div");
  if (!cfg) { box.appendChild(sysCard("Waiting for the server", "the option allow-list has not loaded yet")); return box; }
  if (!S.draft) S.draft = defaultDraft();
  const d = normalizeReader(S.draft);
  const redraw = () => { renderStream(); renderComposer(); };

  box.appendChild(sysCard("New session", "nothing runs until you press Create — no model is called by this form"));
  box.appendChild(modeFieldset(d, redraw, true));
  box.appendChild(recipientFieldset(d, redraw, false));
  if (d.mode === "persona") box.appendChild(roleRows(d, redraw, false));
  box.appendChild(protocolFieldset(d, redraw, false));

  const prev = el("div", "card");
  prev.appendChild(el("h3", null, "Effective configuration"));
  prev.appendChild(el("p", "hint", "This is exactly what the server will freeze. The hash is assigned at creation and never recomputed."));
  const pre = el("pre", "hash");
  try { pre.textContent = JSON.stringify(buildCreatePayload(d), null, 2); }
  catch (e) { pre.textContent = "(not valid yet: " + e.message + ")"; }
  prev.appendChild(pre);
  /* G1: bull, bear and risk on three DIFFERENT seats, each with a charter.
     The server answers 400 and names the field, and that backstop stays — but
     the mistake is made in this form, so this form refuses to send it.
     R2: the blocker lives in a holder that is always in the tree, so
     `syncCreateReady` can put the line up and take it down again on a keystroke
     without rebuilding the form. When there is nothing to say the holder is
     empty — the blocker element itself exists only while it is true. */
  const hold = el("div");
  hold.dataset.k = "createblockholder";
  prev.appendChild(hold);
  const bar = el("div", "row");
  bar.dataset.k = "createbar";
  const create = el("button", "primary", "Create session");
  create.dataset.k = "createbtn";
  create.addEventListener("click", () => createSession());
  bar.appendChild(create);
  const save = el("button", "mini", "Save this as the next-session default");
  save.addEventListener("click", () => {
    lsSet(NEXT_KEY, serializeDraft(d));
    S.next = null; forgetDraftFields(); renderInfo();
    flash("Saved as the default for the next session.", "ok");
  });
  bar.appendChild(save);
  bar.appendChild(el("span", "hint grow", "the composer below can carry the opening question — leave it empty to create the session on its own"));
  prev.appendChild(bar);
  box.appendChild(prev);
  syncCreateReady(prev);          /* the first paint goes through the same one gate */
  return box;
}

/* R2 + C4: the ONE place that decides whether this form may be submitted, and
   the only writer of the two nodes that show that decision. Called at build,
   on every charter keystroke, and either side of an in-flight create. `root`
   lets the build call reach nodes that are not in the document yet. */
function syncCreateReady(root) {
  const scope = root || document;
  const btn = scope.querySelector('[data-k="createbtn"]');
  if (!btn) return;
  const d = S.draft ? normalizeReader(S.draft) : null;
  const problem = (d && d.mode === "persona") ? personaProblemDraft(d) : null;
  btn.disabled = !!problem || S.creating;
  if (problem) btn.title = problem; else btn.removeAttribute("title");
  const hold = scope.querySelector('[data-k="createblockholder"]');
  if (!hold) return;
  clear(hold);
  if (problem) {
    const p = el("p", "hint bad");
    p.dataset.k = "createblock";
    p.textContent = problem;
    hold.appendChild(p);
  }
}

/* one payload builder, one place that knows how a knob becomes a field ------ */
function buildCreatePayload(draft) {
  const d = draft || S.draft;
  const cfg = S.config;
  const members = {};
  draftSeats(d).forEach(seat => {
    const m = d.members[seat];
    const out = { tier: m.tier };
    const knobs = (cfg.seats[seat] || {}).knobs || {};
    Object.keys(knobs).forEach(name => {
      if (name === "role" || name === "charter") return;
      if (!knobVisible(knobs[name], d.mode)) return;
      const raw = m.knobs[name];
      if (raw === "" || raw == null) return;              /* empty means: let the server default */
      out[name] = knobs[name].type === "int" ? Number(raw) : raw;
    });
    members[seat] = out;
  });
  if (d.mode === "persona") {
    (cfg.roles || []).forEach(role => {
      const seat = d.roles[role];
      if (!seat || !members[seat]) return;
      members[seat].role = role;
      const charter = String(d.charters[role] || "");
      if (charter) members[seat].charter = charter;
    });
  }
  const payload = { mode: d.mode, members: members,
                    protocol: JSON.parse(JSON.stringify(normalizeReader(d).protocol)) };
  if (d.title.trim()) payload.title = d.title.trim();
  return payload;
}
function serializeDraft(d) {
  const members = {};
  Object.keys(d.members).forEach(s => {
    members[s] = { on: d.members[s].on, tier: d.members[s].tier, knobs: JSON.parse(JSON.stringify(d.members[s].knobs)) };
  });
  return { mode: d.mode, members: members, protocol: JSON.parse(JSON.stringify(d.protocol)),
           roles: JSON.parse(JSON.stringify(d.roles)), charters: JSON.parse(JSON.stringify(d.charters)) };
}
/* role-map check: with role-centric rows, "two roles on one seat" is the shape
   the mistake actually takes, and the sentence names the role, not the seat */
function personaProblemDraft(d) {
  const roles = (S.config && S.config.roles) || [];
  const seats = draftSeats(d);
  const used = {};
  /* the line-up first: a seat holding two roles invalidates the whole sequence,
     so say that before complaining about any one charter's contents */
  for (let i = 0; i < roles.length; i++) {
    const role = roles[i], seat = d.roles[role];
    if (!seat || seats.indexOf(seat) < 0) return "persona mode: no seat is assigned " + role + ".";
    if (used[seat]) {
      return "persona mode: " + seatLabel(seat) + " is both " + used[seat] + " and " + role +
             " — each role needs its own seat.";
    }
    used[seat] = role;
  }
  for (let i = 0; i < roles.length; i++) {
    const role = roles[i];
    if (!String(d.charters[role] || "").trim()) {
      return "persona mode: the " + role + " seat (" + seatLabel(d.roles[role]) +
             ") has an empty charter — a frozen charter is required.";
    }
  }
  return null;
}

/* L5 (round five): the roster's fallback read the LAST ROUND'S STAGE-1 ONLY.
   Every later call a seat made was invisible to it: a relay turn that errored, a
   review that timed out, a persona step that was cancelled — all of them left
   the roster showing the green "done" from stage 1, which is the exact reading
   the brief forbids ("a failed seat must look failed at a glance"). The
   fallback now walks every result the record holds for that seat and takes the
   chronologically last one. `started_at` orders them; a result with no stamp
   never outranks one that has a stamp, and document order breaks ties. */
function eachResultFor(seat, fn) {
  const sess = S.session;
  if (!sess) return;
  const reader = (sess.protocol || {}).reader_seat;
  (sess.rounds || []).forEach(rnd => {
    const s1 = (rnd.stage1 || {})[seat];
    if (s1) fn(s1);
    (rnd.reruns || []).forEach(r => { if (r.seat === seat && r.result) fn(r.result); });
    (rnd.review_history || []).forEach(h => { const r = ((h || {}).results || {})[seat]; if (r) fn(r); });
    const rev = (((rnd.review || {}).results) || {})[seat];
    if (rev) fn(rev);
    /* the disagreements extraction is a real call, made by the reader seat */
    if (reader === seat) {
      (rnd.disagreements_history || []).forEach(d => { if (d) fn(d); });
      if (rnd.disagreements) fn(rnd.disagreements);
    }
    /* relays carry persona steps too — a step is a relay with a `step` name */
    (rnd.relays || []).forEach(run => {
      (run.entries || []).forEach(e => { if (e && e.seat === seat) fn(e); });
    });
  });
}
function lastResultFor(seat) {
  let best = null, bestT = -Infinity;
  eachResultFor(seat, res => {
    if (!res || !res.status) return;
    const t = stampOf(res);
    const at = isFinite(t) ? t : -Infinity;
    if (at >= bestT) { bestT = at; best = res; }
  });
  return best;
}

/* Closing the inspector gives space back to prose without hiding who is
   working or the latest failed call. Reuse the roster's source of truth. */
function renderReadingStatus() {
  const host = $("#readingStatus");
  if (!host) return;
  clear(host);
  host.hidden = !S.session;
  if (!S.session) return;
  Object.keys(S.session.members || {}).forEach(seat => {
    const row = el("div", "seat-status");
    row.appendChild(tileFor(seat));
    row.appendChild(el("span", "who", seatLabel(seat)));
    let active = null;
    S.live.forEach(e => { if (e.sid === S.sid && e.seat === seat && !e.settled && !active) active = e; });
    const last = lastResultFor(seat);
    row.appendChild(active ? statusPill(active.status, {
      timerKey: active.runId || liveKey(active.round, active.stage, seat), startMs: active.startMs
    }) : last ? statusPill(last.status, { elapsed: last.elapsed_s }) : el("span", "hint", "Idle"));
    host.appendChild(row);
  });
}

/* =============================================================== COMPOSER */
function mentionsIn(text) {
  const found = [];
  String(text || "").replace(/@([a-z0-9_-]+)/gi, (m, name) => {
    const seat = name.toLowerCase();
    if (addressableSeats().indexOf(seat) >= 0 && found.indexOf(seat) < 0) found.push(seat);
    return m;
  });
  return found;
}
function setComposer(text) {
  const box = $("#msg");
  if (box) { box.value = text; S.messageRevision = ++S.editSequence; renderComposer(); }
}
function viewKey() { return S.view === "new" ? "new" : S.sid; }
function emptyView() {
  return { text: "", context: "", contextOpen: false, revision: ++S.editSequence,
    delivery: "independent", turns: 1, compare: new Set(), open: new Set(),
    relay: {}, reviewers: {}, relaySeed: {}, reading: { top: 0, bottom: false } };
}
function parkView() {
  const key = viewKey();
  if (!key) return;
  S.views.set(key, { text: $("#msg").value, context: $("#ctx").value,
    contextOpen: !!$("#ctxBox").open, revision: S.messageRevision,
    delivery: S.delivery, turns: S.turns, compare: new Set(S.compare), open: new Set(S.open),
    relay: JSON.parse(JSON.stringify(S.relay)), reviewers: JSON.parse(JSON.stringify(S.reviewers)),
    relaySeed: Object.assign({}, S.relaySeed), reading: S.readingPending || readingPosition() });
}
function restoreView(key) {
  const saved = S.views.get(key) || emptyView();
  if (!S.views.has(key) && key !== "new") saved.reading.bottom = true;
  $("#msg").value = saved.text; $("#ctx").value = saved.context;
  $("#ctxBox").open = saved.contextOpen;
  S.messageRevision = saved.revision; S.composerNote = null;
  S.delivery = saved.delivery; S.turns = saved.turns; $("#turns").value = String(S.turns);
  S.compare = new Set(saved.compare); S.open = new Set(saved.open);
  S.relay = JSON.parse(JSON.stringify(saved.relay)); S.reviewers = JSON.parse(JSON.stringify(saved.reviewers));
  S.relaySeed = Object.assign({}, saved.relaySeed);
  S.readingPending = saved.reading;
}
function messageTicket(text) {
  return { key: viewKey(), gen: S.gen, text: text, revision: S.messageRevision };
}
function settleMessage(ticket) {
  if (!ticket || !ticket.key) return;
  if (ticket.key === viewKey()) {
    if (ticket.gen === S.gen && ticket.revision === S.messageRevision && $("#msg").value === ticket.text) setComposer("");
  } else {
    const saved = S.views.get(ticket.key);
    if (saved && saved.revision === ticket.revision && saved.text === ticket.text) {
      saved.text = ""; saved.revision = ++S.editSequence;
    }
  }
}
function focusComposer() { const box = $("#msg"); if (box && box.focus) box.focus(); }
/* C5/G5: a one-shot sentence for the line beside Send — why a send did not
   happen, or what the server's cap did to the text that was sent. It survives
   until the reader types, and never replaces the standing delivery explanation
   with silence. */
function composerNote(text, bad) {
  S.composerNote = text ? { text: String(text), bad: !!bad } : null;
  renderComposer();
}
function nextPersonaStep() {
  const sess = S.session;
  if (!sess || sess.mode !== "persona" || !sess.persona_state) return null;
  return (sess.persona_state.steps || [])[sess.persona_state.step_index + 1] || null;
}
function renderComposer() {
  const msg = $("#msg"), send = $("#btnSend"), note = $("#deliveryNote"),
        sel = $("#delivery"), turnsWrap = $("#turnsWrap"), mentionRow = $("#mentionRow"),
        ctxSum = $("#ctxSummary"), ctx = $("#ctx");
  if (!msg || !send) return;
  const sess = S.session;
  const persona = !!(sess && sess.mode === "persona");
  const personaOpt = sel ? sel.querySelector('option[value="persona"]') : null;
  if (personaOpt) personaOpt.disabled = !persona;
  if (S.delivery === "persona" && !persona && (sess || S.view !== "session")) S.delivery = "independent";
  if (sel) sel.value = S.delivery;
  if (turnsWrap) turnsWrap.hidden = S.delivery !== "relay";

  const mentions = mentionsIn(msg.value);
  if (mentionRow) {
    clear(mentionRow);
    if (mentions.length) {
      mentionRow.appendChild(el("span", "hint", "addressed:"));
      mentions.forEach((seat, i) => {
        const chip = el("span", "chip");
        if (S.delivery === "relay") chip.appendChild(el("span", "num", (i + 1) + "."));
        chip.appendChild(tileFor(seat));
        chip.appendChild(el("span", null, seatLabel(seat)));
        mentionRow.appendChild(chip);
      });
    }
  }
  if (ctxSum && ctx) {
    ctxSum.textContent = ctx.value.trim()
      ? "Context · " + ctx.value.length + " chars"
      : "Context";
  }

  const addressable = addressableSeats();
  msg.placeholder = "Ask " + (addressable.length ? addressable.map(s => "@" + s).join(" ") : "the seats") + "…";
  msg.title = "Enter sends; Shift+Enter adds a line." +
    (addressable.length ? " Address seats with " + addressable.map(s => "@" + s).join(" ") + "." : "");
  /* Grow with writing, not with permanent instructions. The same textarea
     keeps its value, focus and caret across incoming seat events. */
  if (msg.style && msg.scrollHeight) {
    msg.style.height = "auto";
    msg.style.height = Math.max(36, Math.min(msg.scrollHeight + 2, 180)) + "px";
  }
  /* T1: `sayWhy` marks the cases where the line under Delivery earns its 28px —
     a blocker the reader has to act on. The generic description of the delivery
     mode is not one of them: it sits on the control as a title now, and an empty
     message box does not need a caption telling the reader it is empty. */
  let label = "Send", enabled = true, why = "", sayWhy = false;
  if (S.view === "new") {
    label = msg.value.trim() ? "Create session and ask" : "Create session";
    enabled = !S.creating;                 /* C4: the other Create control is mid-flight */
    why = S.creating ? "creating the session — one request is already out"
                     : "the session is created first, then the round";
    sayWhy = S.creating;
  } else if (!sess) {
    label = "Send"; enabled = false; why = "open or create a session first"; sayWhy = true;
  } else if (S.delivery === "persona") {
    const step = nextPersonaStep();
    label = step ? "Advance persona: " + step : "Persona sequence complete";
    enabled = !!step && !busy();
    why = step ? "the sequence is frozen; typed text is not sent on a persona step" : "there is no judge step — write the decision instead";
    sayWhy = !step || busy();
    msg.disabled = !!step;
  } else if (S.delivery === "relay") {
    const rnd = (sess.rounds || [])[sess.rounds.length - 1];
    const answered = rnd ? Object.keys(sess.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text) : [];
    const order = mentions.filter(s => answered.indexOf(s) >= 0);
    label = "Run relay (" + order.length + " seats × " + S.turns + ")";
    enabled = order.length >= 2 && !!msg.value.trim() && !busy();
    why = order.length < 2 ? "mention at least two seats that answered this round, in order"
                           : order.map(seatLabel).join(" then ") + " · the message is the relay topic";
    sayWhy = order.length < 2 || busy();     /* the ORDER is the thing a reader gets wrong */
    msg.disabled = false;
  } else {
    const n = Object.keys((sess && sess.members) || {}).length;
    label = "Send to " + n + (n === 1 ? " seat" : " seats");
    enabled = !!msg.value.trim() && !busy();
    why = busy() ? "a stage is still running" : "every seat gets the same packet, blind and in parallel";
    sayWhy = busy();
    msg.disabled = false;
  }
  const compactSend = S.view !== "new" && S.delivery === "independent";
  $("#sendLabel").textContent = label;
  $("#sendLabel").className = compactSend ? "sr-only" : "";
  send.dataset.compact = String(compactSend);
  send.setAttribute("aria-label", label);
  send.disabled = !enabled;
  /* T1 (round five): the delivery explanation was a permanent row. At 380px it
     wrapped onto its own line under the Delivery control and never changed —
     28px of the composer spent restating what "Independent parallel" already
     says, on every screen, forever. It becomes the control's own title, and the
     row is kept for the two cases that are worth a line: something the page
     wants to shout (a trim, a refused relay) and the reason Send is off. */
  if (sel) sel.title = why;
  send.title = why;
  if (note) {
    const shout = S.composerNote;
    note.textContent = shout ? shout.text : (sayWhy ? why : "");
    note.className = "hint grow" + (shout && shout.bad ? " bad" : "");
  }
}

/* ================================================================ ACTIONS */
function guard(sid, gen) { return sid === S.sid && gen === S.gen; }

async function post(path, body, what) {
  S.inflight += 1;
  renderComposer();
  try {
    return await api(path, body);
  } catch (e) {
    flash((what || "Request") + " failed: " + e.message + (e.field ? " (field " + e.field + ")" : ""));
    throw e;
  } finally {
    S.inflight -= 1;
    renderComposer();
  }
}

function newSessionView() {
  /* M1: New session is reached FROM inside the sessions drawer, so at drawer
     widths the surface it opens would appear underneath it. Shut the drawers
     first — the form is the thing you just asked for. */
  if (narrow()) closeDrawers();
  flushPendingNotes();               /* C1: leaving for the new-session form loses notes the same way */
  parkFields();
  parkView();
  stopStream();
  clearLive();
  forgetFields();
  S.fetchApplied = 0;
  S.gen += 1;
  S.sid = null; S.session = null; S.view = "new";
  S.draft = defaultDraft();
  restoreView("new");
  try { window.history.replaceState(null, "", "/"); } catch (e) { /* no history in this context */ }
  renderTop(); renderInfo(); renderComposer(); renderStream(); renderSidebar();
}

/* The server rejects a bad persona line-up with a 400 naming the field. Say it
   here too, before spending a request, and name the ROLE that is wrong — the
   form is where the mistake is, so that is where the sentence belongs. */
function personaProblem(members) {
  const roles = (S.config && S.config.roles) || ["bull", "bear", "risk"];
  const seatOfRole = {};
  const seats = Object.keys(members);
  for (let i = 0; i < seats.length; i++) {
    const seat = seats[i], role = members[seat].role;
    if (!role) return "persona mode: the " + seatLabel(seat) + " seat has no role — assign " + roles.join(", ") + ".";
    if (seatOfRole[role]) {
      return "persona mode: " + role + " is on two seats (" + seatLabel(seatOfRole[role]) + " and " +
             seatLabel(seat) + ") — each role needs its own seat.";
    }
    seatOfRole[role] = seat;
    if (!String(members[seat].charter || "").trim()) {
      return "persona mode: the " + role + " seat (" + seatLabel(seat) + ") has an empty charter — a frozen charter is required.";
    }
  }
  const missing = roles.filter(r => !seatOfRole[r]);
  if (missing.length) {
    return "persona mode: no seat is assigned " + missing.join(" or ") + " — one " + roles.join(", one ") +
           ", on three different seats.";
  }
  return null;
}

async function createSession(openingQuestion) {
  /* C4: two controls create a session — this form's button and the composer's
     Send while the new-session view is open — and neither consulted the other.
     Enter twice, or Enter plus a click, POSTed /api/session/new twice and left
     two sessions where the reader asked for one (the second usually orphaned,
     because only the last create's id gets opened). One lock, checked before
     anything else happens, held until the whole create-then-ask is finished. */
  if (S.creating) return null;
  S.creating = true;
  syncCreateReady(); renderComposer();
  try {
    return await createSessionLocked(openingQuestion);
  } finally {
    S.creating = false;
    syncCreateReady(); renderComposer();
  }
}
async function createSessionLocked(openingQuestion) {
  const gen = S.gen;                       /* a late create must not steal a newer choice */
  /* C2: the opening question and its context are captured HERE, beside the
     configuration they belong to, and the round below is addressed to the id
     this call creates. Sending it to "whatever session is current when the
     network comes back" put a round on a stranger's transcript the moment the
     reader clicked another session during the create. */
  const wantQ = openingQuestion == null ? ($("#msg") ? $("#msg").value : "") : openingQuestion;
  const wantCtx = $("#ctx") ? $("#ctx").value : "";
  const openingTicket = messageTicket(wantQ);
  let payload;
  try { payload = buildCreatePayload(S.draft); }
  catch (e) { flash("Cannot build the configuration: " + e.message); return null; }
  if (!Object.keys(payload.members).length) { flash("Pick at least one seat."); return null; }
  if (payload.mode === "persona") {
    const problem = personaProblemDraft(S.draft) || personaProblem(payload.members);
    if (problem) { flash(problem); return null; }      /* no request is sent */
  }
  let res;
  try { res = await post("/api/session/new", payload, "Creating the session"); }
  catch (e) { return null; }
  const createdId = res.id;
  await loadSessions();
  /* Give a failed opening round somewhere recoverable to leave its draft.
     If creation stayed foreground, carry later typing there too. */
  const createdView = emptyView();
  createdView.text = wantQ; createdView.context = wantCtx; createdView.revision = openingTicket.revision;
  if (S.gen === gen) {
    parkView();
    const latest = S.views.get(openingTicket.key);
    if (latest) Object.assign(createdView, latest, { delivery: "independent", reading: { top: 0, bottom: false } });
  }
  S.views.set(createdId, createdView);
  const createdTicket = { key: createdId, gen: S.gen === gen ? S.gen + 1 : null,
    text: wantQ, revision: openingTicket.revision };
  if (S.gen === gen) await selectSession(createdId, openingTicket.key);
  /* Re-read the world AFTER every await: the reader may have moved during the
     create, during the list load, or during the new session's own first fetch. */
  if (S.sid !== createdId) {
    flash("Session " + shortId(createdId) + " was created, but you had already moved on — it is in the list, not opened.", "ok");
  }
  if (wantQ && wantQ.trim()) {
    const started = await ask(wantQ, wantCtx, createdId, createdTicket);
    if (started) settleMessage(openingTicket);
  }
  return createdId;
}

/* `targetSid` addresses a round at a NAMED session. Omitted, it means the open
   one and the page repaints as usual; given and not open, the round still runs
   where it was addressed and this session is left exactly as the reader left
   it — no repaint, no live entries, no stolen composer. */
async function ask(question, context, targetSid, sentTicket) {
  const sid = targetSid == null ? S.sid : targetSid;
  const gen = S.gen;
  const foreground = sid === S.sid;
  const ticket = sentTicket || (foreground ? messageTicket(question) : null);
  if (!sid) { flash("No session is open."); return null; }
  let res;
  try { res = await post("/api/round", { id: sid, question: question, context: context || "" }, "Starting the round"); }
  catch (e) { return null; }
  settleMessage(ticket);
  if (!foreground) {
    flash("Round " + (res.round + 1) + " started on session " + shortId(sid) +
          " — you had already opened another session, so nothing here was repainted.", "ok");
    await loadSessions();
    return res;
  }
  if (!guard(sid, gen)) return res;
  markPending(res.round, "stage1", Object.keys(S.session.members || {}));
  await refetch(sid, gen);
  await loadSessions();
  return res;
}

async function runDisagreements(roundIndex) {
  const sid = S.sid, gen = S.gen;
  try { await post("/api/disagreements", { id: sid, round: roundIndex }, "Extracting disagreements"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "disagreements", [(S.session.protocol || {}).reader_seat]);
  renderStream(); renderInfo();
}

async function runReview(roundIndex) {
  const sid = S.sid, gen = S.gen;
  const chosen = S.reviewers[roundIndex] || {};
  const rnd = (S.session.rounds || [])[roundIndex] || {};
  const answered = Object.keys(S.session.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text);
  const reviewers = answered.filter(s => chosen[s] !== false);
  if (!reviewers.length) { flash("Pick at least one reviewer."); return; }
  try { await post("/api/review", { id: sid, round: roundIndex, reviewers: reviewers }, "Starting the review round"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "review", reviewers);
  renderStream(); renderInfo();
}

/* Accepted relays return true here or "left" after navigation. Only rejection
   returns false; the caller can settle the right owner's submitted draft. */
async function runRelay(roundIndex) {
  const sid = S.sid, gen = S.gen;
  const draft = relayDraft(roundIndex);
  let res;
  try {
    res = await post("/api/relay", { id: sid, round: roundIndex, order: draft.order.slice(),
                                     turns: Number(draft.turns) || 1, prompt: draft.prompt.trim() }, "Starting the relay");
  } catch (e) { return false; }
  if (!guard(sid, gen)) return "left";
  if (res && res.run_id && S.relaySeed["round" + roundIndex]) S.relaySeed[res.run_id] = S.relaySeed["round" + roundIndex];
  draft.open = false;
  await refetch(sid, gen);
  /* C2 (round five): the POST was guarded and the refetch was guarded, and then
     the function returned a flat `true` into a caller that took it as licence to
     empty the composer — the SHARED composer, which by then might be showing a
     different session's unsent question. The reader clicks another session while
     the final GET is in the air, starts typing, and the sentence disappears
     under them. The relay did start; it just did not start HERE any more, and
     the caller has to be able to tell those apart. */
  return guard(sid, gen) ? true : "left";
}

async function runRelayFromComposer() {
  const sess = S.session;
  const rnd = (sess.rounds || [])[sess.rounds.length - 1];
  if (!rnd) { composerNote("Ask a question first — a relay argues about answers.", true); return false; }
  const answered = Object.keys(sess.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text);
  const msg = $("#msg").value;
  const order = mentionsIn(msg).filter(s => answered.indexOf(s) >= 0);
  const ctx = $("#ctx") ? $("#ctx").value : "";
  const draft = relayDraft(rnd.index);
  draft.order = order;
  draft.turns = Number(S.turns) || 1;
  /* G5: the server caps a relay prompt at MAX_RELAY_PROMPT. Cutting the topic
     silently misrepresents what the seats were actually asked, so the cut is
     recorded on the draft AND said out loud beside Send. */
  const full = msg.replace(/@[a-z0-9_-]+/gi, "").trim() + (ctx.trim() ? "\n\nCONTEXT:\n" + ctx : "");
  draft.prompt = full.slice(0, MAX_RELAY_PROMPT);
  draft.trimmed = full.length > MAX_RELAY_PROMPT ? { kept: draft.prompt.length, total: full.length } : null;
  S.relaySeed["round" + rnd.index] = "the composer";
  const sentText = msg;                       /* C2: exactly what this relay was built from */
  const ticket = messageTicket(sentText);
  const started = await runRelay(rnd.index);
  /* C5: the draft is the reader's writing. A relay the server refused (409 while
     a stage runs, 400 on a bad order) used to empty the composer anyway, so the
     text was gone and the reason was in a line above it. */
  if (started === false) {
    if (guard(ticket.key, ticket.gen)) composerNote("The relay did not start, so your draft is untouched — the reason is in the line above.", true);
    return false;
  }
  /* C2: the relay ran, but not on the session the composer is showing now. Say
     nothing here and touch nothing here — this composer belongs to whatever the
     reader moved to, and its contents are theirs. */
  if (started !== true) { settleMessage(ticket); return false; }
  /* C2: even on the same session, only clear the text this relay actually sent.
     Anything else in the box was typed after the request went out. */
  const box = $("#msg");
  if (!box || box.value !== sentText || S.messageRevision !== ticket.revision) {
    composerNote("The relay started. What you typed since is still here, unsent.", false);
    return true;
  }
  setComposer("");
  composerNote(draft.trimmed
    ? "Relay topic trimmed to " + draft.trimmed.kept + " of " + draft.trimmed.total +
      " characters — the server caps a relay prompt at " + MAX_RELAY_PROMPT + "."
    : "", false);
  return true;
}

async function runPersonaStep() {
  const sid = S.sid, gen = S.gen;
  let res;
  try { res = await post("/api/persona/step", { id: sid }, "Advancing the persona sequence"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  await refetch(sid, gen);
}

async function rerunSeat(roundIndex, seat) {
  const sid = S.sid, gen = S.gen;
  try { await post("/api/rerun", { id: sid, round: roundIndex, seat: seat }, "Re-running " + seatLabel(seat)); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "rerun", [seat]);
  renderStream(); renderInfo();
}

async function cancelSeat(seat) {
  const sid = S.sid, gen = S.gen;
  const body = { id: sid };
  if (seat) body.seat = seat;
  try { await post("/api/cancel", body, "Cancelling"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;            /* a stale cancel never flashes into another session */
  flash(seat ? "Cancel sent to " + seatLabel(seat) + "." : "Cancel sent to every seat in this session.", "ok");
}

function scheduleNotes(text) {
  const sid = S.sid, gen = S.gen;
  if (S.notesTimer) clearTimeout(S.notesTimer);
  S.notesPending = { sid: sid, notes: text };      /* C1: what the debounce still owes */
  S.notesTimer = setTimeout(async () => {
    S.notesTimer = 0;
    S.notesPending = null;
    if (!guard(sid, gen)) return;
    try {
      await api("/api/notes", { id: sid, notes: text });
      if (!guard(sid, gen)) return;
      if (S.session) S.session.notes = text;
      fieldSaved("notes", text);
      S.notesSaved = clockNow();
      renderInfo();
    } catch (e) { flash("Notes did not save: " + e.message); }
  }, 900);
}
/* C1 (round five): the notes autosave is a 900 ms debounce. Clicking another
   session inside that window bumped `S.gen`, so the timer fired into a guard
   that dropped it — the last sentence the reader typed was simply gone, with an
   "unsaved" caption they never got to read. Navigation now SENDS what the
   debounce is still holding, addressed to the session it was typed in. No guard
   (the point is that we have already left) and no repaint (nothing on screen
   belongs to that session any more) — just the write, then the switch. */
function flushPendingNotes() {
  const p = S.notesPending;
  if (S.notesTimer) { clearTimeout(S.notesTimer); S.notesTimer = 0; }
  S.notesPending = null;
  if (!p || !p.sid) return null;
  const sent = api("/api/notes", { id: p.sid, notes: p.notes });
  sent.catch(() => { /* the reader has moved on; a flash here would land on a stranger's screen */ });
  return sent;
}

async function saveDecision(stance, rationale, dissent) {
  const sid = S.sid, gen = S.gen;
  try {
    const res = await post("/api/decision", { id: sid, decision: { stance: stance, rationale: rationale, dissent: dissent } }, "Saving the decision");
    if (!guard(sid, gen)) return;
    if (S.session) S.session.decision = res.decision;
    fieldSaved("decision-stance", stance);
    fieldSaved("decision-rationale", rationale);
    fieldSaved("decision-dissent", dissent);
    flash("Decision saved at " + res.saved + ".", "ok");
    renderInfo();
  } catch (e) { /* flashed already */ }
}

async function exportSession(fmt) {
  const sid = S.sid, gen = S.gen;
  try {
    const res = await post("/api/export", { id: sid, format: fmt }, "Exporting");
    if (!guard(sid, gen)) return;
    if (S.session) { S.session.exported = S.session.exported || {}; S.session.exported[fmt] = res.path; }
    flash("Wrote " + res.path, "ok");
    renderInfo();
  } catch (e) { /* flashed already */ }
}

/* =============================================================== SESSIONS */
function stopStream() {
  if (S.stream) { try { S.stream.close(); } catch (e) { /* already closed */ } S.stream = null; }
  if (S.refetchTimer) { clearTimeout(S.refetchTimer); S.refetchTimer = 0; }
}
async function selectSession(id, transferredFrom) {
  if (!ID_RE.test(String(id || ""))) { flash("That is not a session id.", "err", "sessionload"); return; }
  /* C1: BEFORE anything is cleared — the old session still owns S.sid here, and
     both of these read it. */
  flushPendingNotes();
  parkFields();
  parkView();
  stopStream();
  clearLive();                       /* switching sessions clears every timer */
  forgetFields();                    /* and its drafts belong to it, not the next one */
  S.fetchApplied = 0;                /* C3: a new session starts its own ordering */
  S.gen += 1;
  S.sid = id; S.session = null; S.view = "session";
  restoreView(id);
  /* A foreground creation moves its composer; it must not leave a duplicate
     under New. Do this before awaiting, so later New drafts cannot be erased. */
  if (transferredFrom) S.views.delete(transferredFrom);
  S.notesSaved = null;
  const gen = S.gen;
  try { window.history.replaceState(null, "", "/?session=" + encodeURIComponent(id)); } catch (e) { /* no history */ }
  renderTop(); renderInfo(); renderComposer(); renderStream(); renderSidebar();
  await refetch(id, gen);
  if (!guard(id, gen)) return;
  openStream(id, gen);
}
async function refetch(sid, gen) {
  /* C3 (round five): (sid, gen) stops a stale answer from painting the WRONG
     session, but says nothing about two answers for the RIGHT one. A stage
     event and a reconnect fire two GETs; if the first resolves second — a
     40-minute seat makes that ordinary — the older snapshot wins and the
     transcript loses the answer that had just landed, until something else
     happened to refetch. Every GET takes a ticket; a ticket older than the one
     already painted is dropped unread. */
  const seq = ++S.fetchSeq;
  try {
    const sess = await api("/api/session/" + encodeURIComponent(sid));
    if (!guard(sid, gen)) return null;          /* stale completion: never repaint */
    if (seq < S.fetchApplied) return null;      /* a newer snapshot is already on screen */
    S.fetchApplied = seq;
    S.session = sess;
    clearFlashTag("sessionload");               /* C4: a session DID load — the notice is spent */
    S.delivery = (sess.mode === "persona" && S.delivery === "persona") ? "persona" : S.delivery;
    pruneLive();
    renderTop(); renderInfo(); renderComposer(); renderStream();
    return sess;
  } catch (e) {
    if (guard(sid, gen)) flash("Could not load the session: " + e.message, "err", "sessionload");
    return null;
  }
}
function scheduleRefetch(sid, gen) {
  if (S.refetchTimer) clearTimeout(S.refetchTimer);
  S.refetchTimer = setTimeout(() => { S.refetchTimer = 0; refetch(sid, gen); }, 140);
}

function openStream(sid, gen) {
  let stream;
  try { stream = new EventSource("/api/events?id=" + encodeURIComponent(sid)); }
  catch (e) { flash("Live events are unavailable: " + e.message); return; }
  S.stream = stream;
  stream.onopen = () => { if (guard(sid, gen)) scheduleRefetch(sid, gen); };
  stream.onmessage = ev => {
    if (!guard(sid, gen)) return;
    let msg = null;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleEvent(msg, sid, gen);
  };
  stream.onerror = () => { /* EventSource retries on its own; state comes from the refetch */ };
}

/* The server also emits legacy argue_turn / argue_done aliases for every relay
   turn so the v1 page keeps working. This page drops them — counting both would
   double every turn. */
const ALIASES = { argue_turn: 1, argue_done: 1 };
function handleEvent(msg, sid, gen) {
  if (!msg || !msg.type || ALIASES[msg.type]) return;
  if (msg.type === "resync") { scheduleRefetch(sid, gen); return; }
  const round = msg.round == null ? 0 : msg.round;

  if (msg.type === "seat_started") {
    S.live.delete(liveKey(round, msg.stage, msg.seat));
    const key = msg.entry_run_id || msg.run_id || ("s|" + round + "|" + msg.stage + "|" + msg.seat);
    S.live.set(key, {
      sid: sid, gen: gen, round: round, stage: msg.stage, seat: msg.seat, tier: msg.tier,
      runId: msg.entry_run_id || msg.run_id, relayRunId: msg.entry_run_id ? msg.run_id : null,
      status: "working", startMs: Date.now(), settled: false, header: ""
    });
    startTicker();
    renderStream(); renderInfo(); renderComposer();
    return;
  }
  if (msg.type === "seat_done" || msg.type === "seat_error" || msg.type === "rerun_done" || msg.type === "relay_turn") {
    const key = msg.entry_run_id || msg.run_id;
    const entry = S.live.get(key);
    if (entry) {
      entry.status = msg.status || (msg.type === "seat_error" ? "error" : "done");
      entry.settled = true;
      entry.text = msg.text; entry.header = msg.header; entry.elapsed_s = msg.elapsed_s;
    }
    scheduleRefetch(sid, gen);
    return;
  }
  if (msg.type === "disagreements_done") {
    const entry = S.live.get(msg.run_id);
    if (entry) { entry.status = msg.status; entry.settled = true; }
    S.live.delete(liveKey(round, "disagreements", msg.seat));
    scheduleRefetch(sid, gen);
    return;
  }
  if (msg.type === "review_done" || msg.type === "relay_done" || msg.type === "persona_step_done" ||
      msg.type === "round_started" || msg.type === "cancelled") {
    if (msg.type === "cancelled") {
      S.live.forEach(entry => {
        if (entry.sid === sid && (!msg.seat || entry.seat === msg.seat)) { entry.status = "cancelled"; entry.settled = true; }
      });
    }
    scheduleRefetch(sid, gen);
    if (msg.type === "round_started") loadSessions();
    return;
  }
  scheduleRefetch(sid, gen);
}

/* =================================================================== BOOT */
function wireComposer() {
  const msg = $("#msg"), ctx = $("#ctx");
  if (msg) {
    msg.addEventListener("input", () => { S.messageRevision = ++S.editSequence; S.composerNote = null; renderComposer(); });
    msg.addEventListener("keydown", ev => {
      if (ev.key === "Enter" && !ev.shiftKey && !ev.altKey && !ev.ctrlKey && !ev.metaKey) {
        ev.preventDefault();
        sendComposer();
      }
    });
  }
  if (ctx) ctx.addEventListener("input", () => renderComposer());
  const sel = $("#delivery");
  if (sel) sel.addEventListener("change", () => { S.delivery = sel.value; renderComposer(); });
  const turns = $("#turns");
  if (turns) {
    const range = turnRange();
    turns.min = String(range[0]); turns.max = String(range[1]);
    turns.addEventListener("input", () => {
      const v = Number(turns.value) || range[0];
      S.turns = Math.max(range[0], Math.min(range[1], v));
      renderComposer();
    });
  }
  const send = $("#btnSend");
  if (send) send.addEventListener("click", () => sendComposer());
}
async function sendComposer() {
  const msg = $("#msg");
  const text = msg ? msg.value : "";
  const ctx = $("#ctx") ? $("#ctx").value : "";
  if (S.view === "new") { await createSession(text); return; }
  if (!S.session) { flash("Open or create a session first."); return; }
  if (S.delivery === "persona") { await runPersonaStep(); return; }
  if (S.delivery === "relay") { await runRelayFromComposer(); return; }
  if (!text.trim()) return;
  await ask(text, ctx);
}
function wireChrome() {
  $$("[data-theme-set]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  const sb = $("#btnSidebar");
  if (sb) sb.addEventListener("click", () => setPane("sidebar", document.getElementById("app").dataset.sidebar !== "on"));
  const ib = $("#btnInfo");
  if (ib) ib.addEventListener("click", () => setPane("info", document.getElementById("app").dataset.info !== "on"));
  const nb = $("#btnNew");
  if (nb) nb.addEventListener("click", () => newSessionView());
  const rb = $("#btnReload");
  if (rb) rb.addEventListener("click", () => loadSessions());
  const cs = $("#btnCloseSidebar");
  if (cs) cs.addEventListener("click", () => setPane("sidebar", false));
  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("keydown", onGlobalKey);       /* M1: Escape shuts a drawer */
  }
  const search = $("#search");
  if (search) search.addEventListener("input", () => { S.search = search.value; renderSidebar(); });
  wireGutter($("#gutL"), "sidebar");
  wireGutter($("#gutR"), "info");
  if (typeof window !== "undefined" && window.addEventListener) {
    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { applyAutoPanes(); syncChromeHeight(); }, 120);
    });
  }
}
function restoreLayout() {
  let mode = lsGet("rt2.theme", "system");
  if (["system", "light", "dark"].indexOf(mode) < 0) mode = "system";
  setTheme(mode);
  setWidth("sidebar", lsGet("rt2.sidebar.w", 268));
  setWidth("info", lsGet("rt2.info.w", 330));
  setPane("sidebar", paneWanted("sidebar"), lsGet("rt2.sidebar.choice", null) !== null);
  setPane("info", paneWanted("info"), lsGet("rt2.info.choice", null) !== null);
  syncChromeHeight();
}
async function boot() {
  restoreLayout();
  wireChrome();
  wireComposer();
  renderComposer();
  try {
    S.config = await api("/api/config");
  } catch (e) {
    flash("Cannot reach the roundtable server: " + e.message);
    renderStream();
    return;
  }
  const bar = $("#fakebar");
  if (bar) bar.hidden = !S.config.fake;
  syncChromeHeight();                       /* the fake band changes the drawers' ceiling */
  await loadSessions();
  let wanted = null;
  try {
    const m = /(?:^|[?&])session=([0-9a-f]{8,64})(?:&|$)/.exec(window.location.search || "");
    if (m) wanted = m[1];
  } catch (e) { /* no location */ }
  if (wanted && S.sessions.some(r => r.id === wanted)) await selectSession(wanted);
  else {
    /* C3: an id in the address bar that this server does not have used to do
       nothing at all — the page landed on the empty view and the reader was
       never told the link was dead. Name the id, keep the line dismissable,
       and land on the list. It clears itself on the next session that loads. */
    if (wanted) {
      flash("Session " + shortId(wanted) + " did not load — no session with that id is in this server's list.",
            "err", "sessionload");
    }
    S.view = "empty"; renderTop(); renderStream(); renderInfo(); renderComposer();
  }
  syncChromeHeight();
  startTicker();
}

/* the same functions the buttons call, exposed for a headless harness */
if (typeof window !== "undefined") {
  window.RT = {
    boot: boot, state: S,
    md: { esc: esc, renderMd: renderMd, mdBlocks: mdBlocks, inlineMd: inlineMd },
    util: { mmss: mmss, elapsedLabel: elapsedLabel, worstStatus: worstStatus, mentionsIn: mentionsIn,
            addressableSeats: addressableSeats, orderedSeats: orderedSeats, configSeats: configSeats,
            fieldDirty: fieldDirty, fields: () => S.fields,
            pruneLive: pruneLive, rangeFor: rangeFor, answeredSeats: answeredSeats, narrow: narrow,
            liveFor: liveFor, terminal: TERMINAL },
    act: {
      newSessionView: newSessionView, createSession: createSession, ask: ask,
      selectSession: selectSession, refetch: refetch, loadSessions: loadSessions,
      runDisagreements: runDisagreements, runReview: runReview, runRelay: runRelay,
      runRelayFromComposer: runRelayFromComposer, runPersonaStep: runPersonaStep,
      rerunSeat: rerunSeat, cancelSeat: cancelSeat, exportSession: exportSession,
      saveDecision: saveDecision, scheduleNotes: scheduleNotes, seedRelay: seedRelay,
      sendComposer: sendComposer, setComposer: setComposer, buildCreatePayload: buildCreatePayload,
      handleEvent: handleEvent, setTheme: setTheme, setPane: setPane, paneWanted: paneWanted, personaProblem: personaProblem,
      personaProblemDraft: personaProblemDraft, nextDraft: nextDraft, defaultDraft: defaultDraft,
      serializeDraft: serializeDraft, blankDraft: blankDraft,
      applyAutoPanes: applyAutoPanes, restoreLayout: restoreLayout, relayDraft: relayDraft,
      closeDrawers: closeDrawers, onGlobalKey: onGlobalKey, syncChromeHeight: syncChromeHeight,
      togglePacket: togglePacket, openRelayFor: openRelayFor, composerNote: composerNote,
      flash: flash, clearFlashTag: clearFlashTag, markPending: markPending
    },
    render: { stream: renderStream, info: renderInfo, sidebar: renderSidebar, composer: renderComposer, top: renderTop }
  };
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
</script>
</body>
