<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable</title>
<!--
  DESIGN RATIONALE

  Identity: a hearing transcript. One chronological column of evidence, and
  every control sits where its own output will land — so no part of a session
  is ever one layer away from the answer it belongs to.

  Reading pass: keep the conversation broad, with Info closed until requested.
  A compact seat-status strip retains orientation while the inspector is shut.
  The idle composer is one line; writing grows it, Context remains expandable,
  and review configuration sits behind an explicit Review options disclosure.
  These controls configure future work. Answers, packets and the human decision
  keep their existing treatment and place in the record.
  Returning to a conversation restores its writing and its visible paragraph,
  including open comparisons and review controls. This state stays in this tab;
  it adds no storage or server contract. Accepted sends clear only the version
  actually sent, so waiting for a seat never costs the reader their next thought.

  Aesthetic pass: neutral controls and an original rounded composer shell borrow
  the live Grok app's hierarchy. Original SVG initials and a three-dot wave keep
  identity and waiting close to their message. See reference/DESIGN-DNA.md for
  measured observations, source distinctions and deliberate departures.

  Palette, light: bg #fafafa · surface #ffffff · surface-2 #f3f3f3 ·
  surface-3 #e9e9e9 · border #dedede · border-2 #c8c8c8 · text #191919 ·
  muted #646464 · faint #909090 · accent(ink) #202020 · accent-soft #e7e7e7.
  Identity hues: gpt #0f6b6f · kimi #8d3383 · glm #2f5aa8 · you #626262.
  Status: queued #616a77 · working #8a6108 · done #24694a · error #a52d26 ·
  timed out #9a5411 · cancelled #8a3a2a (a brick in the SAME red/ochre family as
  error and timeout — a cancelled call is a call that did not answer).

  Palette, dark: bg #111111 · surface #191919 · surface-2 #202020 ·
  surface-3 #2a2a2a · border #333333 · border-2 #484848 · text #e9e9e9 ·
  muted #a4a4a4 · faint #727272 · accent(ink) #eeeeee · accent-soft #303030.
  Identity hues: gpt #56c3c6 · kimi #d987d0 · glm #7ea6e8 · you #b2b2b2.
  Status: queued #99a2af · working #dcae4a · done #6dc198 · error #f08b83 ·
  timed out #e0a05f · cancelled #d98f81.

  Type roles: system sans, 15.5px/1.62, max 74ch, for model prose — the thing
  this page exists to read. 13px sans for chrome, 12px for meta. ui-monospace
  for CLI header lines, verbatim packets, run ids, the config hash, every
  timer and the rank matrix; tabular-nums everywhere a number can change.

  Deliberate risk: THE ACCENT IS INK, NOT A HUE. Colour on this page is
  allowed to mean exactly two things — who spoke (identity) and how a call
  ended (status). So every button, focus ring and affordance is neutral ink.
  It costs the page a brand colour and makes primary actions quieter than a
  product would allow; it buys a palette in which a red pill can never be
  mistaken for a link and a green one can never be mistaken for a button.
  (Second, smaller risk: no modals and no wizard. Session creation, the relay
  builder and the review options are inline documents in the same scrolling
  column. The column gets long. The length is the point.)

  Round four (presentation pass): the transcript keeps this engine but takes
  variant A's reading treatment. A message is no longer a card — author line,
  CLI line, body, one rule between neighbours — and the six-button strip is
  collapsed until the message is hovered or holds focus. SECOND DELIBERATE
  RISK: that strip is hidden by a zero-height clip, not by `display: none`,
  precisely so the buttons stay in the tab order; `display: none` would make
  `:focus-within` unreachable and quietly turn every per-message action into a
  mouse-only feature. The cost is a strip that a screen reader still announces
  while it is invisible; the alternative was a control keyboard users could
  never reach. Cancelled also left the purple channel: a cancelled call did not
  answer, so it now reads in the same red/ochre family as error and timeout,
  and the FAKE band gave up the working hue for plain chrome — a build flag is
  not a call status.

  Rejected: tabs or drawers over the evidence; a dialog for session creation;
  coloured side-stripe cards; gradients; emoji; unlabeled controls; collapsed
  or virtualised answers; autoscroll that fights the reader; and any asset the
  page would have to ask the network for. Also rejected this round: hiding the
  action strip with `display: none` (see above), and keeping BOTH the packet
  disclosure and the packet button — two doors to one piece of evidence is one
  door too many, so the button is the door.

  Test hook: the script publishes a read/dispatch handle on `window.RT`
  (state, renderers, and the same action functions the buttons call) so a
  headless harness can drive the page's own code paths. It exposes no new
  capability — it is same-origin script reaching same-origin script — and it
  never carries the API token.
-->
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f3f3f3;
  --surface-3: #e9e9e9;
  --border: #dedede;
  --border-2: #c8c8c8;
  --text: #191919;
  --muted: #646464;
  --faint: #909090;

  --accent: #202020;          /* ink: the ONLY interactive colour */
  --accent-hover: #3a3a3a;
  --on-accent: #ffffff;
  --accent-soft: #e7e7e7;

  --id-gpt: #0f6b6f;
  --id-kimi: #8d3383; --id-claude: #91553d;
  --id-glm: #2f5aa8;
  --id-you: #626262;

  --st-queued: #616a77;
  --st-working: #8a6108;
  --st-done: #24694a;
  --st-error: #a52d26;
  --st-timeout: #9a5411;
  --st-cancel: #8a3a2a;
  --tint-working: #fdf4e0;
  --tint-timeout: #fbeeda;
  --tint-error: #fbe8e6;
  --tint-cancel: #f6e5e1;
  --tint-done: #e9f3ed;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 8px;
  --sw: 268px;   /* sidebar width  */
  --iw: 330px;   /* info pane width */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --surface: #191919; --surface-2: #202020; --surface-3: #2a2a2a;
    --border: #333333; --border-2: #484848; --text: #e9e9e9; --muted: #a4a4a4; --faint: #727272;
    --accent: #eeeeee; --accent-hover: #ffffff; --on-accent: #151515; --accent-soft: #303030;
    --id-gpt: #56c3c6; --id-kimi: #d987d0; --id-claude: #dba388; --id-glm: #7ea6e8; --id-you: #b2b2b2;
    --st-queued: #99a2af; --st-working: #dcae4a; --st-done: #6dc198; --st-error: #f08b83;
    --st-timeout: #e0a05f; --st-cancel: #d98f81;
    --tint-working: #33290f; --tint-timeout: #3a2a12; --tint-error: #3a1f1d; --tint-cancel: #38221c; --tint-done: #16301f;
  }
}
/* explicit overrides win in BOTH directions, whatever the system says */
:root[data-theme="light"] {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f3f3f3; --surface-3: #e9e9e9;
  --border: #dedede; --border-2: #c8c8c8; --text: #191919; --muted: #646464; --faint: #909090;
  --accent: #202020; --accent-hover: #3a3a3a; --on-accent: #ffffff; --accent-soft: #e7e7e7;
  --id-gpt: #0f6b6f; --id-kimi: #8d3383; --id-claude: #91553d; --id-glm: #2f5aa8; --id-you: #626262;
  --st-queued: #616a77; --st-working: #8a6108; --st-done: #24694a; --st-error: #a52d26;
  --st-timeout: #9a5411; --st-cancel: #8a3a2a;
  --tint-working: #fdf4e0; --tint-timeout: #fbeeda; --tint-error: #fbe8e6; --tint-cancel: #f6e5e1; --tint-done: #e9f3ed;
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #191919; --surface-2: #202020; --surface-3: #2a2a2a;
  --border: #333333; --border-2: #484848; --text: #e9e9e9; --muted: #a4a4a4; --faint: #727272;
  --accent: #eeeeee; --accent-hover: #ffffff; --on-accent: #151515; --accent-soft: #303030;
  --id-gpt: #56c3c6; --id-kimi: #d987d0; --id-claude: #dba388; --id-glm: #7ea6e8; --id-you: #b2b2b2;
  --st-queued: #99a2af; --st-working: #dcae4a; --st-done: #6dc198; --st-error: #f08b83;
  --st-timeout: #e0a05f; --st-cancel: #d98f81;
  --tint-working: #33290f; --tint-timeout: #3a2a12; --tint-error: #3a1f1d; --tint-cancel: #38221c; --tint-done: #16301f;
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6 { overflow-wrap: anywhere; min-width: 0; margin: 0; font-weight: 650; }
p { margin: 0; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ------------------------------------------------------------- controls */
button {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--r); padding: 6px 11px; min-height: 34px; cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease;
}
button:hover:not(:disabled) { background: var(--surface-3); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 1; color: var(--faint); background: var(--surface-2); border-color: var(--border); cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.primary:disabled { color: var(--faint); background: var(--surface-3); border-color: transparent; }
/* T2 (round five): metadata splits in two. DECORATIVE metadata — badges, hints,
   CLI header lines, timestamps — stays 11–12px in --muted. ACTIONABLE metadata
   — anything a click does something to — is 13px minimum and one step darker,
   in --text. The action strip and the sidebar row actions were 11–11.5px muted
   at .35 opacity: the same size and colour as the labels beside them, so the
   only thing separating a button from a caption was the pointer. */
button.quiet { background: none; border-color: transparent; color: var(--text); padding: 3px 6px; }
button.quiet:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
button.quiet:disabled { color: var(--muted); }
button.mini { font-size: 13px; padding: 3px 8px; min-height: 28px; border-radius: var(--r); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--border-2); font-weight: 600; }
input[type="text"], input[type="search"], input[type="number"], select, textarea {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r);
  padding: 6px 9px; width: 100%; min-width: 0;
}
input:disabled, select:disabled, textarea:disabled { color: var(--faint); background: var(--surface-2); cursor: not-allowed; }
textarea { resize: vertical; line-height: 1.5; }
/* L1 (round five): a checkbox left unstyled paints itself in the OS accent —
   a colour this page never chose, and on macOS one that collides with the
   status channel. `accent-color` on the ink token puts every box and radio in
   the page's one interactive colour, in both themes, and it is a neutral ink,
   never a status hue. */
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
label { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; background: var(--surface-2); }
.seg button { border: 0; border-radius: 6px; padding: 3px 9px; min-height: 28px; background: transparent; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
/* L2 (round five): a form that refuses to send is not a call that failed. The
   blocker line used to borrow --st-error, so a typo in the persona line-up read
   like a seat that had died. It gets ink and weight instead — loud in the
   typography, silent in the status channel, which stays reserved for outcomes. */
.hint.bad { color: var(--text); font-weight: 650; }
.faint { color: var(--faint); }
.stub { color: var(--faint); font-style: italic; }

/* --------------------------------------------------------------- layout */
.app { display: flex; flex-direction: column; height: 100%; }
#topbar {
  display: flex; gap: 10px; align-items: center; padding: 8px 12px;
  border-bottom: 1px solid var(--border); background: var(--surface); flex: 0 0 auto;
  position: relative; z-index: 40;   /* M1: a drawer never covers its own toggle */
}
#topbar .brand { font-weight: 700; letter-spacing: .2px; }
#topbar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* L2: neutral chrome. This band says which BUILD is running, not how a call
   ended, so it may not wear a status hue — the working tint made a fake session
   look like a session with three seats still thinking. Surface + ink only; the
   weight, the tracking and the full-bleed strip carry the message instead. */
#fakebar {
  flex: 0 0 auto; padding: 5px 12px; font-weight: 650; letter-spacing: .5px;
  text-transform: uppercase; font-size: 11.5px;
  background: var(--surface-3); color: var(--text);
  border-bottom: 1px solid var(--border-2);
  position: relative; z-index: 40;
}
/* The row is FLEX, not grid, and deliberately so: a `display: none` grid item
   leaves the grid flow entirely, so hiding the sidebar auto-placed #main into
   column 1 and collapsed it to zero width. In a flex row a hidden pane simply
   stops existing and the remaining space goes to #main, in every combination. */
.frame { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; }
#sidebar { flex: 0 1 var(--sw); }
#info { flex: 0 1 var(--iw); }
#main { flex: 1 1 0%; min-width: min(320px, 100%); }   /* grow into whatever is left; the floor
   overrides flexbox's min-width:auto (which would size #main to its min-content) AND keeps the
   column readable if both panes are dragged wide in a narrow window — capped at 100% so a
   viewport under 320px still cannot overflow */
.gutter { flex: 0 0 5px; background: var(--border); cursor: col-resize; }
.gutter:hover { background: var(--border-2); }
.app[data-sidebar="off"] #sidebar, .app[data-info="off"] #info { display: none; }
.app[data-sidebar="off"] #gutL, .app[data-info="off"] #gutR { display: none; }

#sidebar, #info { background: var(--surface-2); border-right: 1px solid var(--border); overflow: auto; min-width: 0; }
#info { border-right: 0; border-left: 1px solid var(--border); }
#main { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
#stream { flex: 1 1 auto; overflow: auto; padding: 14px 16px 26px; }
.wrap { max-width: 900px; margin: 0 auto; }
#readingStatus { flex: 0 0 auto; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  padding: 7px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
#readingStatus[hidden], .app[data-info="on"] #readingStatus { display: none; }
.seat-status { display: flex; gap: 7px; align-items: center; min-width: 0; }
.seat-status > .who { font-size: 12px; }
#readingStatus .pill { font-size: 11px; gap: 4px; padding: 1px 6px; }
.round-actions { padding: 14px 0 0; margin: 12px 0 20px; border-top: 1px solid var(--border); }
.round-actions > .row > .hint { flex-basis: 100%; color: var(--text); font-size: 13px; font-weight: 600; }
.round-actions > details { margin-top: 9px; }
.round-actions > details > summary { color: var(--text); font-size: 13px; width: fit-content; }
.round-actions > details > .row { padding-top: 8px; }
.round-actions > fieldset { margin: 12px 0 0; }

/* -------------------------------------------------------------- sidebar */
.sbhead { padding: 10px; display: grid; gap: 8px; position: sticky; top: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.slist { padding: 6px; display: grid; gap: 3px; }
.srow { display: grid; gap: 2px; padding: 7px 8px; border-radius: var(--r); cursor: pointer; background: none; border: 1px solid transparent; text-align: left; width: 100%; }
.srow:hover { background: var(--surface-3); }
.srow[aria-current="true"] { background: var(--surface-3); border-color: transparent; }
.srow .st { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .sm { color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; }
.sacts { display: flex; gap: 2px; padding: 0 8px 6px; }
.srow-wrap { border-radius: 10px; padding: 2px; }
/* T2: the row actions were ghosted to .35 and 11px — legible only once the
   pointer was already on the row, which is exactly when you no longer need to
   read them. Full opacity, 13px, ink; hover adds a ground, not the text. */
.srow-wrap:hover .sacts button, .srow-wrap:focus-within .sacts button { background: var(--surface-3); }
.sacts button { opacity: 1; font-size: 13px; padding: 2px 6px; }
.pinned { color: var(--muted); font-size: 11px; letter-spacing: .5px; text-transform: uppercase; padding: 8px 10px 2px; }

/* ---------------------------------------------------------------- cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin: 0 0 12px; }
.sys { background: var(--surface-3); border: 0; border-radius: var(--r); padding: 8px 12px; margin: 0 0 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sys b { color: var(--text); font-weight: 650; }
/* T3 (round five): a round is a bigger break than a message, so it gets more
   air than a message. A message boundary is 4px + 11px of padding either side
   of one rule (15px); the round boundary was 22px, close enough to read as
   "another message" when you scroll fast. 44px above the divider is roughly
   three message boundaries, and the hierarchy is legible without a heavier rule. */
.rounddiv { display: flex; gap: 10px; align-items: center; margin: 44px 0 16px; flex-wrap: wrap; }
.rounddiv:first-child { margin-top: 0; }
.rounddiv .rule { flex: 1 1 60px; height: 1px; background: var(--border-2); }
.rounddiv .rlabel { font-weight: 700; letter-spacing: .4px; text-transform: uppercase; font-size: 11.5px; }

/* ------------------------------------------------------------- messages
   P1: a message is not a card. The transcript is one column of prose, so a
   message is an author line, a CLI line and a body, separated from the one
   above by a single rule. No border, no fill, no radius — the reading measure
   (74ch / 15.5px / 1.62) is unchanged, and it is now the only thing with edges.
   A FAILED message still cannot be mistaken for a good one: its author line is
   tinted in the status hue and its status text is that hue. A coloured side
   stripe is forbidden by the brief, so the tint sits on the head, not the edge. */
.msg { background: none; border: 0; border-radius: 0; margin: 0; padding: 11px 0 4px;
       border-top: 1px solid var(--border); min-width: 0; }
.msg:first-child { border-top: 0; }
.msg.fadein { animation: fade .18s ease-in; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.msg .mhead { display: flex; gap: 8px; align-items: center; padding: 0; border-bottom: 0; flex-wrap: wrap; }
.msg .mbody { padding: 4px 0 6px; }
.msg .prose { font-size: 15.5px; line-height: 1.62; max-width: 74ch; }
.msg.you .mhead, .msg.bad .mhead, .msg.cancelled .mhead, .msg.timeout .mhead {
  padding: 3px 8px; border-radius: 5px; margin: 0 0 2px;
}
.msg.you .mhead { background: var(--surface-2); }
.msg.bad .mhead { background: var(--tint-error); color: var(--st-error); }
.msg.cancelled .mhead { background: var(--tint-cancel); color: var(--st-cancel); }
.msg.timeout .mhead { background: var(--tint-timeout); color: var(--st-timeout); }
.msg.superseded { opacity: .82; }
.mono-tile {
  width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center;
  justify-content: center; color: #fff; flex: 0 0 auto; overflow: hidden;
}
.mono-tile svg { display: block; width: 100%; height: 100%; }
.mono-tile text { font: 650 17px var(--sans); fill: currentColor; }
.rosterrow .mono-tile, .seat-status .mono-tile { width: 24px; height: 24px; border-radius: 7px; }
.chip .mono-tile, .mention .mono-tile { width: 18px; height: 18px; border-radius: 5px; }
@media (prefers-color-scheme: dark) { .mono-tile { color: #151515; } }
:root[data-theme="light"] .mono-tile { color: #ffffff; }
:root[data-theme="dark"] .mono-tile { color: #151515; }
.tile-gpt { background: var(--id-gpt); }
.tile-kimi { background: var(--id-kimi); }
.tile-glm { background: var(--id-glm); }
.tile-claude { background: var(--id-claude); }
.tile-you { background: var(--id-you); }
.who { font-weight: 650; }
.who .idline { display: block; height: 2px; border-radius: 2px; margin-top: 1px; }
.tier { color: var(--muted); font-size: 12px; }
.pill {
  display: inline-flex; gap: 5px; align-items: center; border-radius: 999px; padding: 1px 8px;
  font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; font-variant-numeric: tabular-nums;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.p-queued { color: var(--st-queued); }
.p-working { color: var(--st-working); background: var(--tint-working); }
.pending-dots { display: inline-flex; align-items: center; gap: 3px; height: 12px; flex: 0 0 auto; }
.pending-dots > span { width: 4px; height: 4px; border-radius: 50%; background: currentColor;
  animation: waiting-dot 1.2s ease-in-out infinite; }
.pending-dots > span:nth-child(2) { animation-delay: .16s; }
.pending-dots > span:nth-child(3) { animation-delay: .32s; }
@keyframes waiting-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }
.pending-state { display: flex; gap: 12px; align-items: center; padding: 14px 0 18px; color: var(--muted); }
.pending-state .pending-dots { gap: 5px; }
.pending-state .pending-dots > span { width: 6px; height: 6px; }
.p-done { color: var(--st-done); }
.p-error { color: var(--on-accent); background: var(--st-error); border-color: var(--st-error); }
.p-timed_out { color: var(--on-accent); background: var(--st-timeout); border-color: var(--st-timeout); }
.p-cancelled { color: var(--on-accent); background: var(--st-cancel); border-color: var(--st-cancel); }
.badge { border: 1px solid var(--border-2); border-radius: 999px; padding: 0 7px; font-size: 11px; color: var(--muted); }
.badge.warn { color: var(--st-working); border-color: var(--st-working); }   /* a RUNNING stage only */
.badge.sup { color: var(--muted); border-color: var(--border-2); font-style: normal; }
.badge.bad { color: var(--text); border-color: var(--border-2); font-weight: 650; }   /* L2: a form collision, not a call outcome */
.cli { font: 11.5px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; padding: 2px 0 4px; }
/* P2: the six-button strip is collapsed until the message is hovered OR holds
   focus. It is NOT `display: none` — a display-none button cannot be tabbed to,
   so `:focus-within` could never fire and the strip would be mouse-only. A
   zero-height clip keeps every button in the tab order: Tab reaches the first
   one, `:focus-within` expands the strip, and the rest follow. Visibility only —
   nothing animates, so reduced-motion needs no exception here. */
.acts { display: flex; gap: 4px; flex-wrap: wrap; padding: 0; border-top: 0;
        max-height: 0; overflow: hidden; opacity: 0; }
.msg:hover > .acts, .msg:focus-within > .acts {
  max-height: none; overflow: visible; opacity: 1; padding: 4px 0 6px;
}
@media (hover: none) { .acts { max-height: none; overflow: visible; opacity: 1; padding: 4px 0 6px; } }

/* prose from the hand-rolled renderer */
.prose h1, .prose h2, .prose h3 { font-size: 1.06em; margin: 1.1em 0 .35em; }
.prose h4, .prose h5, .prose h6 { font-size: 1em; margin: 1em 0 .3em; color: var(--muted); }
.prose p { margin: .55em 0; }
.prose ul, .prose ol { margin: .5em 0; padding-left: 1.35em; }
.prose li { margin: .22em 0; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--surface-3); padding: 1px 4px; border-radius: 4px; }
.prose pre { background: var(--surface-3); border-radius: var(--r); padding: 9px 11px; overflow-x: auto; max-width: 100%; min-width: 0; margin: .6em 0; }
.prose pre code { background: none; padding: 0; font-size: 12.5px; }
.prose blockquote { margin: .6em 0; padding: .1em 0 .1em .8em; border-left: 2px solid var(--border-2); color: var(--muted); }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.errnote { background: var(--tint-error); color: var(--st-error); border-radius: var(--r); padding: 8px 10px; font: 12px/1.5 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 8px; }
.packet { background: var(--surface-3); border-radius: var(--r); padding: 9px 11px; margin-top: 8px; }
.packet pre { margin: 6px 0 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: none; }
/* P3: ONE affordance for the packet. The <details> element stays (it is what the
   button opens, and it keeps its open state across renders) but its own summary
   is suppressed, so the page no longer offers a disclosure AND a button for the
   same evidence. Closed, the holder has no box of its own. */
.pk > details > summary { display: none; }
.pk > details > summary + * { margin-top: 0; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--mono); }
details[open] > summary::before { content: "\2212 "; }

/* --------------------------------------------------------- compare view */
/* the column count rides a custom property, NOT an inline style, so the
   narrow-width rule below can still win */
.compare { display: grid; gap: 12px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); margin-bottom: 12px; }
.compare .msg { margin: 0; }
.compare > .msg { border-top: 1px solid var(--border); }   /* P1: every column keeps its rule */
@media (max-width: 900px) { .compare { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------------------------------------- thread */
/* A thread is an UNBORDERED container on a different surface, so the bordered
   cards inside it never sit in a bordered box of their own colour. */
.thread { background: var(--surface-2); border-radius: var(--r); padding: 10px 10px 1px; margin: 0 0 12px; }
.thread > .thead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.thread > .thead .tname { font-weight: 650; }
.thread.superseded { opacity: .84; }
.card.bad { border-color: var(--st-error); }
/* P7: the relay builder is a fieldset that lives inside the round's own bordered
   card. Two boxes, one inside the other, is exactly the repetition the brief
   forbids — so inside a card the fieldset keeps only a rule above it. */
.card > fieldset { border: 0; background: none; padding: 10px 0 0; margin: 10px 0 0; border-top: 1px solid var(--border); border-radius: 0; }
.card > fieldset > legend { padding: 0; }

/* -------------------------------------------------------- rank matrix */
.tablewrap { overflow-x: auto; max-width: 100%; min-width: 0; margin: 8px 0 4px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 650; }
td.unparsed { white-space: normal; color: var(--muted); }   /* a fallback, not a working state: never the working hue */

/* ------------------------------------------------------------ composer */
#flash { padding: 0 16px; }
.flash { border-radius: var(--r); padding: 7px 11px; margin-bottom: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
/* L2 (round five): `err` stays in the status channel because every flash that
   wears it IS a call outcome — a request the server refused or the network ate.
   `ok` is not an outcome: it confirms a clipboard copy, a saved default, an
   export path. Those wore --st-done, which spent the "a seat came back" colour
   on page bookkeeping. They get neutral chrome now. */
.flash.err { background: var(--tint-error); color: var(--st-error); }
.flash.ok { background: var(--surface-3); color: var(--text); }
#composer { flex: 0 0 auto; background: var(--bg); padding: 4px 16px 8px; }
#composer .cwrap { max-width: 900px; margin: 0 auto; display: grid; gap: 0; padding: 3px 8px;
  border: 1px solid var(--border-2); border-radius: 18px; background: var(--surface);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .04); }
#msg { min-height: 36px; max-height: 30vh; resize: vertical; border: 0; background: transparent; padding: 6px; }
#mentionRow { padding: 3px 6px; }
#mentionRow:empty { display: none; }
.composer-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#ctxBox { flex: 0 0 auto; }
#ctxBox[open] { flex-basis: 100%; }
#ctxSummary { font-size: 13px; color: var(--text); padding: 6px; border-radius: var(--r); }
#ctxSummary:hover { background: var(--surface-3); }
#ctx { margin-top: 4px; max-height: 25vh; border: 0; background: var(--surface-2); }
#delivery { width: auto; flex: 0 1 auto; max-width: 100%; margin-left: auto; border-color: transparent; background: var(--surface-2); }
#btnSend { margin-left: 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; border-radius: 17px; }
#btnSend[data-compact="true"] { width: 34px; height: 34px; padding: 0; flex: 0 0 34px; }
#btnSend svg { width: 18px; height: 18px; flex: 0 0 auto; }
#deliveryNote { flex-basis: 100%; order: 5; }
#deliveryNote:empty { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
/* borderless on purpose: a chip appears inside bordered fieldsets and bordered
   pickers, and a bordered chip would nest a box in a box of its own colour */
.chip { display: inline-flex; align-items: center; gap: 5px; border: 0; background: var(--surface-3); border-radius: 999px; padding: 3px 6px 3px 4px; font-size: 12px; }
.chip .x { border: 0; background: none; padding: 0 3px; color: var(--text); cursor: pointer; line-height: 1; }   /* T2: actionable */
.mention { display: inline-flex; vertical-align: baseline; align-items: center; gap: 4px; font-weight: 650; background: var(--accent-soft); border-radius: 6px; padding: 0 4px 0 2px; }
/* T1: `.creed` is gone with the composer's second copy of the sentence — the
   info pane prints it once, in the `hint` voice it shares with the rest of that
   column. A rule kept for nothing is a rule someone re-applies by accident. */

/* -------------------------------------------------------------- drawers
   M1: the close control exists in the markup at every width but is only shown
   when the pane is actually an overlay — above 980px the pane is a column and
   has nothing to dismiss. */
.drawerclose { display: none; }
.drawerbar { display: none; }
@media (max-width: 980px) {
  .drawerclose { display: inline-flex; }
  .drawerbar { display: flex; gap: 8px; align-items: center; padding: 8px 10px 0; }
}

/* ------------------------------------------------------------ info pane */
.sect { border-bottom: 1px solid var(--border); padding: 12px; }
.sect > h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 3px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.roster { display: grid; gap: 6px; }
.rosterrow { display: flex; gap: 8px; align-items: center; }
.hash { font: 11.5px/1.45 var(--mono); overflow-wrap: anywhere; background: var(--surface-3); border-radius: 5px; padding: 5px 7px; }
.field { display: grid; gap: 4px; margin-bottom: 9px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
fieldset { border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; margin: 0 0 12px; background: var(--surface-2); }
legend { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 0 5px; }
.memberbox { background: var(--surface); border-radius: var(--r); padding: 9px 11px; margin-bottom: 8px; }
.picker { border: 1px solid var(--border-2); border-radius: var(--r); background: var(--surface); padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.picker input { border: 0; flex: 1 1 120px; padding: 3px 4px; min-width: 90px; }
/* L3 (round five): the recipient input is borderless so the chip row reads as
   one field, and it USED to kill its own focus ring outright — the one control
   on the page a keyboard could enter invisibly. The ring moves out to the
   picker, which is the box the reader is actually typing into; the inner
   element keeps no outline of its own so the chip row stays calm. */
.picker input:focus { outline: none; }
.picker:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.suggest { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

/* ---------------------------------------------------------- responsive */
@media (max-width: 980px) {
  /* both panes become fixed overlays, so they leave the flex row and #main
     keeps the full width whether they are open or shut. M1: the overlay starts
     BELOW the chrome (--chrome-h is measured from the real header + fake band),
     so an open drawer can never cover the button that closes it. */
  #gutL, #gutR { display: none; }
  #sidebar, #info {
    position: fixed; top: var(--chrome-h, 41px); bottom: 0; width: min(320px, 88vw); z-index: 30;
    border: 1px solid var(--border); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35);
  }
  #sidebar { left: 0; } #info { right: 0; }
  .app[data-sidebar="off"] #sidebar, .app[data-info="off"] #info { display: none; }
  .app[data-sidebar="on"] #sidebar, .app[data-info="on"] #info { display: block; }
}
/* M2: at 380px the single header row squeezed the theme control until "System"
   was clipped inside `.seg { overflow: hidden }`. The row now WRAPS instead: the
   controls keep their intrinsic width on line one and the session title takes a
   line of its own. Nothing is shortened and nothing is cut off. */
@media (max-width: 700px) {
  #topbar { flex-wrap: wrap; row-gap: 6px; }
  #topbar .seg, #topbar #btnSidebar, #topbar #btnInfo { flex: 0 0 auto; }
  #topbar .title { order: 5; flex: 1 1 100%; min-width: 0; }
  #topbar #topMeta { order: 6; flex: 0 0 auto; }
}
@media (max-width: 560px) {
  #stream { padding: 10px 10px 20px; }
  #composer { padding: 4px 10px; }
  #readingStatus { gap: 8px; padding: 6px 10px; justify-content: space-between; }
  .seat-status { display: grid; grid-template-columns: 20px auto; gap: 3px 5px; }
  .seat-status .mono-tile { width: 20px; height: 20px; border-radius: 6px; }
  .seat-status > .pill, .seat-status > .hint { grid-column: 1 / -1; }
  #readingStatus .pill { padding: 0 4px; gap: 3px; font-size: 10.5px; }
  #delivery { max-width: 158px; padding-left: 5px; padding-right: 3px; }
  #btnSend { padding-left: 8px; padding-right: 8px; }
  #btnSend[data-compact="false"] { margin-left: auto; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  #topbar { gap: 7px; padding: 8px 10px; }
  #topbar .brand { display: none; }
  #topbar .seg button { padding: 4px 8px; font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .pending-dots > span { animation: none !important; transform: none !important; opacity: .55; }
  button:active:not(:disabled) { transform: none; }
  *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div class="app" id="app" data-sidebar="on" data-info="off">

  <header id="topbar">
    <button id="btnSidebar" class="quiet" aria-pressed="true" title="Toggle the session list">Sessions</button>
    <span class="brand">Roundtable</span>
    <span class="title grow" id="topTitle">No session</span>
    <span id="topMeta" class="hint num"></span>
    <span class="seg" role="group" aria-label="Colour theme">
      <button data-theme-set="system" aria-pressed="false">System</button>
      <button data-theme-set="light" aria-pressed="false">Light</button>
      <button data-theme-set="dark" aria-pressed="false">Dark</button>
    </span>
    <button id="btnInfo" class="quiet" aria-pressed="false" title="Status, notes, human decision and session settings">Info</button>
  </header>

  <div id="fakebar" hidden>FAKE SEATS — no model was called</div>

  <div class="frame">
    <aside id="sidebar" aria-label="Sessions">
      <div class="drawerbar">
        <span class="hint grow">Sessions</span>
        <button id="btnCloseSidebar" class="quiet mini drawerclose">Close</button>
      </div>
      <div class="sbhead">
        <button id="btnNew" class="primary">New session</button>
        <input id="search" type="search" data-k="search" placeholder="Search sessions" aria-label="Search sessions">
        <div class="row">
          <span id="sessCount" class="hint num"></span>
          <span class="grow"></span>
          <button id="btnReload" class="quiet mini">Reload list</button>
        </div>
      </div>
      <div id="slist" class="slist"></div>
    </aside>

    <div class="gutter" id="gutL" role="separator" aria-label="Resize session list"></div>

    <main id="main">
      <div id="readingStatus" aria-label="Seat status" hidden></div>
      <div id="stream" tabindex="-1"></div>
      <div id="flash" aria-live="polite"></div>
      <div id="composer">
        <div class="cwrap">
          <div class="row" id="mentionRow"></div>
          <textarea id="msg" data-k="composer" rows="1" aria-label="Message to the seats" placeholder="Ask the seats…"></textarea>
          <div class="composer-tools">
            <details id="ctxBox">
              <summary id="ctxSummary" title="Appended to every packet in this round">Context</summary>
              <textarea id="ctx" data-k="ctx" rows="3" aria-label="Context appended to every packet" placeholder="Background pasted here is appended to the packet each seat receives."></textarea>
            </details>
            <label class="sr-only" for="delivery">Delivery</label>
            <select id="delivery">
              <option value="independent">Independent parallel</option>
              <option value="relay">Tagged relay</option>
              <option value="persona">Persona step</option>
            </select>
            <label id="turnsWrap" hidden>Turns <input id="turns" type="number" min="1" max="5" value="1" style="width: 62px"></label>
            <span id="deliveryNote" class="hint grow"></span>
            <button id="btnSend" class="primary"><span id="sendLabel">Send</span><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 16V4m-5 5 5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <!-- T1 (round five): the creed used to be printed twice — here, two
             wrapped lines above the fold at every width, and again at the foot
             of the info pane beside Notes, where the brief groups it. Once is
             once. The info pane keeps it; the composer gives the space back to
             the thing the reader is actually doing, which is writing. -->
      </div>
    </main>

    <div class="gutter" id="gutR" role="separator" aria-label="Resize info pane"></div>

    <aside id="info" aria-label="Session info"></aside>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Roundtable v2 page — variant B.
   Sections: helpers · markdown · store · api · state · theme+layout ·
   sidebar · setup surface · transcript · info pane · composer · events.
   ========================================================================= */

const API_TOKEN = "__ROUNDTABLE_TOKEN__";   // replaced per process when the server serves this file

/* ---------------------------------------------------------------- helpers */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ID_RE = /^[0-9a-f]{8,64}$/;
/* PALETTE ONLY. Which seats have an identity hue — never which seats exist,
   which may be addressed, or which may argue. Everything functional below is
   derived from /api/config and the session's own members. */
const TILE_SEATS = ["gpt", "kimi", "claude", "glm", "you"];
const MAX_RELAY_PROMPT = 4000;        /* the server's own cap on a relay prompt */
function configSeats() { return Object.keys((S.config && S.config.seats) || {}); }
function sessionSeats() {
  const members = (S.session && S.session.members) || null;
  return members ? Object.keys(members) : configSeats();
}
/* config order first (it is the server's stable seat order), then anything else */
function orderedSeats(list) {
  const order = configSeats();
  return order.filter(s => list.indexOf(s) >= 0).concat(list.filter(s => order.indexOf(s) < 0));
}
function addressableSeats() { return sessionSeats(); }
const STATUS_LABEL = { queued: "Queued", working: "Working", done: "Done",
                       error: "Error", timed_out: "Timed out", cancelled: "Cancelled" };
const STATUS_RANK = { done: 0, cancelled: 1, timed_out: 2, error: 3 };
/* C1/C7: the four statuses a call can END on. Anything in this set is the
   record's final word about a run — there is nothing more to wait for. */
const TERMINAL = { done: 1, error: 1, timed_out: 1, cancelled: 1 };

function pad2(n) { return (n < 10 ? "0" : "") + n; }
function mmss(seconds) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60);
}
/* finished calls read in seconds under a minute, mm:ss above it; timers always mm:ss */
function elapsedLabel(sec) {
  if (sec == null || sec === "") return "";
  const n = Number(sec);
  if (!isFinite(n)) return "";
  return n >= 60 ? mmss(n) : n.toFixed(1) + "s";
}
function shortId(id) { return id ? String(id).slice(0, 8) : ""; }
function clockNow() { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
function whenLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return sameDay ? pad2(d.getHours()) + ":" + pad2(d.getMinutes())
                 : d.toISOString().slice(0, 10) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
/* "a shared stage whose child failed is never painted as success" */
function worstStatus(list) {
  const seen = (list || []).filter(Boolean);
  if (!seen.length) return null;
  let worst = "done";
  seen.forEach(s => { if ((STATUS_RANK[s] == null ? 3 : STATUS_RANK[s]) > (STATUS_RANK[worst] == null ? 3 : STATUS_RANK[worst])) worst = s; });
  return worst;
}
function seatLabel(seat) {
  const cfg = S.config && S.config.seats && S.config.seats[seat];
  return (cfg && cfg.label) || String(seat || "").toUpperCase();
}

/* ---------------------------------------------------- markdown (hand-rolled)
   Model text is UNTRUSTED: everything is HTML-escaped BEFORE any markup is
   produced, and a link renders as its text plus the target in parentheses —
   never an anchor, so no scheme is ever clickable.                          */
function esc(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function inlineMd(escaped) {
  const codes = [];
  let out = escaped.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
  out = out.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, (m, label, target) => (label || target) + " (" + target + ")");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/\u0000C(\d+)\u0000/g, (m, i) => "<code>" + codes[Number(i)] + "</code>");
  return out;
}
/* Blocks, not one string: the disagreement card needs a per-line handle, and
   building block nodes beats re-parsing rendered HTML back out of the DOM. */
function mdBlocks(raw) {
  const lines = String(raw == null ? "" : raw).replace(/\u0000/g, "").replace(/\r\n?/g, "\n").split("\n");
  const blocks = []; let para = []; let i = 0;
  const flushPara = () => {
    if (!para.length) return;
    const text = para.join(" ");
    blocks.push({ kind: "p", text: text, html: "<p>" + inlineMd(esc(text)) + "</p>" });
    para = [];
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushPara(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const t = buf.join("\n");
      blocks.push({ kind: "code", text: t, html: '<pre tabindex="0" aria-label="Code block; scroll horizontally for long lines"><code>' + esc(t) + "</code></pre>" });
      continue;
    }
    if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
    if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); blocks.push({ kind: "hr", text: "", html: "<hr>" }); i++; continue; }
    let m = line.match(/^ {0,3}(#{1,6})\s+(.*)$/);
    if (m) {
      flushPara(); const lv = m[1].length, t = m[2].trim();
      blocks.push({ kind: "h", text: t, html: "<h" + lv + ">" + inlineMd(esc(t)) + "</h" + lv + ">" });
      i++; continue;
    }
    if (/^ {0,3}>/.test(line)) {
      flushPara(); const buf = [];
      while (i < lines.length && /^ {0,3}>/.test(lines[i])) { buf.push(lines[i].replace(/^ {0,3}>\s?/, "")); i++; }
      const inner = mdBlocks(buf.join("\n"));
      blocks.push({ kind: "quote", text: buf.join(" "),
                    html: "<blockquote>" + inner.map(b => b.html).join("\n") + "</blockquote>" });
      continue;
    }
    m = line.match(/^ {0,3}([-*+])\s+(.*)$/);
    if (m) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const mm = lines[i].match(/^ {0,3}([-*+])\s+(.*)$/);
        if (!mm) break;
        items.push({ text: mm[2], html: inlineMd(esc(mm[2])) }); i++;
      }
      blocks.push({ kind: "list", tag: "ul", items: items, text: items.map(x => x.text).join(" "),
                    html: "<ul>" + items.map(x => "<li>" + x.html + "</li>").join("") + "</ul>" });
      continue;
    }
    m = line.match(/^ {0,3}\d+[.)]\s+(.*)$/);
    if (m) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const mm = lines[i].match(/^ {0,3}\d+[.)]\s+(.*)$/);
        if (!mm) break;
        items.push({ text: mm[1], html: inlineMd(esc(mm[1])) }); i++;
      }
      blocks.push({ kind: "list", tag: "ol", items: items, text: items.map(x => x.text).join(" "),
                    html: "<ol>" + items.map(x => "<li>" + x.html + "</li>").join("") + "</ol>" });
      continue;
    }
    para.push(line.trim()); i++;

}
function renderMd(raw) { return mdBlocks(raw).map(b => b.html).join("\n"); }

  const text = raw == null ? "" : String(raw);
  if (!text.trim()) { node.appendChild(el("p", "stub", stub || "empty answer — the seat returned no text")); return node; }
  node.innerHTML = renderMd(text);
  return node;
}
function prose(raw, stub) { return paintMd(el("div", "prose"), raw, stub); }

/* ------------------------------------------------------- storage (guarded) */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode / quota */ }
}

/* -------------------------------------------------------------------- api */
async function api(path, body) {
  const opts = body === undefined
    ? { headers: { "X-Roundtable": API_TOKEN } }
    : { method: "POST",
        headers: { "Content-Type": "application/json", "X-Roundtable": API_TOKEN },
        body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status + " " + (text || "").slice(0, 200)));
    err.field = data && data.field;
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ------------------------------------------------------------------ state */

  inflight: 0,         /* POSTs in flight; a stage request counts as busy immediately */
  creating: false,     /* C4: one create at a time, whichever control started it */

  fetchApplied: 0,     /* C3: the newest ticket that has been painted */
  notesPending: null,  /* C1: {sid, notes} a debounce is holding but has not sent */
  parked: {},          /* C1: sid -> {fieldKey: value} unsaved drafts, kept across a switch */

  messageRevision: 0,
  editSequence: 0,
  readingPending: null,

  compare: new Set(),  /* round indexes shown side by side */

  relay: {},           /* roundIndex -> {order, turns, prompt, open} */
  reviewers: {},       /* roundIndex -> {seat: bool} */
  relaySeed: {},       /* relay run_id -> where it was seeded from */
  draft: null,         /* the session-creation draft */
  delivery: "independent",
  turns: 1,
  search: "",
  showHidden: false,
  next: null,          /* the editable "settings for the next session" draft */
  fields: {},          /* cached live text nodes: a field being typed into is never rebuilt */
  dirty: {},           /* per-field unsaved-draft flags */
  notesTimer: 0,
  tickTimer: 0,

/* ------------------------------------------------------------------ theme */
function setTheme(mode) {
  if (mode === "system") { try { delete document.documentElement.dataset.theme; } catch (e) { document.documentElement.removeAttribute("data-theme"); } }
  else { document.documentElement.dataset.theme = mode; }
  $$("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));
  lsSet("rt2.theme", mode);
}

/* ------------------------------------------------------- layout + panes */
/* `explicit === false` means the page chose this for you (narrow viewport), and
   an automatic choice is NEVER persisted: a pane opened in a 374px window used
   to stay shut forever after the window grew. Only a real toggle is remembered.
   New key name on purpose — an old auto-written value must not keep binding. */
function narrow() {
  return !!(typeof window !== "undefined" && window.innerWidth && window.innerWidth <= 980);
}
function setPane(which, on, explicit) {

  if (btn) btn.setAttribute("aria-pressed", String(!!on));
  if (explicit !== false) lsSet("rt2." + which + ".choice", !!on);
  /* M1: below 980px a pane is an overlay and there is only room for one of
     them. Opening one shuts the other, recorded the same way the open was —
     an automatic close must not become a sticky preference. */
  if (on && narrow()) {
    const other = which === "sidebar" ? "info" : "sidebar";
    if (document.getElementById("app").dataset[other] === "on") setPane(other, false, explicit);
  }
}
/* M1: whichever drawer is open, Escape closes it, and the close control in each
   drawer does the same thing. Neither can hide the button that opens it: the
   header is z-index 40 and the overlay starts below it (--chrome-h). */
function closeDrawers(which) {
  ["sidebar", "info"].forEach(w => {
    if (which && w !== which) return;
    if (document.getElementById("app").dataset[w] === "on") setPane(w, false);
  });
}
function onGlobalKey(ev) {
  if (!ev || ev.key !== "Escape" || !narrow()) return;
  const app = document.getElementById("app");
  if (!app || (app.dataset.sidebar !== "on" && app.dataset.info !== "on")) return;
  closeDrawers();
  if (ev.preventDefault) ev.preventDefault();
}
/* The fake band only exists in fake mode, so the height the drawers must clear
   is measured rather than guessed; the fallback is the plain header's height. */
function syncChromeHeight() {
  const app = document.getElementById("app");
  if (!app || !app.style || !app.style.setProperty) return;
  let h = 0;
  ["#topbar", "#fakebar"].forEach(sel => {
    const n = $(sel);
    if (!n || n.hidden) return;
    try {
      const r = n.getBoundingClientRect ? n.getBoundingClientRect() : null;
      if (r && r.height) h += r.height;
    } catch (e) { /* no layout engine here */ }
  });

}
function paneWanted(which) {
  const saved = lsGet("rt2." + which + ".choice", null);
  if (saved === true || saved === false) return saved;          /* your choice wins, always */
  if (which === "info") return false;       /* reading first; an explicit saved choice still wins */
  return !(typeof window !== "undefined" && window.innerWidth && window.innerWidth <= 980);
}
/* Re-evaluated on resize, and a no-op for a pane you have toggled yourself. */
function applyAutoPanes() {
  ["sidebar", "info"].forEach(which => {
    const saved = lsGet("rt2." + which + ".choice", null);
    if (saved === true || saved === false) return;
    setPane(which, paneWanted(which), false);
  });
}
function setWidth(which, px) {
  const min = 180, max = 560;
  const w = Math.max(min, Math.min(max, Math.round(px)));
  document.documentElement.style.setProperty(which === "sidebar" ? "--sw" : "--iw", w + "px");
  lsSet("rt2." + which + ".w", w);
}
function wireGutter(node, which) {
  if (!node) return;
  let dragging = false;
  node.addEventListener("pointerdown", ev => {
    dragging = true;
    try { node.setPointerCapture(ev.pointerId); } catch (e) { /* stub / old browser */ }
    ev.preventDefault();
  });
  node.addEventListener("pointermove", ev => {
    if (!dragging) return;
    setWidth(which, which === "sidebar" ? ev.clientX : (window.innerWidth - ev.clientX));
  });
  node.addEventListener("pointerup", () => { dragging = false; });
  node.addEventListener("pointercancel", () => { dragging = false; });
  /* keyboard: the separator is focusable and resizes in 20px steps */
  node.tabIndex = 0;
  node.addEventListener("keydown", ev => {
    const cur = which === "sidebar" ? lsGet("rt2.sidebar.w", 268) : lsGet("rt2.info.w", 330);
    if (ev.key === "ArrowLeft") { setWidth(which, cur + (which === "sidebar" ? -20 : 20)); ev.preventDefault(); }
    if (ev.key === "ArrowRight") { setWidth(which, cur + (which === "sidebar" ? 20 : -20)); ev.preventDefault(); }
  });
}

/* --------------------------------------------------- focus-preserving render
   Every rebuilt region restores the focused control (by data-k) and its caret,
   so a background event never steals the reader's cursor.                    */
function withFocus(host, build) {
  const active = document.activeElement;
  const key = active && active.dataset ? active.dataset.k : null;
  const inside = key && host.contains && host.contains(active);
  const caret = (inside && active.selectionStart != null) ? active.selectionStart : null;
  const caretEnd = (inside && active.selectionEnd != null) ? active.selectionEnd : caret;
  build();
  if (!inside) return;
  const again = host.querySelector('[data-k="' + key + '"]');
  if (!again) return;
  try {
    again.focus();
    if (caret != null && again.setSelectionRange) again.setSelectionRange(caret, caretEnd);
  } catch (e) { /* not focusable any more */ }
}
function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

/* ----------------------------------------------- live (human-typed) fields
   A judgment-bearing field is built ONCE per session and re-appended on every
   render, so a seat event landing mid-sentence cannot replace the node under
   the cursor. Its value is refreshed from the record only while the field is
   clean AND unfocused — an unsaved draft always outranks the last saved text. */
/* draft fields are global (the next-session form outlives any session);
   notes and decision fields belong to one session and die with it */
function fieldId(key) { return (String(key).indexOf("draft-") === 0 ? "draft" : (S.sid || "none")) + "|" + key; }
function liveField(key, build) {
  const id = fieldId(key);
  if (!S.fields[id]) {
    const node = build();
    node.dataset.k = key;
    node.addEventListener("input", () => { S.dirty[id] = true; });
    node.addEventListener("change", () => { S.dirty[id] = true; });
    /* C1, second half: an unsaved draft parked when the reader navigated away
       comes back with the session it belongs to, still marked unsaved. */
    const bag = S.parked[S.sid];
    if (bag && Object.prototype.hasOwnProperty.call(bag, key)) {
      node.value = bag[key];
      S.dirty[id] = true;
    }
    S.fields[id] = node;
  }
  return S.fields[id];
}
function fieldDirty(key) { return !!S.dirty[fieldId(key)]; }
function syncField(key, node, saved) {
  if (fieldDirty(key)) return;                       /* an unsaved draft wins */
  if (document.activeElement === node) return;       /* never write under a caret */
  node.value = saved == null ? "" : String(saved);
}
/* the draft is only cleared when what we saved is still what the field holds */
function fieldSaved(key, savedValue) {
  const id = fieldId(key);
  const node = S.fields[id];
  if (node && node.value === savedValue) {
    delete S.dirty[id];
    const bag = S.parked[S.sid];
    if (bag) delete bag[key];     /* what is on the record is no longer a draft */
  }
}
/* C1 (round five): `forgetFields` threw away every session-scoped node, and with
   it any half-written decision the reader had not pressed Save on. The decision
   is the only judgment-bearing field on the page, so it must not be POSTed
   behind the reader's back — but it must not evaporate on a misclick either.
   The VALUES of still-dirty fields are parked under their session id (the nodes
   are not: a session's drafts still die with it, as `fields()` reports) and are
   restored the next time that session builds its fields. */
function parkFields() {
  const sid = S.sid;
  if (!sid) return;
  const bag = {};
  Object.keys(S.dirty).forEach(id => {
    if (id.indexOf(sid + "|") !== 0) return;
    const node = S.fields[id];
    if (node) bag[id.slice(sid.length + 1)] = node.value;
  });
  if (Object.keys(bag).length) S.parked[sid] = bag; else delete S.parked[sid];
}
function forgetFields() {          /* session-scoped fields only */
  Object.keys(S.fields).forEach(id => { if (id.indexOf("draft|") !== 0) delete S.fields[id]; });
  Object.keys(S.dirty).forEach(id => { if (id.indexOf("draft|") !== 0) delete S.dirty[id]; });
}
function forgetDraftFields() {
  Object.keys(S.fields).forEach(id => { if (id.indexOf("draft|") === 0) delete S.fields[id]; });
  Object.keys(S.dirty).forEach(id => { if (id.indexOf("draft|") === 0) delete S.dirty[id]; });
}
/* live=true caches the node (the info pane re-renders on every seat event and
   must not replace a control being typed into); live=false builds fresh */
function mkField(key, build, live) {
  if (live) return liveField(key, build);
  const node = build();
  node.dataset.k = key;
  return node;
}

/* ------------------------------------------------------------------ flash */
/* A flash may carry a TAG. C4: a tagged line can be revoked by the event that
   makes it false — a "did not load" notice clears the moment a session does
   load — without a blanket clear that would also swallow an export path or a
   save confirmation the reader has not read yet. */
function flash(message, kind, tag) {
  const host = $("#flash");
  if (!host) return;
  clear(host);
  S.flashTag = tag || null;
  const box = el("div", "flash " + (kind || "err"));
  box.appendChild(el("span", "grow", message));
  const x = el("button", "quiet mini", "Dismiss");
  x.addEventListener("click", () => { clear(host); S.flashTag = null; });
  box.appendChild(x);
  host.appendChild(box);
}
function clearFlashTag(tag) {
  if (S.flashTag !== tag) return;          /* someone else's line: leave it alone */
  const host = $("#flash");
  if (host) clear(host);
  S.flashTag = null;
}

/* ================================================================ SIDEBAR */
function localTitles() { return lsGet("rt2.titles", {}) || {}; }
function pins() { return lsGet("rt2.pins", []) || []; }
function hidden() { return lsGet("rt2.hidden", []) || []; }
function displayTitle(row) {
  const over = localTitles()[row.id];
  return (over && String(over)) || row.title || "(untitled)";
}
function togglePin(id) {
  const list = pins();
  const at = list.indexOf(id);
  if (at >= 0) list.splice(at, 1); else list.push(id);
  lsSet("rt2.pins", list); renderSidebar();
}
function toggleHidden(id) {
  const list = hidden();
  const at = list.indexOf(id);
  if (at >= 0) list.splice(at, 1); else list.push(id);
  lsSet("rt2.hidden", list); renderSidebar();
}
function renameSession(id, title) {
  const map = localTitles();
  if (title && title.trim()) map[id] = title.trim().slice(0, 200); else delete map[id];
  lsSet("rt2.titles", map); renderSidebar(); renderTop();
}
function sessionLink(id) {
  const base = (window.location && window.location.origin) || "";
  return base + "/?session=" + encodeURIComponent(id);
}
async function copyText(text, what) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      flash("Copied " + (what || "text") + " to the clipboard.", "ok");
      return true;
    }
  } catch (e) { /* fall through to the honest note below */ }
  flash("Could not reach the clipboard. " + (what || "Text") + ": " + text, "err");
  return false;
}
function sidebarRow(row) {
  const wrap = el("div", "srow-wrap");
  const btn = el("button", "srow");
  btn.setAttribute("aria-current", String(row.id === S.sid));
  btn.dataset.k = "srow-" + row.id;
  const t = el("span", "st", displayTitle(row));      /* spans: a <button> takes phrasing content */
  const meta = el("span", "sm");
  meta.appendChild(el("span", null, row.mode || "roundtable"));
  meta.appendChild(el("span", "num", whenLabel(row.created)));
  meta.appendChild(el("span", "num", (row.rounds || 0) + (row.rounds === 1 ? " round" : " rounds")));
  if (row.fake) meta.appendChild(el("span", null, "fake"));
  if (pins().indexOf(row.id) >= 0) meta.appendChild(el("span", null, "pinned"));
  if (localTitles()[row.id]) meta.appendChild(el("span", null, "local title"));
  btn.appendChild(t); btn.appendChild(meta);
  btn.addEventListener("click", () => selectSession(row.id));
  wrap.appendChild(btn);

  const acts = el("div", "sacts");
  const pin = el("button", "quiet mini", pins().indexOf(row.id) >= 0 ? "Unpin" : "Pin");
  pin.addEventListener("click", () => togglePin(row.id));
  const ren = el("button", "quiet mini", "Rename");
  ren.addEventListener("click", () => {
    clear(acts);
    const input = el("input");
    input.type = "text"; input.value = displayTitle(row); input.dataset.k = "rename-" + row.id;
    input.setAttribute("aria-label", "Local title for this session");
    const save = el("button", "mini", "Save");
    const commit = () => renameSession(row.id, input.value);
    save.addEventListener("click", commit);
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") renderSidebar(); });
    acts.appendChild(input); acts.appendChild(save);
    acts.appendChild(el("span", "hint", "stored in this browser only — the server has no rename"));
    input.focus();
  });
  const link = el("button", "quiet mini", "Copy link");
  link.addEventListener("click", () => copyText(sessionLink(row.id), "session link"));
  const hide = el("button", "quiet mini", hidden().indexOf(row.id) >= 0 ? "Unhide" : "Hide");
  hide.addEventListener("click", () => toggleHidden(row.id));
  acts.appendChild(pin); acts.appendChild(ren); acts.appendChild(link); acts.appendChild(hide);
  wrap.appendChild(acts);
  return wrap;
}
function renderSidebar() {
  const host = $("#slist");
  if (!host) return;
  withFocus($("#sidebar"), () => {
    clear(host);
    const q = S.search.trim().toLowerCase();
    const hid = hidden(), pinned = pins();
    const match = r => !q || (displayTitle(r) + " " + r.id + " " + (r.mode || "")).toLowerCase().indexOf(q) >= 0;
    const rows = S.sessions.filter(match);
    const shown = rows.filter(r => hid.indexOf(r.id) < 0);
    const pinRows = shown.filter(r => pinned.indexOf(r.id) >= 0);
    const restRows = shown.filter(r => pinned.indexOf(r.id) < 0);
    if (pinRows.length) {
      host.appendChild(el("div", "pinned", "Pinned"));
      pinRows.forEach(r => host.appendChild(sidebarRow(r)));
      host.appendChild(el("div", "pinned", "All sessions"));
    }
    if (!shown.length) host.appendChild(el("p", "hint", rows.length ? "every match is hidden" : "no sessions match"));
    restRows.forEach(r => host.appendChild(sidebarRow(r)));
    const hidRows = rows.filter(r => hid.indexOf(r.id) >= 0);
    if (hidRows.length) {
      const t = el("button", "quiet mini", (S.showHidden ? "Hide" : "Show") + " " + hidRows.length + " hidden");
      t.addEventListener("click", () => { S.showHidden = !S.showHidden; renderSidebar(); });
      host.appendChild(t);
      if (S.showHidden) hidRows.forEach(r => host.appendChild(sidebarRow(r)));
    }
    const count = $("#sessCount");
    if (count) count.textContent = S.sessions.length + (S.sessions.length === 1 ? " session" : " sessions");
  });
}
async function loadSessions() {
  try {
    const rows = await api("/api/sessions");
    S.sessions = Array.isArray(rows) ? rows : [];
  } catch (e) {
    flash("Could not load the session list: " + e.message);
  }
  renderSidebar();
}

/* ============================================================ TOP + STATUS */
function renderTop() {
  const t = $("#topTitle"), m = $("#topMeta");
  if (!t || !m) return;
  if (S.view === "new") { t.textContent = "New session"; m.textContent = ""; return; }
  if (!S.session) { t.textContent = "No session"; m.textContent = ""; return; }
  const row = S.sessions.filter(r => r.id === S.sid)[0];
  t.textContent = (row ? displayTitle(row) : (localTitles()[S.sid] || S.session.title)) || "(untitled)";
  const bits = [S.session.mode, (S.session.rounds || []).length + " rounds", "id " + shortId(S.sid)];
  if (S.session.fake) bits.push("fake");
  m.textContent = bits.join(" · ");
}
function busy() {
  if (S.inflight > 0) return true;
  let live = false;
  S.live.forEach(entry => { if (entry.sid === S.sid && !entry.settled) live = true; });
  return live;
}

/* live entries -------------------------------------------------------------
   Keyed by run_id where the server gives one, and by a pending key before
   seat_started arrives. Every entry carries (sid, gen): a completion that
   belongs to another session or an older generation is dropped, never painted. */
function liveKey(round, stage, seat) { return "pending|" + round + "|" + stage + "|" + seat; }
/* A stage POST returns before its seat_started events are read, so the queued
   placeholder must never overwrite a call that has ALREADY started — the first
   build of this page painted a permanent "Queued" for exactly that reason. */
function markPending(round, stage, seats) {
  seats.forEach(seat => {
    if (!seat) return;
    const existing = liveFor(round, stage, seat);
    if (existing && existing.runId) return;
    S.live.set(liveKey(round, stage, seat), {
      sid: S.sid, gen: S.gen, round: round, stage: stage, seat: seat,
      tier: memberTier(seat), runId: null, status: "queued", startMs: null, settled: false,
      priorRunId: slotRunId(round, stage, seat)     /* the run this slot held BEFORE we asked */
    });
  });
}
/* The run_id currently filling a (round, stage, seat) slot in the record. A
   queued placeholder is stale the moment this changes: the call it was waiting
   for has landed, whether or not we saw its events (an EventSource that is
   still connecting misses everything published before it attaches). */
function slotRunId(round, stage, seat) {
  const rnd = ((S.session || {}).rounds || [])[round];
  if (!rnd) return null;
  if (stage === "stage1" || stage === "rerun") return ((rnd.stage1 || {})[seat] || {}).run_id || null;
  if (stage === "review") return (((rnd.review || {}).results || {})[seat] || {}).run_id || null;
  if (stage === "disagreements") return (rnd.disagreements || {}).run_id || null;
  return null;
}
function memberTier(seat) {
  const mem = S.session && S.session.members && S.session.members[seat];
  return mem ? mem.tier : "";
}
function liveFor(round, stage, seat) {
  let hit = null;
  S.live.forEach(entry => {
    if (entry.sid === S.sid && entry.round === round && entry.stage === stage && entry.seat === seat) hit = entry;
  });
  return hit;
}
function liveForRelay(relayRunId) {
  const out = [];
  S.live.forEach(entry => { if (entry.sid === S.sid && entry.relayRunId === relayRunId) out.push(entry); });
  return out;
}
/* a settled entry is dropped as soon as the refetched session carries its run */
function pruneLive() {
  const ids = new Set();
  const terminal = new Set();          /* C1: runs the RECORD says are finished */
  const sess = S.session;
  if (sess) {
    const seen = res => {
      if (!res || !res.run_id) return;
      ids.add(res.run_id);
      if (TERMINAL[res.status]) terminal.add(res.run_id);
    };
    (sess.rounds || []).forEach(rnd => {
      Object.keys(rnd.stage1 || {}).forEach(s => seen(rnd.stage1[s]));
      (rnd.reruns || []).forEach(r => seen(r.result));
      seen(rnd.disagreements);
      (rnd.disagreements_history || []).forEach(seen);
      const rev = (rnd.review && rnd.review.results) || {};
      Object.keys(rev).forEach(s => seen(rev[s]));
      (rnd.review_history || []).forEach(old => {
        const rr = (old && old.results) || {};
        Object.keys(rr).forEach(s => seen(rr[s]));
      });
      (rnd.relays || []).forEach(run => (run.entries || []).forEach(seen));
    });
  }
  const started = new Set();
  S.live.forEach(entry => { if (entry.runId) started.add(entry.round + "|" + entry.stage + "|" + entry.seat); });
  const drop = [];
  S.live.forEach((entry, key) => {
    if (entry.sid !== S.sid || entry.gen !== S.gen) { drop.push(key); return; }
    /* C1: the record is the truth. A live entry whose run has landed in the
       fetched session with a terminal status is reconciled away EVEN IF this
       page never saw its seat_done. An EventSource that reconnects after the
       completion was published misses it for good; the entry then sat at
       "working" forever and the renderer preferred that placeholder over the
       answer the refetch had already brought back. */
    if (entry.runId && (terminal.has(entry.runId) || (entry.settled && ids.has(entry.runId)))) drop.push(key);
    /* a queued placeholder whose real call has started — or has already
       landed in the record while we were not listening — is stale */
    if (!entry.runId && started.has(entry.round + "|" + entry.stage + "|" + entry.seat)) drop.push(key);
    if (!entry.runId && slotRunId(entry.round, entry.stage, entry.seat) !== (entry.priorRunId || null)) drop.push(key);
  });
  drop.forEach(k => S.live.delete(k));
}
function clearLive() { S.live.clear(); }

/* one interval drives every visible timer; nothing else re-renders for time */
function startTicker() {
  if (S.tickTimer) return;
  S.tickTimer = setInterval(() => {
    $$("[data-timer]").forEach(node => {
      const key = node.dataset.timer;
      const entry = S.live.get(key);
      if (!entry || entry.sid !== S.sid || entry.settled || !entry.startMs) return;
      node.textContent = mmss((Date.now() - entry.startMs) / 1000);
    });
  }, 1000);
}

/* =============================================================== MESSAGES */
function tileFor(seat) {
  const cls = TILE_SEATS.indexOf(seat) >= 0 ? "tile-" + seat : "tile-you";
  const letter = ({ gpt: "G", kimi: "K", claude: "C", glm: "G", you: "Y" })[seat] || "?";
  const tile = el("span", "mono-tile " + cls);
  tile.dataset.seat = seat;
  tile.dataset.letter = letter;
  tile.setAttribute("aria-hidden", "true");
  /* Original type tile, not a logo. All content comes from the fixed map above;
     adjacent names carry identity to assistive technology. No image request. */

  return tile;
}
function pendingDots() {

}

function messageShell(kind, seat, status) {

function detailsBox(key, summaryText, buildBody) {

    const pre = el("pre", "mono");

function togglePacket(key) {

/* R1 (round five): round four suppressed the <details> summary for EVERY packet

   evidence that says whether the extraction was even asked the right question —
   had no door at all: a summary set to `display: none` and no button anywhere.

/* one answer: stage 1, a rerun, a review, or a relay turn */
function answerMessage(opts) {
  const res = opts.result || {};
  const status = opts.status || res.status || "queued";
  const shell = messageShell("seat", opts.seat, status);
  const head = shell.head, box = shell.box;
  if (opts.superseded) box.classList.add("superseded");

  head.appendChild(el("span", "grow"));

  if (opts.stageBadge) head.appendChild(el("span", "badge", opts.stageBadge));
  head.appendChild(statusPill(status, { elapsed: res.elapsed_s, timerKey: opts.timerKey, startMs: opts.startMs }));
  if (res.run_id) head.appendChild(el("span", "badge mono", "run " + shortId(res.run_id)));

  box.appendChild(el("p", "cli", res.header ? res.header : "(no CLI header)"));

  if (status === "queued" || status === "working") {

    waiting.appendChild(pendingDots());
    waiting.appendChild(el("span", "hint", status === "queued" ? "Queued — the call has not started"
                                                              : "Working — the complete reply will appear here"));
    body.appendChild(waiting);
  } else {
    body.appendChild(prose(res.text, status === "done" ? "empty answer — the seat returned no text"
                                                       : "no output was captured"));
    if (status !== "done") {
      const note = el("div", "errnote");
      note.textContent = (res.stderr_tail && res.stderr_tail.trim())
        ? res.stderr_tail
        : (status === "cancelled" ? "cancelled before the call returned — no output"

  markReading(box, "answer|" + (res.run_id || opts.packetKey || (opts.round + "|" + opts.seat)));
  return box;
}

function messageActions(opts, res, status) {
  const bar = el("div", "acts");
  /* L4 (round five): every one of these buttons was anonymous to `withFocus`.
     The transcript rebuilds on every seat event, and a rebuild replaces the
     node the reader had tabbed to — so focus fell back to the body mid-session,
     roughly once per arriving answer. `withFocus` restores by `data-k`; these
     had none, so it could never find them. The key has to be stable across
     rebuilds and unique per message, which is what the packet key already is;
     live placeholders (no packet) fall back to round+seat+run. */
  const actKey = opts.packetKey || ("live|" + opts.round + "|" + opts.seat + "|" + (res.run_id || "pending"));
  const add = (slug, label, title, fn, disabled) => {
    const b = el("button", "quiet mini", label);
    b.dataset.k = "act|" + slug + "|" + actKey;
    if (title) b.title = title;
    if (disabled) b.disabled = true;
    b.addEventListener("click", fn);
    bar.appendChild(b);
    return b;
  };
  const seat = opts.seat;
  add("reply", "Reply with @" + seat, "Address this seat in the composer", () => {
    setComposer(("@" + seat + " " + ($("#msg") ? $("#msg").value : "")).trim() + " ");
    focusComposer();
  });
  add("relay", "Use in relay prompt", "Seed this round's relay prompt with this answer", () => {
    seedRelay(opts.round, res.text || "", seatLabel(seat) + " (round " + (opts.round + 1) + ")");
  });
  add("quote", "Quote", "Quote this answer into the composer", () => {
    const quoted = String(res.text || "").split("\n").map(l => "> " + l).join("\n");   /* the whole answer: a silent cut is a lie */
    setComposer((($("#msg") ? $("#msg").value : "") + "\n" + quoted + "\n").replace(/^\n+/, ""));
    focusComposer();
  });
  add("copy", "Copy", "Copy this answer", () => copyText(res.text || "", "answer"));
  /* R1: the same builder the disagreements card uses — one control per packet,
     made in one place, so neither can be added without the other. */
  bar.appendChild(packetButton(opts.packetKey || ("pk|" + (res.run_id || "")), res.packet));
  if (opts.canRerun) {
    add("rerun", "Re-run this seat", "Re-answer the same stage-1 packet; the current answer is kept and marked superseded",
        () => rerunSeat(opts.round, seat), busy());
  }
  if (status === "working" || status === "queued") {
    add("cancel", "Cancel this seat", "Kill this seat's call", () => cancelSeat(seat));
  }
  return bar;
}
