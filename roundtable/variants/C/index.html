<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable — Decision atlas</title>
<!-- Decision atlas. Identity and motion contract: imagined/RATIONALE.md. Original client engine retained with a new presentation. -->
<style>
:root {
  --bg: #f2efe7; --surface: #fffcf5; --surface-2: #eae6dc; --surface-3: #e0dbcf;
  --border: #d4cec0; --border-2: #b6ae9e; --text: #26252b; --muted: #68635c; --faint: #736d64;
  --accent: #5941a9; --accent-hover: #49328f; --on-accent: #ffffff; --accent-soft: #eae3fa;
  --id-gpt: #17686c; --id-kimi: #97375d; --id-claude: #885539; --id-glm: #355faa; --id-you: #5b615b;
  --st-queued: #626773; --st-working: #805c09; --st-done: #276446; --st-error: #a02f29; --st-timeout: #945016; --st-cancel: #934234;
  --tint-working: #f6ecd0; --tint-timeout: #f7e8d6; --tint-error: #f8e5df; --tint-cancel: #f3e1da; --tint-done: #e3efe5; --on-status: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif: Georgia, "Iowan Old Style", Palatino, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 4px; --sw: 268px; --iw: 330px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191a20; --surface: #23242c; --surface-2: #2d2e38; --surface-3: #393a46;
    --border: #42434f; --border-2: #656674; --text: #eeeae1; --muted: #b4b0a7; --faint: #a19c94;
    --accent: #c3adff; --accent-hover: #d2c0ff; --on-accent: #21182f; --accent-soft: #39304f;
    --id-gpt: #73c5c7; --id-kimi: #ec96b6; --id-claude: #dab08f; --id-glm: #93b6ef; --id-you: #b6c1b5;
    --st-queued: #afb4c2; --st-working: #e0bc63; --st-done: #87cba6; --st-error: #f4a29a; --st-timeout: #efb47e; --st-cancel: #eba99a;
    --tint-working: #3b321d; --tint-timeout: #403021; --tint-error: #442b2a; --tint-cancel: #402e29; --tint-done: #253a2d; --on-status: #191a20;
  }
}
:root[data-theme="light"] {
  --bg: #f2efe7; --surface: #fffcf5; --surface-2: #eae6dc; --surface-3: #e0dbcf;
  --border: #d4cec0; --border-2: #b6ae9e; --text: #26252b; --muted: #68635c; --faint: #736d64;
  --accent: #5941a9; --accent-hover: #49328f; --on-accent: #ffffff; --accent-soft: #eae3fa;
  --id-gpt: #17686c; --id-kimi: #97375d; --id-claude: #885539; --id-glm: #355faa; --id-you: #5b615b;
  --st-queued: #626773; --st-working: #805c09; --st-done: #276446; --st-error: #a02f29; --st-timeout: #945016; --st-cancel: #934234;
  --tint-working: #f6ecd0; --tint-timeout: #f7e8d6; --tint-error: #f8e5df; --tint-cancel: #f3e1da; --tint-done: #e3efe5; --on-status: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #191a20; --surface: #23242c; --surface-2: #2d2e38; --surface-3: #393a46;
  --border: #42434f; --border-2: #656674; --text: #eeeae1; --muted: #b4b0a7; --faint: #a19c94;
  --accent: #c3adff; --accent-hover: #d2c0ff; --on-accent: #21182f; --accent-soft: #39304f;
  --id-gpt: #73c5c7; --id-kimi: #ec96b6; --id-claude: #dab08f; --id-glm: #93b6ef; --id-you: #b6c1b5;
  --st-queued: #afb4c2; --st-working: #e0bc63; --st-done: #87cba6; --st-error: #f4a29a; --st-timeout: #efb47e; --st-cancel: #eba99a;
  --tint-working: #3b321d; --tint-timeout: #403021; --tint-error: #442b2a; --tint-cancel: #402e29; --tint-done: #253a2d; --on-status: #191a20;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5, h6 { overflow-wrap: anywhere; min-width: 0; margin: 0; font-weight: 600; }
p { margin: 0; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
button { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r); padding: 7px 12px; min-height: 36px; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
button:hover:not(:disabled) { background: var(--surface-3); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 1; color: var(--faint); background: var(--surface-2); border-color: var(--border); cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.primary:disabled { color: var(--faint); background: var(--surface-3); border-color: transparent; }
button.quiet { background: none; border-color: transparent; color: var(--text); padding: 5px 7px; }
button.quiet:hover:not(:disabled) { background: var(--surface-3); }
button.quiet:disabled { color: var(--muted); }
button.mini { font-size: 13px; padding: 4px 8px; min-height: 30px; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
input[type="text"], input[type="search"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r); padding: 7px 9px; width: 100%; min-width: 0; }
input:disabled, select:disabled, textarea:disabled { color: var(--faint); background: var(--surface-2); cursor: not-allowed; }
textarea { resize: vertical; line-height: 1.5; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
label { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { border: 0; border-radius: 2px; padding: 4px 8px; min-height: 28px; background: transparent; font-size: 13px; }
.seg button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.hint.bad { color: var(--text); font-weight: 650; }
.faint { color: var(--faint); }
.stub { color: var(--muted); font-style: italic; }
.app { display: flex; flex-direction: column; height: 100%; }
#topbar { display: flex; gap: 16px; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex: 0 0 auto; position: relative; z-index: 40; }
#topbar .brand { font: 25px/1 var(--serif); letter-spacing: -.8px; color: var(--accent); }
#topbar .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar .edition { font: 10px/1.3 var(--mono); letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-top: 5px; }
#fakebar { flex: 0 0 auto; padding: 5px 20px; font-weight: 650; letter-spacing: 1.2px; text-transform: uppercase; font-size: 10px; background: var(--surface-3); color: var(--text); border-bottom: 1px solid var(--border-2); position: relative; z-index: 40; }
.frame { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; }
#sidebar { flex: 0 1 var(--sw); }
#info { flex: 0 1 var(--iw); }
#main { flex: 1 1 0%; min-width: min(320px, 100%); display: flex; flex-direction: column; min-height: 0; background: var(--surface); container-type: inline-size; }
.gutter { flex: 0 0 5px; background: var(--border); cursor: col-resize; }
.gutter:hover { background: var(--border-2); }
.app[data-sidebar="off"] #sidebar, .app[data-info="off"] #info { display: none; }
.app[data-sidebar="off"] #gutL, .app[data-info="off"] #gutR { display: none; }
#sidebar, #info { background: var(--bg); border-right: 1px solid var(--border); overflow: auto; min-width: 0; }
#info { border-right: 0; border-left: 1px solid var(--border); }
#stream { flex: 1 1 auto; overflow: auto; padding: 28px 32px 40px; scroll-padding: 20px; }
.wrap { max-width: 1080px; margin: 0 auto; }
#readingStatus { flex: 0 0 auto; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; padding: 11px 32px; border-bottom: 1px solid var(--border); background: var(--surface); }
#readingStatus[hidden], .app[data-info="on"] #readingStatus { display: none; }
.seat-status { display: flex; gap: 7px; align-items: center; min-width: 0; }
.seat-status > .who { font-size: 12px; }
#readingStatus .pill { font-size: 11px; gap: 4px; padding: 1px 5px; }
.sbhead { padding: 20px 16px 12px; display: grid; gap: 12px; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 1; }
.sbhead #btnNew { text-align: left; min-height: 42px; }
.slist { padding: 8px; display: grid; gap: 8px; }
.srow { display: grid; gap: 6px; padding: 12px 10px 8px; border-radius: 3px; cursor: pointer; background: none; border: 1px solid transparent; text-align: left; width: 100%; }
.srow:hover { background: var(--surface-2); }
.srow[aria-current="true"] { background: var(--accent-soft); border-color: transparent; }
.srow .st { display: block; font-family: var(--serif); font-size: 18px; line-height: 1.25; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .sm { color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; }
.sacts { display: flex; gap: 2px; padding: 0 8px 6px; }
.srow-wrap { border-bottom: 1px solid var(--border); padding: 0 0 4px; }
.srow-wrap:hover .sacts button, .srow-wrap:focus-within .sacts button { background: var(--surface-3); }
.sacts button { opacity: 1; font-size: 13px; padding: 2px 6px; }
.pinned { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 10px 2px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin: 0 0 16px; }
.sys { background: none; border: 0; padding: 0 0 14px; margin: 0; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
.sys b { color: var(--text); font-weight: 650; }
.rounddiv { display: flex; gap: 10px; align-items: center; margin: 104px 0 16px; flex-wrap: wrap; }
.rounddiv:first-child { margin-top: 0; }
.rounddiv .rule { flex: 1 1 60px; height: 1px; background: var(--border-2); }
.rounddiv .rlabel { font: 600 13px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-variant-numeric: tabular-nums; }
.msg { display: grid; grid-template-columns: 154px minmax(0, 1fr); column-gap: 28px; background: none; border: 0; border-radius: 0; border-top: 1px solid var(--border); margin: 0; padding: 26px 0 20px; min-width: 0; }
.msg:first-child { border-top: 0; }
.msg .mhead { grid-column: 1; grid-row: 1 / span 3; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 0; border: 0; min-width: 0; }
.msg .mhead > .grow { display: none; }
.msg .cli, .msg .mbody, .msg > .acts { grid-column: 2; min-width: 0; }
.msg .mbody { padding: 8px 0 10px; }
.msg .prose { font-size: 16px; line-height: 1.7; max-width: 68ch; }
.msg.you { display: block; padding: 8px 0 30px; border-top: 0; }
.msg.you .mhead { flex-direction: row; align-items: center; margin-bottom: 12px; }
.msg.you .mhead > .grow { display: block; }
.msg.you .prose { font: 34px/1.2 var(--serif); letter-spacing: -.8px; max-width: 28ch; }
.msg.you .prose p { margin: 0; }
/* the quoted answer under a question: reading size, not headline size */
.msg.you .prose.you-quote { font: 15px/1.6 var(--sans); letter-spacing: 0; max-width: 68ch; margin: 0 0 14px; padding: .1em 0 .1em .9em; border-left: 2px solid var(--border-2); color: var(--muted); }
.msg.you .prose.you-quote p { margin: .5em 0; }
.msg.bad .mhead { color: var(--st-error); }
.msg.cancelled .mhead { color: var(--st-cancel); }
.msg.timeout .mhead { color: var(--st-timeout); }
.msg.bad { background: var(--tint-error); padding: 20px 16px; margin: 8px 0; }
.msg.cancelled { background: var(--tint-cancel); padding: 20px 16px; margin: 8px 0; }
.msg.timeout { background: var(--tint-timeout); padding: 20px 16px; margin: 8px 0; }
.msg.superseded { opacity: 1; }
.msg.superseded .prose { color: var(--muted); }
.mono-tile { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.mono-tile svg { display: block; width: 100%; height: 100%; }
.tile-gpt { color: var(--id-gpt); }
.tile-kimi { color: var(--id-kimi); }
.tile-glm { color: var(--id-glm); }
.tile-claude { color: var(--id-claude); }
.tile-you { color: var(--id-you); }
.tile-neutral { color: var(--muted); }
.rosterrow .mono-tile, .seat-status .mono-tile { width: 20px; height: 20px; }
.chip .mono-tile, .mention .mono-tile { width: 16px; height: 16px; }
.who { font-weight: 650; font-size: 14px; }
.tier { color: var(--muted); font: 12px var(--mono); }
.pill { display: inline-flex; gap: 5px; align-items: center; border-radius: 3px; padding: 2px 6px; font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.p-queued { color: var(--st-queued); }
.p-working { color: var(--st-working); background: var(--tint-working); }
.p-done { color: var(--st-done); }
.p-error { color: var(--on-status); background: var(--st-error); border-color: var(--st-error); }
.p-timed_out { color: var(--on-status); background: var(--st-timeout); border-color: var(--st-timeout); }
.p-cancelled { color: var(--on-status); background: var(--st-cancel); border-color: var(--st-cancel); }
.p-error .dot, .p-timed_out .dot, .p-cancelled .dot { width: 10px; height: 10px; background: none; border-radius: 0; position: relative; }
.p-error .dot::before, .p-timed_out .dot::before, .p-cancelled .dot::before { content: "×"; position: absolute; inset: -5px 0 0; font-size: 15px; }
.waiting-dial { display: inline-block; width: 12px; height: 12px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; flex: 0 0 auto; animation: orbit 2.4s linear infinite; }
.pending-state { display: flex; gap: 16px; align-items: center; padding: 28px 0 34px; color: var(--st-working); min-height: 100px; }
.msg[data-status="queued"] .pending-state { color: var(--st-queued); }
.pending-state .waiting-dial { width: 32px; height: 32px; border-width: 2px; }
.pending-state .hint { font-size: 14px; max-width: 30ch; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.msg.arrival { animation: arrive .3s ease-out; }
.badge { border: 1px solid var(--border-2); border-radius: 3px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
.badge.warn { color: var(--st-working); border-color: var(--st-working); }
.badge.sup { color: var(--muted); border-color: var(--border-2); font-style: normal; }
.badge.bad { color: var(--text); border-color: var(--border-2); font-weight: 650; }
.cli { font: 11.5px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; padding: 0; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 0 0; border: 0; max-height: none; overflow: visible; opacity: 1; }
.acts button { text-decoration: underline; text-decoration-color: var(--border-2); text-underline-offset: 4px; }
.prose h1, .prose h2, .prose h3 { font-size: 1.08em; margin: 1.1em 0 .35em; }
.prose h4, .prose h5, .prose h6 { font-size: 1em; margin: 1em 0 .3em; }
.prose p { margin: .65em 0; }
.prose ul, .prose ol { margin: .6em 0; padding-left: 1.35em; }
.prose li { margin: .25em 0; }
.prose code { color: var(--text); font-family: var(--mono); font-size: .88em; background: var(--surface-3); padding: 1px 4px; border-radius: 3px; }
.prose pre { background: var(--surface-3); border-radius: var(--r); padding: 12px; overflow-x: auto; max-width: 100%; min-width: 0; margin: .6em 0; }
.prose pre code { background: none; padding: 0; font-size: 12.5px; }
.prose blockquote { margin: .6em 0; padding: .1em 0 .1em .8em; border-left: 2px solid var(--border-2); color: var(--muted); }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.errnote { color: var(--st-error); padding: 8px 0; font: 12px/1.5 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 8px; }
.packet { background: var(--surface-3); border-radius: var(--r); padding: 12px; margin-top: 8px; }
.packet pre { margin: 6px 0 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: none; }
.pk > details > summary { display: none; }
.pk > details > summary + * { margin-top: 0; }
details > summary { cursor: pointer; color: var(--text); font-size: 13px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--mono); }
details[open] > summary::before { content: "\2212 "; }
/* --cols comes from compareCols(): 1, 2, 3 across, and 2 at four seats (a 2x2).
   Row gap is 0 so a second row's card rule sits 20px under the row above and
   26px over its author row — the transcript's own rhythm — instead of floating
   40px below it; the 20px column gap is unchanged. */
.compare { display: grid; gap: 0 20px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); margin-bottom: 12px; }
.compare .msg { display: block; margin: 0; }
.compare .mhead { flex-direction: row; flex-wrap: wrap; margin-bottom: 12px; }
.compare > .msg { border-top: 1px solid var(--border); }
@media (max-width: 900px) { .compare { grid-template-columns: minmax(0, 1fr); } }
.thread { background: var(--bg); border-radius: var(--r); padding: 18px; margin: 18px 0; }
.thread > .thead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; }
.thread > .thead .tname { font: 22px var(--serif); }
.thread.superseded { opacity: 1; }
.card.bad { border-color: var(--st-error); }
.card > fieldset { border: 0; background: none; padding: 10px 0 0; margin: 10px 0 0; border-top: 1px solid var(--border); border-radius: 0; }
.card > fieldset > legend { padding: 0; }
.tablewrap { overflow-x: auto; max-width: 100%; min-width: 0; margin: 8px 0 4px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 650; }
td.unparsed { white-space: normal; color: var(--muted); }
.round-actions { padding: 20px 0 0; margin: 12px 0 24px; border-top: 1px solid var(--border); }
.round-actions > .row > .hint { flex-basis: 100%; color: var(--text); font-size: 13px; font-weight: 600; }
.round-actions > details { margin-top: 12px; }
.round-actions > details > summary { color: var(--text); font-size: 13px; width: fit-content; }
.round-actions > details > .row { padding-top: 8px; }
.round-actions > fieldset { margin: 12px 0 0; }
#flash { padding: 0 24px; }
.flash { border-radius: var(--r); padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
.flash.err { background: var(--tint-error); color: var(--st-error); }
.flash.ok { background: var(--surface-3); color: var(--text); }
#composer { flex: 0 0 auto; background: var(--bg); padding: 12px 24px 16px; border-top: 1px solid var(--border); }
#composer .cwrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 0; padding: 4px 10px 8px; border: 0; border-top: 2px solid var(--accent); border-radius: 0; background: var(--surface); }
#msg { min-height: 40px; max-height: 30vh; resize: vertical; border: 0; background: transparent; padding: 9px 6px; font-size: 16px; }
#mentionRow { padding: 3px 6px; }
#mentionRow:empty { display: none; }
/* Reply chip (2026-09-07): a pending quote sits ABOVE the textarea as one
   line, the way a chat reply does. The display line is cut with an ellipsis;
   the record behind it is the complete answer and goes out whole on send. */
#quoteRow { padding: 4px 6px 2px; min-width: 0; }
#quoteRow[hidden] { display: none; }
.quote-chip { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 3px 4px 3px 9px; border-left: 2px solid var(--border-2); border-radius: 3px; background: var(--surface-2); font-size: 12.5px; line-height: 1.4; }
.quote-chip .quote-glyph { width: 14px; height: 14px; flex: 0 0 auto; color: var(--muted); }
.quote-chip .quote-glyph svg { display: block; width: 100%; height: 100%; }
.quote-chip .quote-label { flex: 0 0 auto; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote-chip .quote-who { font-weight: 650; }

.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 0; background: var(--surface-3); border-radius: 3px; padding: 3px 6px; font-size: 12px; }

  #readingStatus .pill { padding: 1px 4px; gap: 3px; font-size: 10.5px; }

</head>
<body>
<div class="app" id="app" data-sidebar="on" data-info="off">

  <header id="topbar">
    <button id="btnSidebar" class="quiet" aria-pressed="true" title="Toggle the session list">Sessions</button>
    <span class="brand">Roundtable<span class="edition">Decision atlas / imagined</span></span>
    <span class="title grow" id="topTitle">No session</span>
    <span id="topMeta" class="hint num"></span>
    <span class="seg" role="group" aria-label="Colour theme">
      <button data-theme-set="system" aria-pressed="false">System</button>
      <button data-theme-set="light" aria-pressed="false">Light</button>
      <button data-theme-set="dark" aria-pressed="false">Dark</button>
    </span>
    <button id="btnInfo" class="quiet" aria-pressed="false" title="Status, notes, human decision and session settings">Info</button>
  </header>

  <div id="fakebar" hidden>FAKE SEATS — no model was called · sandbox edition</div>

  <div class="frame">
    <aside id="sidebar" aria-label="Sessions">
      <div class="drawerbar">
        <span class="hint grow">Sessions</span>
        <button id="btnCloseSidebar" class="quiet mini drawerclose">Close</button>
      </div>
      <div class="sbhead">
        <button id="btnNew" class="primary">New session</button>
        <input id="search" type="search" data-k="search" placeholder="Search sessions" aria-label="Search sessions">
        <div class="row">
          <span id="sessCount" class="hint num"></span>
          <span class="grow"></span>
          <button id="btnReload" class="quiet mini">Reload list</button>
        </div>
      </div>
      <div id="slist" class="slist"></div>
    </aside>

    <div class="gutter" id="gutL" role="separator" aria-label="Resize session list"></div>

    <main id="main">
      <div id="readingStatus" aria-label="Seat status" hidden></div>
      <div id="stream" tabindex="-1"></div>
      <div id="flash" aria-live="polite"></div>
      <div id="composer">
        <div class="cwrap">
          <div id="quoteRow" hidden></div>
          <div class="row" id="mentionRow"></div>
          <textarea id="msg" data-k="composer" rows="1" aria-label="Message to the seats" placeholder="Ask the seats…"></textarea>
          <div class="composer-tools">
            <details id="ctxBox">
              <summary id="ctxSummary" title="Appended to every packet in this round">Context</summary>
              <textarea id="ctx" data-k="ctx" rows="3" aria-label="Context appended to every packet" placeholder="Background pasted here is appended to the packet each seat receives."></textarea>
            </details>
            <label class="sr-only" for="delivery">Delivery</label>
            <select id="delivery">
              <option value="independent">Independent parallel</option>
              <option value="relay">Tagged relay</option>
              <option value="persona">Persona step</option>
            </select>
            <label id="turnsWrap" hidden>Turns <input id="turns" type="number" min="1" max="5" value="1" style="width: 62px"></label>
            <span id="deliveryNote" class="hint grow"></span>
            <button id="btnSend" class="primary"><span id="sendLabel">Send</span><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 16V4m-5 5 5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <!-- T1 (round five): the creed used to be printed twice — here, two
             wrapped lines above the fold at every width, and again at the foot
             of the info pane beside Notes, where the brief groups it. Once is
             once. The info pane keeps it; the composer gives the space back to
             the thing the reader is actually doing, which is writing. -->
      </div>
    </main>

    <div class="gutter" id="gutR" role="separator" aria-label="Resize info pane"></div>

    <aside id="info" aria-label="Session info"></aside>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Roundtable v2 page — variant B.
   Sections: helpers · markdown · store · api · state · theme+layout ·
   sidebar · setup surface · transcript · info pane · composer · events.
   ========================================================================= */

const API_TOKEN = "__ROUNDTABLE_TOKEN__";   // replaced per process when the server serves this file

/* ---------------------------------------------------------------- helpers */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ID_RE = /^[0-9a-f]{8,64}$/;
/* PALETTE ONLY. Which seats have an identity hue — never which seats exist,
   which may be addressed, or which may argue. Everything functional below is
   derived from /api/config and the session's own members. */
const TILE_SEATS = ["gpt", "kimi", "claude", "glm", "you"];
/* The server's caps on a relay prompt and a question. Published in the config
   (roundtable.py config_payload "caps") so a server change cannot drift the
   page's pre-send refusal; the literals are only the fallback before boot. */
function relayCap() { return Number((((S && S.config) || {}).caps || {}).relay_prompt) || 4000; }
function questionCap() { return Number((((S && S.config) || {}).caps || {}).question) || 20000; }
function configSeats() { return Object.keys((S.config && S.config.seats) || {}); }
function sessionSeats() {
  const members = (S.session && S.session.members) || null;
  return members ? Object.keys(members) : configSeats();
}
/* config order first (it is the server's stable seat order), then anything else */
function orderedSeats(list) {
  const order = configSeats();
  return order.filter(s => list.indexOf(s) >= 0).concat(list.filter(s => order.indexOf(s) < 0));
}
function addressableSeats() { return sessionSeats(); }
const STATUS_LABEL = { queued: "Queued", working: "Working", done: "Done",
                       error: "Error", timed_out: "Timed out", cancelled: "Cancelled" };
const STATUS_RANK = { done: 0, cancelled: 1, timed_out: 2, error: 3 };
/* C1/C7: the four statuses a call can END on. Anything in this set is the
   record's final word about a run — there is nothing more to wait for. */
const TERMINAL = { done: 1, error: 1, timed_out: 1, cancelled: 1 };

function pad2(n) { return (n < 10 ? "0" : "") + n; }
function mmss(seconds) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60);
}
/* finished calls read in seconds under a minute, mm:ss above it; timers always mm:ss */
function elapsedLabel(sec) {
  if (sec == null || sec === "") return "";
  const n = Number(sec);
  if (!isFinite(n)) return "";
  return n >= 60 ? mmss(n) : n.toFixed(1) + "s";
}
function shortId(id) { return id ? String(id).slice(0, 8) : ""; }
function clockNow() { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
function whenLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return sameDay ? pad2(d.getHours()) + ":" + pad2(d.getMinutes())
                 : d.toISOString().slice(0, 10) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
/* "a shared stage whose child failed is never painted as success" */
function worstStatus(list) {
  const seen = (list || []).filter(Boolean);
  if (!seen.length) return null;
  let worst = "done";
  seen.forEach(s => { if ((STATUS_RANK[s] == null ? 3 : STATUS_RANK[s]) > (STATUS_RANK[worst] == null ? 3 : STATUS_RANK[worst])) worst = s; });
  return worst;
}
function seatLabel(seat) {
  const cfg = S.config && S.config.seats && S.config.seats[seat];
  return (cfg && cfg.label) || String(seat || "").toUpperCase();
}

/* ---------------------------------------------------- markdown (hand-rolled)
   Model text is UNTRUSTED: everything is HTML-escaped BEFORE any markup is
   produced, and a link renders as its text plus the target in parentheses —
   never an anchor, so no scheme is ever clickable.                          */
function esc(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function inlineMd(escaped) {
  const codes = [];
  let out = escaped.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
  out = out.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, (m, label, target) => (label || target) + " (" + target + ")");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/\u0000C(\d+)\u0000/g, (m, i) => "<code>" + codes[Number(i)] + "</code>");
  return out;
}
/* Blocks, not one string: the disagreement card needs a per-line handle, and
   building block nodes beats re-parsing rendered HTML back out of the DOM. */
function mdBlocks(raw) {
  const lines = String(raw == null ? "" : raw).replace(/\u0000/g, "").replace(/\r\n?/g, "\n").split("\n");
  const blocks = []; let para = []; let i = 0;
  const flushPara = () => {
    if (!para.length) return;
    const text = para.join(" ");
    blocks.push({ kind: "p", text: text, html: "<p>" + inlineMd(esc(text)) + "</p>" });
    para = [];
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushPara(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const t = buf.join("\n");
      blocks.push({ kind: "code", text: t, html: '<pre tabindex="0" aria-label="Code block; scroll horizontally for long lines"><code>' + esc(t) + "</code></pre>" });
      continue;
    }
    if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
    if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); blocks.push({ kind: "hr", text: "", html: "<hr>" }); i++; continue; }
    let m = line.match(/^ {0,3}(#{1,6})\s+(.*)$/);
    if (m) {
      flushPara(); const lv = m[1].length, t = m[2].trim();
      blocks.push({ kind: "h", text: t, html: "<h" + lv + ">" + inlineMd(esc(t)) + "</h" + lv + ">" });
      i++; continue;
    }
    if (/^ {0,3}>/.test(line)) {
      flushPara(); const buf = [];
      while (i < lines.length && /^ {0,3}>/.test(lines[i])) { buf.push(lines[i].replace(/^ {0,3}>\s?/, "")); i++; }
      const inner = mdBlocks(buf.join("\n"));
      blocks.push({ kind: "quote", text: buf.join(" "),
                    html: "<blockquote>" + inner.map(b => b.html).join("\n") + "</blockquote>" });
      continue;
    }
    m = line.match(/^ {0,3}([-*+])\s+(.*)$/);
    if (m) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const mm = lines[i].match(/^ {0,3}([-*+])\s+(.*)$/);
        if (!mm) break;
        items.push({ text: mm[2], html: inlineMd(esc(mm[2])) }); i++;
      }
      blocks.push({ kind: "list", tag: "ul", items: items, text: items.map(x => x.text).join(" "),
                    html: "<ul>" + items.map(x => "<li>" + x.html + "</li>").join("") + "</ul>" });
      continue;
    }
    m = line.match(/^ {0,3}\d+[.)]\s+(.*)$/);
    if (m) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const mm = lines[i].match(/^ {0,3}\d+[.)]\s+(.*)$/);
        if (!mm) break;
        items.push({ text: mm[1], html: inlineMd(esc(mm[1])) }); i++;
      }
      blocks.push({ kind: "list", tag: "ol", items: items, text: items.map(x => x.text).join(" "),
                    html: "<ol>" + items.map(x => "<li>" + x.html + "</li>").join("") + "</ol>" });
      continue;
    }
    para.push(line.trim()); i++;
  }
  flushPara();
  return blocks;
}
function renderMd(raw) { return mdBlocks(raw).map(b => b.html).join("\n"); }
function paintMd(node, raw, stub) {
  const text = raw == null ? "" : String(raw);
  if (!text.trim()) { node.appendChild(el("p", "stub", stub || "empty answer — the seat returned no text")); return node; }
  node.innerHTML = renderMd(text);
  return node;
}
function prose(raw, stub) { return paintMd(el("div", "prose"), raw, stub); }

/* ------------------------------------------------------- storage (guarded) */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode / quota */ }
}

/* -------------------------------------------------------------------- api */
async function api(path, body) {
  const opts = body === undefined
    ? { headers: { "X-Roundtable": API_TOKEN } }
    : { method: "POST",
        headers: { "Content-Type": "application/json", "X-Roundtable": API_TOKEN },
        body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }

/* ------------------------------------------------------------------ state */

  fetchApplied: 0,     /* C3: the newest ticket that has been painted */

/* ------------------------------------------------------------------ theme */

/* ------------------------------------------------------- layout + panes */

/* ------------------------------------------------------------------ flash */

/* ================================================================ SIDEBAR */

function hidden() { return lsGet("rt2.hidden", []) || []; }

  return (over && String(over)) || row.title || "(untitled)";
}
function togglePin(id) {

  const at = list.indexOf(id);
  if (at >= 0) list.splice(at, 1); else list.push(id);
  lsSet("rt2.pins", list); renderSidebar();
}
function toggleHidden(id) {

}

  lsSet("rt2.titles", map); renderSidebar(); renderTop();
}

}

  btn.dataset.k = "srow-" + row.id;
  const t = el("span", "st", displayTitle(row));      /* spans: a <button> takes phrasing content */
  const meta = el("span", "sm");
  meta.appendChild(el("span", null, row.mode || "roundtable"));
  meta.appendChild(el("span", "num", whenLabel(row.created)));
  meta.appendChild(el("span", "num", (row.rounds || 0) + (row.rounds === 1 ? " round" : " rounds")));
  if (row.fake) meta.appendChild(el("span", null, "fake"));

  if (localTitles()[row.id]) meta.appendChild(el("span", null, "local title"));

function renderSidebar() {
  const host = $("#slist");

    clear(host);
    const q = S.search.trim().toLowerCase();
    const hid = hidden(), pinned = pins();
    const match = r => !q || (displayTitle(r) + " " + r.id + " " + (r.mode || "")).toLowerCase().indexOf(q) >= 0;
    const rows = S.sessions.filter(match);
    const shown = rows.filter(r => hid.indexOf(r.id) < 0);
    const pinRows = shown.filter(r => pinned.indexOf(r.id) >= 0);
    const restRows = shown.filter(r => pinned.indexOf(r.id) < 0);

/* ============================================================ TOP + STATUS */

      if (!res || !res.run_id) return;

      Object.keys(rnd.stage1 || {}).forEach(s => seen(rnd.stage1[s]));

      seen(rnd.disagreements);

      const rev = (rnd.review && rnd.review.results) || {};
      Object.keys(rev).forEach(s => seen(rev[s]));
      (rnd.review_history || []).forEach(old => {

  S.live.forEach((entry, key) => {
    if (entry.sid !== S.sid || entry.gen !== S.gen) { drop.push(key); return; }
    /* C1: the record is the truth. A live entry whose run has landed in the
       fetched session with a terminal status is reconciled away EVEN IF this

    if (entry.runId && (terminal.has(entry.runId) || (entry.settled && ids.has(entry.runId)))) drop.push(key);

     seats, typed the whole relay topic, and Run relay sat there disabled with
     "pick at least two seats" underneath it until some unrelated event happened
     to rebuild the form. The fix is not to re-render on every keystroke — that
     would rip the textarea out from under the caret — but to recompute the two
     things that actually change (the button's disabled state and the blocker
     line) on the nodes that are already there. */
  let syncRelayReady = () => {};

  prompt.rows = 3; prompt.value = draft.prompt; prompt.dataset.k = "relayprompt-" + rnd.index;
  prompt.placeholder = "What are they arguing about? (max 4000 characters)";

  const run = el("button", "primary mini", "Run relay");

  run.addEventListener("click", () => runRelay(rnd.index));
  go.appendChild(run);
  const why = el("span", "hint");
  why.dataset.k = "relaywhy-" + rnd.index;
  go.appendChild(why);
  fs.appendChild(go);
  syncRelayReady = () => {
    const fewSeats = draft.order.length < 2;
    const noTopic = !String(draft.prompt || "").trim();
    run.disabled = fewSeats || noTopic || busy();
    why.textContent = fewSeats ? "pick at least two seats"
      : noTopic ? "write the topic they are arguing about"
      : "seats outside the order stay silent and their answers never enter the packet";
  };
  syncRelayReady();
  return fs;
}

/* Stable prose-block anchors keep a paragraph in place when answers above it
   arrive, or when the reader returns at a different width. Pixels are only a
   fallback (and keep the geometry-free headless harness useful). */
function markReading(box, key) {
  box.dataset.readingKey = key;
  let i = 0;
  $$(".prose", box).forEach(p => Array.from(p.children).forEach(n => {
    n.dataset.readingKey = key + "|block|" + i++;
    if (n.tagName === "PRE") n.dataset.k = n.dataset.readingKey;
  }));

function readingPosition() {
  const host = $("#stream");
  const pos = { top: host.scrollTop, bottom: host.scrollHeight - host.scrollTop - host.clientHeight < 80 };
  if (!pos.bottom && host.clientHeight) {
    const edge = host.getBoundingClientRect().top;
    const nodes = $$("[data-reading-key]", host);
    /* Prefer a paragraph to its much taller enclosing message. */
    const visible = nodes.filter(n => { const r = n.getBoundingClientRect(); return r.height && r.top + r.height > edge; });
    const node = visible.find(n => n.dataset.readingKey.indexOf("|block|") >= 0) || visible[0];
    if (node) { pos.key = node.dataset.readingKey; pos.offset = node.getBoundingClientRect().top - edge; }
  }
  return pos;
}
function restoreReading(pos) {
  const host = $("#stream");
  if (pos.bottom) { host.scrollTop = host.scrollHeight; return; }
  const node = pos.key && $$("[data-reading-key]", host).find(n => n.dataset.readingKey === pos.key);

    ? host.scrollTop + node.getBoundingClientRect().top - host.getBoundingClientRect().top - pos.offset

      const roster = Object.keys(sess.members || {});

      const answered = got.filter(r => r.status === "done").length;

  }
}

/* --------------------------------------------------- generic knob rendering */
function knobVisible(spec, mode) { return !spec.modes || spec.modes.indexOf(mode) >= 0; }
/* G3: a numeric knob's bounds are the knob's own min/max when it publishes

  const pub = (r && typeof r.length === "number" && r.length === 2) ? r : null;
  const lo = (spec && spec.min != null) ? spec.min : (pub ? pub[0] : null);
  const hi = (spec && spec.max != null) ? spec.max : (pub ? pub[1] : null);

function knobPlaceholder(spec, tier) {

  if (spec.env) bits.push(spec.env);

}
function knobField(seat, name, spec, d, live) {

/* R2 + C4: the ONE place that decides whether this form may be submitted, and
   the only writer of the two nodes that show that decision. Called at build,
   on every charter keystroke, and either side of an in-flight create. `root`
   lets the build call reach nodes that are not in the document yet. */
function syncCreateReady(root) {
  const scope = root || document;
  const btn = scope.querySelector('[data-k="createbtn"]');
  if (!btn) return;
  const d = S.draft ? normalizeReader(S.draft) : null;
  const problem = (d && d.mode === "persona") ? personaProblemDraft(d) : null;
  btn.disabled = !!problem || S.creating;
  if (problem) btn.title = problem; else btn.removeAttribute("title");
  const hold = scope.querySelector('[data-k="createblockholder"]');
  if (!hold) return;
  clear(hold);
  if (problem) {
    const p = el("p", "hint bad");
    p.dataset.k = "createblock";
    p.textContent = problem;
    hold.appendChild(p);

/* one payload builder, one place that knows how a knob becomes a field ------ */
function buildCreatePayload(draft) {
  const d = draft || S.draft;
  const cfg = S.config;
  const members = {};
  draftSeats(d).forEach(seat => {
    const m = d.members[seat];
    const out = { tier: m.tier };
    const knobs = (cfg.seats[seat] || {}).knobs || {};
    Object.keys(knobs).forEach(name => {
      if (name === "role" || name === "charter") return;
      if (!knobVisible(knobs[name], d.mode)) return;
      const raw = m.knobs[name];
      if (raw === "" || raw == null) return;              /* empty means: let the server default */
      out[name] = knobs[name].type === "int" ? Number(raw) : raw;
    });
    members[seat] = out;
  });
  if (d.mode === "persona") {
    (cfg.roles || []).forEach(role => {
      const seat = d.roles[role];
      if (!seat || !members[seat]) return;
      members[seat].role = role;
      const charter = String(d.charters[role] || "");
      if (charter) members[seat].charter = charter;
    });
  }
  const payload = { mode: d.mode, members: members,
                    protocol: JSON.parse(JSON.stringify(normalizeReader(d).protocol)) };
  if (d.title.trim()) payload.title = d.title.trim();
  return payload;
}
function serializeDraft(d) {
  const members = {};
  Object.keys(d.members).forEach(s => {
    members[s] = { on: d.members[s].on, tier: d.members[s].tier, knobs: JSON.parse(JSON.stringify(d.members[s].knobs)) };
  });
  return { mode: d.mode, members: members, protocol: JSON.parse(JSON.stringify(d.protocol)),
           roles: JSON.parse(JSON.stringify(d.roles)), charters: JSON.parse(JSON.stringify(d.charters)) };
}
/* role-map check: with role-centric rows, "two roles on one seat" is the shape
   the mistake actually takes, and the sentence names the role, not the seat */
function personaProblemDraft(d) {
  const roles = (S.config && S.config.roles) || [];
  const seats = draftSeats(d);
  const used = {};
  /* the line-up first: a seat holding two roles invalidates the whole sequence,
     so say that before complaining about any one charter's contents */
  for (let i = 0; i < roles.length; i++) {
    const role = roles[i], seat = d.roles[role];
    if (!seat || seats.indexOf(seat) < 0) return "persona mode: no seat is assigned " + role + ".";
    if (used[seat]) {
      return "persona mode: " + seatLabel(seat) + " is both " + used[seat] + " and " + role +
             " — each role needs its own seat.";
    }
    used[seat] = role;
  }
  for (let i = 0; i < roles.length; i++) {
    const role = roles[i];
    if (!String(d.charters[role] || "").trim()) {

/* L5 (round five): the roster's fallback read the LAST ROUND'S STAGE-1 ONLY.
   Every later call a seat made was invisible to it: a relay turn that errored, a
   review that timed out, a persona step that was cancelled — all of them left
   the roster showing the green "done" from stage 1, which is the exact reading
   the brief forbids ("a failed seat must look failed at a glance"). The
   fallback now walks every result the record holds for that seat and takes the
   chronologically last one. `started_at` orders them; a result with no stamp
   never outranks one that has a stamp, and document order breaks ties. */
function eachResultFor(seat, fn) {
  const sess = S.session;
  if (!sess) return;
  const reader = (sess.protocol || {}).reader_seat;
  (sess.rounds || []).forEach(rnd => {
    const s1 = (rnd.stage1 || {})[seat];
    if (s1) fn(s1);
    (rnd.reruns || []).forEach(r => { if (r.seat === seat && r.result) fn(r.result); });
    (rnd.review_history || []).forEach(h => { const r = ((h || {}).results || {})[seat]; if (r) fn(r); });
    const rev = (((rnd.review || {}).results) || {})[seat];
    if (rev) fn(rev);
    /* the disagreements extraction is a real call, made by the reader seat */
    if (reader === seat) {
      (rnd.disagreements_history || []).forEach(d => { if (d) fn(d); });
      if (rnd.disagreements) fn(rnd.disagreements);
    }
    /* relays carry persona steps too — a step is a relay with a `step` name */
    (rnd.relays || []).forEach(run => {
      (run.entries || []).forEach(e => { if (e && e.seat === seat) fn(e); });
    });
  });
}
function lastResultFor(seat) {
  let best = null, bestT = -Infinity;
  eachResultFor(seat, res => {
    if (!res || !res.status) return;
    const t = stampOf(res);
    const at = isFinite(t) ? t : -Infinity;
    if (at >= bestT) { bestT = at; best = res; }
  });
  return best;
}

/* Closing the inspector gives space back to prose without hiding who is
   working or the latest failed call. Reuse the roster's source of truth. */
function renderReadingStatus() {
  const host = $("#readingStatus");

    S.live.forEach(e => { if (e.sid === S.sid && e.seat === seat && !e.settled && !active) active = e; });
    const last = lastResultFor(seat);
    row.appendChild(active ? statusPill(active.status, {
      timerKey: active.runId || liveKey(active.round, active.stage, seat), startMs: active.startMs
    }) : last ? statusPill(last.status, { elapsed: last.elapsed_s }) : el("span", "hint", "Idle"));

/* =============================================================== COMPOSER */
function mentionsIn(text) {
  const found = [];
  String(text || "").replace(/@([a-z0-9_-]+)/gi, (m, name) => {
    const seat = name.toLowerCase();
    if (addressableSeats().indexOf(seat) >= 0 && found.indexOf(seat) < 0) found.push(seat);
    return m;
  });
  return found;
}
function setComposer(text) {
  const box = $("#msg");
  if (box) { box.value = text; S.messageRevision = ++S.editSequence; renderComposer(); }
}
/* ---------------------------------------------------------- the reply chip
   A pending quote is a chip above the textarea, never text inside it. Its
   record is the COMPLETE answer (the chip's one line is display only); it
   belongs to the composer view, so it parks with the session and comes back
   with it; one chip at a time, a second Quote replaces the first; it clears
   only once the message carrying it has actually been accepted. */
function setQuote(q) {
  const text = q ? String(q.text == null ? "" : q.text) : "";
  /* an answer with no text is not a quote — it would send a bare ">" */
  S.quote = q && text.trim() ? { seat: q.seat, tier: q.tier || null, round: q.round, stage: q.stage || "stage1", text: text } : null;
  dropCapNote();
  renderComposer();
}
function clearQuote() { if (S.quote) setQuote(null); }
function quoteStage(opts) {
  if (opts.isReview) return "review";
  const badge = String(opts.stageBadge || "");
  if (/^turn /.test(badge)) return "relay";
  if (/superseded/.test(badge)) return "superseded";
  return "stage1";
}
/* the chip's one display line: the first non-empty line with its leading
   Markdown markers (heading, list, quote) and inline emphasis marks removed —
   display only; the record and the send keep every character */
function quoteFirstLine(text) {
  const first = String(text == null ? "" : text).split("\n").map(l => l.trim()).filter(Boolean)[0] || "";
  return first.replace(/^(?:#{1,6}\s+|>\s?|[-*+]\s+|\d+[.)]\s+)+/, "").replace(/(\*\*|__|`)(.+?)\1/g, "$2").trim();
}
function quoteAsLines(q) {
  return String(q.text == null ? "" : q.text).replace(/\r\n?/g, "\n").split("\n").map(l => "> " + l).join("\n");
}
/* what the server receives: the full quote as "> " lines, a blank line, then
   the typed text — or the quote alone when nothing was typed */
function composeMessage(text) {
  const typed = String(text == null ? "" : text);
  if (!S.quote) return typed;
  return typed.trim() ? quoteAsLines(S.quote) + "\n\n" + typed : quoteAsLines(S.quote);
}
/* the relay topic built from the composer: the same message shape (quote,
   blank line, the typed topic with its @mentions stripped), then the context */
function relayTopic(msg, ctx) {
  const topic = String(msg == null ? "" : msg).replace(/@[a-z0-9_-]+/gi, "").trim();
  const context = String(ctx == null ? "" : ctx);
  return composeMessage(topic) + (context.trim() ? "\n\nCONTEXT:\n" + context : "");
}
/* The server's caps, checked BEFORE a send while a chip is staged. The chip is

   would now fall on text the reader cannot see — a quote past the question cap
   would be refused with a 400, and a relay topic past its cap would lose the
   reader's own instruction to the trim. So the page refuses first, with the
   numbers, and offers the way out: edit the quote as text, or remove it. */
function sendCap() {
  const msg = $("#msg"), ctx = $("#ctx");
  const text = msg ? msg.value : "", context = ctx ? ctx.value : "";
  if (S.delivery === "relay") return { have: relayTopic(text, context).length, cap: relayCap(), what: "a relay prompt" };
  return { have: composeMessage(text).length, cap: questionCap(), what: "a question" };
}
function quoteOverflow() {
  if (!S.quote || S.delivery === "persona" || S.view === "new") return null;

  c.text = "The quote and your text come to " + c.have + " characters \u2014 the server caps " + c.what +

function dropCapNote() { if (S.composerNote && S.composerNote.cap) S.composerNote = null; }
/* the way to trim a quote: it becomes "> " lines in the box, every line, where

function editQuoteAsText() {

  const box = $("#msg");

function renderQuoteRow(row) {

}
function viewKey() { return S.view === "new" ? "new" : S.sid; }
