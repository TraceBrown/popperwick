  S.compare = new Set(saved.compare); S.open = new Set(saved.open);
  S.relay = JSON.parse(JSON.stringify(saved.relay)); S.reviewers = JSON.parse(JSON.stringify(saved.reviewers));
  S.relaySeed = Object.assign({}, saved.relaySeed);
  S.readingPending = saved.reading;
}
function messageTicket(text) {
  return { key: viewKey(), gen: S.gen, text: text, revision: S.messageRevision, quote: S.quote };
}
function settleMessage(ticket) {
  if (!ticket || !ticket.key) return;
  if (ticket.key === viewKey()) {
    /* the chip clears only once its quote has gone out — and only if it is
       still the same chip (a Quote pressed since then replaced it; that stays) */
    const chipSent = !!(ticket.quote && S.quote === ticket.quote);
    if (chipSent) S.quote = null;
    if (ticket.gen === S.gen && ticket.revision === S.messageRevision && $("#msg").value === ticket.text) setComposer("");
    else if (chipSent) renderComposer();
  } else {
    const saved = S.views.get(ticket.key);
    if (saved && saved.revision === ticket.revision && saved.text === ticket.text) {
      saved.text = ""; saved.revision = ++S.editSequence;
    }
    if (saved && ticket.quote && saved.quote === ticket.quote) saved.quote = null;
  }
}
function focusComposer() { const box = $("#msg"); if (box && box.focus) box.focus(); }
/* C5/G5: a one-shot sentence for the line beside Send — why a send did not
   happen, or what the server's cap did to the text that was sent. It survives
   until the reader types, and never replaces the standing delivery explanation
   with silence. */
function composerNote(text, bad) {
  S.composerNote = text ? { text: String(text), bad: !!bad } : null;
  renderComposer();
}
function nextPersonaStep() {
  const sess = S.session;
  if (!sess || sess.mode !== "persona" || !sess.persona_state) return null;
  return (sess.persona_state.steps || [])[sess.persona_state.step_index + 1] || null;
}
function renderComposer() {
  const msg = $("#msg"), send = $("#btnSend"), note = $("#deliveryNote"),
        sel = $("#delivery"), turnsWrap = $("#turnsWrap"), mentionRow = $("#mentionRow"),
        ctxSum = $("#ctxSummary"), ctx = $("#ctx");
  if (!msg || !send) return;
  const sess = S.session;
  const persona = !!(sess && sess.mode === "persona");
  const personaOpt = sel ? sel.querySelector('option[value="persona"]') : null;
  if (personaOpt) personaOpt.disabled = !persona;
  if (S.delivery === "persona" && !persona && (sess || S.view !== "session")) S.delivery = "independent";
  if (sel) sel.value = S.delivery;
  if (turnsWrap) turnsWrap.hidden = S.delivery !== "relay";

  const mentions = mentionsIn(msg.value);
  if (mentionRow) {
    clear(mentionRow);
    if (mentions.length) {
      mentionRow.appendChild(el("span", "hint", "addressed:"));
      mentions.forEach((seat, i) => {
        const chip = el("span", "chip");
        if (S.delivery === "relay") chip.appendChild(el("span", "num", (i + 1) + "."));
        chip.appendChild(tileFor(seat));
        chip.appendChild(el("span", null, seatLabel(seat)));
        mentionRow.appendChild(chip);
      });
    }
  }
  const quoteRow = $("#quoteRow");
  if (quoteRow) renderQuoteRow(quoteRow);
  if (ctxSum && ctx) {
    ctxSum.textContent = ctx.value.trim()
      ? "Context · " + ctx.value.length + " chars"
      : "Context";
  }

  const addressable = addressableSeats();
  msg.placeholder = "Ask " + (addressable.length ? addressable.map(s => "@" + s).join(" ") : "the seats") + "…";
  msg.title = "Enter sends; Shift+Enter adds a line." +
    (addressable.length ? " Address seats with " + addressable.map(s => "@" + s).join(" ") + "." : "");
  /* Grow with writing, not with permanent instructions. The same textarea
     keeps its value, focus and caret across incoming seat events. */
  if (msg.style && msg.scrollHeight) {
    msg.style.height = "auto";
    msg.style.height = Math.max(36, Math.min(msg.scrollHeight + 2, 180)) + "px";
  }
  /* T1: `sayWhy` marks the cases where the line under Delivery earns its 28px —
     a blocker the reader has to act on. The generic description of the delivery
     mode is not one of them: it sits on the control as a title now, and an empty
     message box does not need a caption telling the reader it is empty. */
  let label = "Send", enabled = true, why = "", sayWhy = false;
  if (S.view === "new") {
    label = msg.value.trim() ? "Create session and ask" : "Create session";
    enabled = !S.creating;                 /* C4: the other Create control is mid-flight */
    why = S.creating ? "creating the session — one request is already out"
                     : "the session is created first, then the round";
    sayWhy = S.creating;
  } else if (!sess) {
    label = "Send"; enabled = false; why = "open or create a session first"; sayWhy = true;
  } else if (S.delivery === "persona") {
    const step = nextPersonaStep();
    label = step ? "Advance persona: " + step : "Persona sequence complete";
    enabled = !!step && !busy();
    why = step ? "the sequence is frozen; " + (S.quote ? "typed text and the quoted reply are" : "typed text is") + " not sent on a persona step"
               : "there is no judge step — write the decision instead";
    sayWhy = !step || busy() || !!S.quote;     /* a staged chip Send will not carry earns the line */
    msg.disabled = !!step;
  } else if (S.delivery === "relay") {
    const rnd = (sess.rounds || [])[sess.rounds.length - 1];
    const answered = rnd ? Object.keys(sess.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text) : [];
    const order = mentions.filter(s => answered.indexOf(s) >= 0);
    label = "Run relay (" + order.length + " seats × " + S.turns + ")";
    const over = quoteOverflow();
    enabled = order.length >= 2 && !!msg.value.trim() && !busy() && !over;
    why = over ? over.text
        : order.length < 2 ? "mention at least two seats that answered this round, in order"
                           : order.map(seatLabel).join(" then ") + " · the message is the relay topic";
    sayWhy = order.length < 2 || busy() || !!over;     /* the ORDER is the thing a reader gets wrong */
    msg.disabled = false;
  } else {
    const n = Object.keys((sess && sess.members) || {}).length;
    label = "Send to " + n + (n === 1 ? " seat" : " seats");
    const over = quoteOverflow();
    enabled = (!!msg.value.trim() || !!S.quote) && !busy() && !over;   /* a quote alone is a message */
    why = over ? over.text : busy() ? "a stage is still running" : "every seat gets the same packet, blind and in parallel";
    sayWhy = busy() || !!over;
    msg.disabled = false;
  }
  const compactSend = S.view !== "new" && S.delivery === "independent";
  $("#sendLabel").textContent = label;
  $("#sendLabel").className = compactSend ? "sr-only" : "";
  send.dataset.compact = String(compactSend);
  send.setAttribute("aria-label", label);
  send.disabled = !enabled;
  /* T1 (round five): the delivery explanation was a permanent row. At 380px it
     wrapped onto its own line under the Delivery control and never changed —
     28px of the composer spent restating what "Independent parallel" already
     says, on every screen, forever. It becomes the control's own title, and the
     row is kept for the two cases that are worth a line: something the page
     wants to shout (a trim, a refused relay) and the reason Send is off. */
  if (sel) sel.title = why;
  send.title = why;
  if (note) {
    const shout = S.composerNote;
    note.textContent = shout ? shout.text : (sayWhy ? why : "");
    note.className = "hint grow" + (shout && shout.bad ? " bad" : "");
  }
}

/* ================================================================ ACTIONS */
function guard(sid, gen) { return sid === S.sid && gen === S.gen; }

async function post(path, body, what) {
  S.inflight += 1;
  renderComposer();
  try {
    return await api(path, body);
  } catch (e) {
    flash((what || "Request") + " failed: " + e.message + (e.field ? " (field " + e.field + ")" : ""));
    throw e;
  } finally {
    S.inflight -= 1;
    renderComposer();
  }
}

function newSessionView() {
  /* M1: New session is reached FROM inside the sessions drawer, so at drawer
     widths the surface it opens would appear underneath it. Shut the drawers
     first — the form is the thing you just asked for. */
  if (narrow()) closeDrawers();
  flushPendingNotes();               /* C1: leaving for the new-session form loses notes the same way */
  parkFields();
  parkView();
  stopStream();
  clearLive();
  forgetFields();
  S.fetchApplied = 0;
  S.gen += 1;
  S.sid = null; S.session = null; S.view = "new";
  S.draft = defaultDraft();
  restoreView("new");
  try { window.history.replaceState(null, "", "/"); } catch (e) { /* no history in this context */ }
  renderTop(); renderInfo(); renderComposer(); renderStream(); renderSidebar();
}

/* The server rejects a bad persona line-up with a 400 naming the field. Say it
   here too, before spending a request, and name the ROLE that is wrong — the
   form is where the mistake is, so that is where the sentence belongs. */
function personaProblem(members) {
  const roles = (S.config && S.config.roles) || ["bull", "bear", "risk"];
  const seatOfRole = {};
  const seats = Object.keys(members);
  for (let i = 0; i < seats.length; i++) {
    const seat = seats[i], role = members[seat].role;
    if (!role) return "persona mode: the " + seatLabel(seat) + " seat has no role — assign " + roles.join(", ") + ".";
    if (seatOfRole[role]) {
      return "persona mode: " + role + " is on two seats (" + seatLabel(seatOfRole[role]) + " and " +
             seatLabel(seat) + ") — each role needs its own seat.";
    }
    seatOfRole[role] = seat;
    if (!String(members[seat].charter || "").trim()) {
      return "persona mode: the " + role + " seat (" + seatLabel(seat) + ") has an empty charter — a frozen charter is required.";
    }
  }
  const missing = roles.filter(r => !seatOfRole[r]);
  if (missing.length) {
    return "persona mode: no seat is assigned " + missing.join(" or ") + " — one " + roles.join(", one ") +
           ", on three different seats.";
  }
  return null;
}

async function createSession(openingQuestion) {
  /* C4: two controls create a session — this form's button and the composer's
     Send while the new-session view is open — and neither consulted the other.
     Enter twice, or Enter plus a click, POSTed /api/session/new twice and left
     two sessions where the reader asked for one (the second usually orphaned,
     because only the last create's id gets opened). One lock, checked before
     anything else happens, held until the whole create-then-ask is finished. */
  if (S.creating) return null;
  S.creating = true;
  syncCreateReady(); renderComposer();
  try {
    return await createSessionLocked(openingQuestion);
  } finally {
    S.creating = false;
    syncCreateReady(); renderComposer();
  }
}
async function createSessionLocked(openingQuestion) {
  const gen = S.gen;                       /* a late create must not steal a newer choice */
  /* C2: the opening question and its context are captured HERE, beside the
     configuration they belong to, and the round below is addressed to the id
     this call creates. Sending it to "whatever session is current when the
     network comes back" put a round on a stranger's transcript the moment the
     reader clicked another session during the create. */
  const wantQ = openingQuestion == null ? ($("#msg") ? $("#msg").value : "") : openingQuestion;
  const wantCtx = $("#ctx") ? $("#ctx").value : "";
  const openingTicket = messageTicket(wantQ);
  let payload;
  try { payload = buildCreatePayload(S.draft); }
  catch (e) { flash("Cannot build the configuration: " + e.message); return null; }
  if (!Object.keys(payload.members).length) { flash("Pick at least one seat."); return null; }
  if (payload.mode === "persona") {
    const problem = personaProblemDraft(S.draft) || personaProblem(payload.members);
    if (problem) { flash(problem); return null; }      /* no request is sent */
  }
  let res;
  try { res = await post("/api/session/new", payload, "Creating the session"); }
  catch (e) { return null; }
  const createdId = res.id;
  await loadSessions();
  /* Give a failed opening round somewhere recoverable to leave its draft.
     If creation stayed foreground, carry later typing there too. */
  const createdView = emptyView();
  createdView.text = wantQ; createdView.context = wantCtx; createdView.revision = openingTicket.revision;
  if (S.gen === gen) {
    parkView();
    const latest = S.views.get(openingTicket.key);
    if (latest) Object.assign(createdView, latest, { delivery: "independent", reading: { top: 0, bottom: false } });
  }
  S.views.set(createdId, createdView);
  const createdTicket = { key: createdId, gen: S.gen === gen ? S.gen + 1 : null,
    text: wantQ, revision: openingTicket.revision };
  if (S.gen === gen) await selectSession(createdId, openingTicket.key);
  /* Re-read the world AFTER every await: the reader may have moved during the
     create, during the list load, or during the new session's own first fetch. */
  if (S.sid !== createdId) {
    flash("Session " + shortId(createdId) + " was created, but you had already moved on — it is in the list, not opened.", "ok");
  }
  if (wantQ && wantQ.trim()) {
    const started = await ask(wantQ, wantCtx, createdId, createdTicket);
    if (started) settleMessage(openingTicket);
  }
  return createdId;
}

/* `targetSid` addresses a round at a NAMED session. Omitted, it means the open
   one and the page repaints as usual; given and not open, the round still runs
   where it was addressed and this session is left exactly as the reader left
   it — no repaint, no live entries, no stolen composer. */
async function ask(question, context, targetSid, sentTicket) {
  const sid = targetSid == null ? S.sid : targetSid;
  const gen = S.gen;
  const foreground = sid === S.sid;
  const ticket = sentTicket || (foreground ? messageTicket(question) : null);
  if (!sid) { flash("No session is open."); return null; }
  let res;
  try { res = await post("/api/round", { id: sid, question: question, context: context || "" }, "Starting the round"); }
  catch (e) { return null; }
  settleMessage(ticket);
  if (!foreground) {
    flash("Round " + (res.round + 1) + " started on session " + shortId(sid) +
          " — you had already opened another session, so nothing here was repainted.", "ok");
    await loadSessions();
    return res;
  }
  if (!guard(sid, gen)) return res;
  markPending(res.round, "stage1", Object.keys(S.session.members || {}));
  await refetch(sid, gen);
  await loadSessions();
  return res;
}

async function runDisagreements(roundIndex) {
  const sid = S.sid, gen = S.gen;
  try { await post("/api/disagreements", { id: sid, round: roundIndex }, "Extracting disagreements"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "disagreements", [(S.session.protocol || {}).reader_seat]);
  renderStream(); renderInfo();
}

async function runReview(roundIndex) {
  const sid = S.sid, gen = S.gen;
  const chosen = S.reviewers[roundIndex] || {};
  const rnd = (S.session.rounds || [])[roundIndex] || {};
  const answered = Object.keys(S.session.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text);
  const reviewers = answered.filter(s => chosen[s] !== false);
  if (!reviewers.length) { flash("Pick at least one reviewer."); return; }
  try { await post("/api/review", { id: sid, round: roundIndex, reviewers: reviewers }, "Starting the review round"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "review", reviewers);
  renderStream(); renderInfo();
}

/* Accepted relays return true here or "left" after navigation. Only rejection
   returns false; the caller can settle the right owner's submitted draft. */
async function runRelay(roundIndex) {
  const sid = S.sid, gen = S.gen;
  const draft = relayDraft(roundIndex);
  let res;
  try {
    res = await post("/api/relay", { id: sid, round: roundIndex, order: draft.order.slice(),
                                     turns: Number(draft.turns) || 1, prompt: draft.prompt.trim() }, "Starting the relay");
  } catch (e) { return false; }
  if (!guard(sid, gen)) return "left";
  if (res && res.run_id && S.relaySeed["round" + roundIndex]) S.relaySeed[res.run_id] = S.relaySeed["round" + roundIndex];
  draft.open = false;
  await refetch(sid, gen);
  /* C2 (round five): the POST was guarded and the refetch was guarded, and then
     the function returned a flat `true` into a caller that took it as licence to
     empty the composer — the SHARED composer, which by then might be showing a
     different session's unsent question. The reader clicks another session while
     the final GET is in the air, starts typing, and the sentence disappears
     under them. The relay did start; it just did not start HERE any more, and
     the caller has to be able to tell those apart. */
  return guard(sid, gen) ? true : "left";
}

async function runRelayFromComposer() {
  const sess = S.session;
  const rnd = (sess.rounds || [])[sess.rounds.length - 1];
  if (!rnd) { composerNote("Ask a question first — a relay argues about answers.", true); return false; }
  const answered = Object.keys(sess.members || {}).filter(s => ((rnd.stage1 || {})[s] || {}).text);
  const msg = $("#msg").value;
  const order = mentionsIn(msg).filter(s => answered.indexOf(s) >= 0);
  const ctx = $("#ctx") ? $("#ctx").value : "";
  const draft = relayDraft(rnd.index);
  draft.order = order;
  draft.turns = Number(S.turns) || 1;
  /* G5: the server caps a relay prompt at relayCap(). Cutting the topic
     silently misrepresents what the seats were actually asked, so the cut is
     recorded on the draft AND said out loud beside Send. */
  /* With a reply chip the trim is refused instead: the quote comes first, so
     the cut would fall on the typed instruction — invisible, since the quote
     is not in the box. The reader gets the numbers and the Edit way out. */
  const over = quoteOverflow();
  if (over) { capNote(over); return false; }
  const full = relayTopic(msg, ctx);
  draft.prompt = full.slice(0, relayCap());
  draft.trimmed = full.length > relayCap() ? { kept: draft.prompt.length, total: full.length } : null;
  S.relaySeed["round" + rnd.index] = "the composer";
  const sentText = msg;                       /* C2: exactly what this relay was built from */
  const ticket = messageTicket(sentText);
  const started = await runRelay(rnd.index);
  /* C5: the draft is the reader's writing. A relay the server refused (409 while
     a stage runs, 400 on a bad order) used to empty the composer anyway, so the
     text was gone and the reason was in a line above it. */
  if (started === false) {
    if (guard(ticket.key, ticket.gen)) composerNote("The relay did not start, so your draft is untouched — the reason is in the line above.", true);
    return false;
  }
  /* C2: the relay ran, but not on the session the composer is showing now. Say
     nothing here and touch nothing here — this composer belongs to whatever the
     reader moved to, and its contents are theirs. */
  if (started !== true) { settleMessage(ticket); return false; }
  /* C2: even on the same session, only clear the text this relay actually sent.
     Anything else in the box was typed after the request went out. The same
     for the chip: it clears only if it is still the one this relay carried. */
  const box = $("#msg");
  if (ticket.quote && S.quote === ticket.quote) S.quote = null;
  if (!box || box.value !== sentText || S.messageRevision !== ticket.revision) {
    composerNote("The relay started. What you typed since is still here, unsent.", false);
    return true;
  }
  setComposer("");
  composerNote(draft.trimmed
    ? "Relay topic trimmed to " + draft.trimmed.kept + " of " + draft.trimmed.total +
      " characters — the server caps a relay prompt at " + relayCap() + "."
    : "", false);
  return true;
}

async function runPersonaStep() {
  const sid = S.sid, gen = S.gen;
  let res;
  try { res = await post("/api/persona/step", { id: sid }, "Advancing the persona sequence"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  await refetch(sid, gen);
}

async function rerunSeat(roundIndex, seat) {
  const sid = S.sid, gen = S.gen;
  try { await post("/api/rerun", { id: sid, round: roundIndex, seat: seat }, "Re-running " + seatLabel(seat)); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;
  markPending(roundIndex, "rerun", [seat]);
  renderStream(); renderInfo();
}

async function cancelSeat(seat) {
  const sid = S.sid, gen = S.gen;
  const body = { id: sid };
  if (seat) body.seat = seat;
  try { await post("/api/cancel", body, "Cancelling"); }
  catch (e) { return; }
  if (!guard(sid, gen)) return;            /* a stale cancel never flashes into another session */
  flash(seat ? "Cancel sent to " + seatLabel(seat) + "." : "Cancel sent to every seat in this session.", "ok");
}

function scheduleNotes(text) {
  const sid = S.sid, gen = S.gen;
  if (S.notesTimer) clearTimeout(S.notesTimer);
  S.notesPending = { sid: sid, notes: text };      /* C1: what the debounce still owes */
  S.notesTimer = setTimeout(async () => {
    S.notesTimer = 0;
    S.notesPending = null;
    if (!guard(sid, gen)) return;
    try {
      await api("/api/notes", { id: sid, notes: text });
      if (!guard(sid, gen)) return;
      if (S.session) S.session.notes = text;
      fieldSaved("notes", text);
      S.notesSaved = clockNow();
      renderInfo();
    } catch (e) { flash("Notes did not save: " + e.message); }
  }, 900);
}
/* C1 (round five): the notes autosave is a 900 ms debounce. Clicking another
   session inside that window bumped `S.gen`, so the timer fired into a guard
   that dropped it — the last sentence the reader typed was simply gone, with an
   "unsaved" caption they never got to read. Navigation now SENDS what the
   debounce is still holding, addressed to the session it was typed in. No guard
   (the point is that we have already left) and no repaint (nothing on screen
   belongs to that session any more) — just the write, then the switch. */
function flushPendingNotes() {
  const p = S.notesPending;
  if (S.notesTimer) { clearTimeout(S.notesTimer); S.notesTimer = 0; }
  S.notesPending = null;
  if (!p || !p.sid) return null;
  const sent = api("/api/notes", { id: p.sid, notes: p.notes });
  sent.catch(() => { /* the reader has moved on; a flash here would land on a stranger's screen */ });
  return sent;
}

async function saveDecision(stance, rationale, dissent) {
  const sid = S.sid, gen = S.gen;
  try {
    const res = await post("/api/decision", { id: sid, decision: { stance: stance, rationale: rationale, dissent: dissent } }, "Saving the decision");
    if (!guard(sid, gen)) return;
    if (S.session) S.session.decision = res.decision;
    fieldSaved("decision-stance", stance);
    fieldSaved("decision-rationale", rationale);
    fieldSaved("decision-dissent", dissent);
    flash("Decision saved at " + res.saved + ".", "ok");
    renderInfo();
    renderStream();
  } catch (e) { /* flashed already */ }
}

async function exportSession(fmt) {
  const sid = S.sid, gen = S.gen;
  try {
    const res = await post("/api/export", { id: sid, format: fmt }, "Exporting");
    if (!guard(sid, gen)) return;
    if (S.session) { S.session.exported = S.session.exported || {}; S.session.exported[fmt] = res.path; }
    flash("Wrote " + res.path, "ok");
    renderInfo();
  } catch (e) { /* flashed already */ }
}

/* =============================================================== SESSIONS */
function stopStream() {
  if (S.stream) { try { S.stream.close(); } catch (e) { /* already closed */ } S.stream = null; }
  if (S.refetchTimer) { clearTimeout(S.refetchTimer); S.refetchTimer = 0; }
}
async function selectSession(id, transferredFrom) {
  if (!ID_RE.test(String(id || ""))) { flash("That is not a session id.", "err", "sessionload"); return; }
  /* C1: BEFORE anything is cleared — the old session still owns S.sid here, and
     both of these read it. */
  flushPendingNotes();
  parkFields();
  parkView();
  stopStream();
  clearLive();                       /* switching sessions clears every timer */
  forgetFields();                    /* and its drafts belong to it, not the next one */
  S.fetchApplied = 0;                /* C3: a new session starts its own ordering */
  S.gen += 1;
  S.sid = id; S.session = null; S.view = "session";
  restoreView(id);
  /* A foreground creation moves its composer; it must not leave a duplicate
     under New. Do this before awaiting, so later New drafts cannot be erased. */
  if (transferredFrom) S.views.delete(transferredFrom);
  S.notesSaved = null;
  const gen = S.gen;
  try { window.history.replaceState(null, "", "/?session=" + encodeURIComponent(id)); } catch (e) { /* no history */ }
  renderTop(); renderInfo(); renderComposer(); renderStream(); renderSidebar();
  await refetch(id, gen);
  if (!guard(id, gen)) return;
  openStream(id, gen);
}
async function refetch(sid, gen) {
  /* C3 (round five): (sid, gen) stops a stale answer from painting the WRONG
     session, but says nothing about two answers for the RIGHT one. A stage
     event and a reconnect fire two GETs; if the first resolves second — a
     40-minute seat makes that ordinary — the older snapshot wins and the
     transcript loses the answer that had just landed, until something else
     happened to refetch. Every GET takes a ticket; a ticket older than the one
     already painted is dropped unread. */
  const seq = ++S.fetchSeq;
  try {
    const sess = await api("/api/session/" + encodeURIComponent(sid));
    if (!guard(sid, gen)) return null;          /* stale completion: never repaint */
    if (seq < S.fetchApplied) return null;      /* a newer snapshot is already on screen */
    S.fetchApplied = seq;
    S.session = sess;
    clearFlashTag("sessionload");               /* C4: a session DID load — the notice is spent */
    S.delivery = (sess.mode === "persona" && S.delivery === "persona") ? "persona" : S.delivery;
    pruneLive();
    renderTop(); renderInfo(); renderComposer(); renderStream();
    return sess;
  } catch (e) {
    if (guard(sid, gen)) flash("Could not load the session: " + e.message, "err", "sessionload");
    return null;
  }
}
function scheduleRefetch(sid, gen) {
  if (S.refetchTimer) clearTimeout(S.refetchTimer);
  S.refetchTimer = setTimeout(() => { S.refetchTimer = 0; refetch(sid, gen); }, 140);
}

function openStream(sid, gen) {
  let stream;
  try { stream = new EventSource("/api/events?id=" + encodeURIComponent(sid)); }
  catch (e) { flash("Live events are unavailable: " + e.message); return; }
  S.stream = stream;
  stream.onopen = () => { if (guard(sid, gen)) scheduleRefetch(sid, gen); };
  stream.onmessage = ev => {
    if (!guard(sid, gen)) return;
    let msg = null;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleEvent(msg, sid, gen);
  };
  stream.onerror = () => { /* EventSource retries on its own; state comes from the refetch */ };
}

/* The server also emits legacy argue_turn / argue_done aliases for every relay
   turn so the v1 page keeps working. This page drops them — counting both would
   double every turn. */
const ALIASES = { argue_turn: 1, argue_done: 1 };
function handleEvent(msg, sid, gen) {
  if (!msg || !msg.type || ALIASES[msg.type]) return;
  if (msg.type === "resync") { scheduleRefetch(sid, gen); return; }
  const round = msg.round == null ? 0 : msg.round;

  if (msg.type === "seat_started") {
    S.live.delete(liveKey(round, msg.stage, msg.seat));
    const key = msg.entry_run_id || msg.run_id || ("s|" + round + "|" + msg.stage + "|" + msg.seat);
    S.live.set(key, {
      sid: sid, gen: gen, round: round, stage: msg.stage, seat: msg.seat, tier: msg.tier,
      runId: msg.entry_run_id || msg.run_id, relayRunId: msg.entry_run_id ? msg.run_id : null,
      status: "working", startMs: Date.now(), settled: false, header: ""
    });
    startTicker();
    renderStream(); renderInfo(); renderComposer();
    return;
  }
  if (msg.type === "seat_done" || msg.type === "seat_error" || msg.type === "rerun_done" || msg.type === "relay_turn") {
    const key = msg.entry_run_id || msg.run_id;
    const entry = S.live.get(key);
    if (entry) {
      entry.status = msg.status || (msg.type === "seat_error" ? "error" : "done");
      entry.settled = true;
      entry.text = msg.text; entry.header = msg.header; entry.elapsed_s = msg.elapsed_s;
    }
    scheduleRefetch(sid, gen);
    return;
  }
  if (msg.type === "disagreements_done") {
    const entry = S.live.get(msg.run_id);
    if (entry) { entry.status = msg.status; entry.settled = true; }
    S.live.delete(liveKey(round, "disagreements", msg.seat));
    scheduleRefetch(sid, gen);
    return;
  }
  if (msg.type === "review_done" || msg.type === "relay_done" || msg.type === "persona_step_done" ||
      msg.type === "round_started" || msg.type === "cancelled") {
    if (msg.type === "cancelled") {
      S.live.forEach(entry => {
        if (entry.sid === sid && (!msg.seat || entry.seat === msg.seat)) { entry.status = "cancelled"; entry.settled = true; }
      });
    }
    scheduleRefetch(sid, gen);
    if (msg.type === "round_started") loadSessions();
    return;
  }
  scheduleRefetch(sid, gen);
}

/* =================================================================== BOOT */
function wireComposer() {
  const msg = $("#msg"), ctx = $("#ctx");
  if (msg) {
    msg.addEventListener("input", () => { S.messageRevision = ++S.editSequence; S.composerNote = null; renderComposer(); });
    msg.addEventListener("keydown", ev => {
      if (ev.key === "Escape" && S.quote) {          /* Escape in the box drops the reply chip */
        if (ev.preventDefault) ev.preventDefault();
        if (ev.stopPropagation) ev.stopPropagation(); /* one key, one change: never a drawer too */
        clearQuote();
        return;
      }
      if (ev.key === "Enter" && !ev.shiftKey && !ev.altKey && !ev.ctrlKey && !ev.metaKey) {
        ev.preventDefault();
        sendComposer();
      }
    });
  }
  if (ctx) ctx.addEventListener("input", () => renderComposer());
  const sel = $("#delivery");
  if (sel) sel.addEventListener("change", () => { S.delivery = sel.value; renderComposer(); });
  const turns = $("#turns");
  if (turns) {
    const range = turnRange();
    turns.min = String(range[0]); turns.max = String(range[1]);
    turns.addEventListener("input", () => {
      const v = Number(turns.value) || range[0];
      S.turns = Math.max(range[0], Math.min(range[1], v));
      renderComposer();
    });
  }
  const send = $("#btnSend");
  if (send) send.addEventListener("click", () => sendComposer());
}
async function sendComposer() {
  const msg = $("#msg");
  const text = msg ? msg.value : "";
  const ctx = $("#ctx") ? $("#ctx").value : "";
  if (S.view === "new") { await createSession(text); return; }
  if (!S.session) { flash("Open or create a session first."); return; }
  if (S.delivery === "persona") { await runPersonaStep(); return; }
  if (S.delivery === "relay") { await runRelayFromComposer(); return; }
  if (!text.trim() && !S.quote) return;             /* a quote with nothing typed is still a message */
  const over = quoteOverflow();                     /* Enter reaches here past a disabled Send */
  if (over) { capNote(over); return; }
  /* the ticket records what the BOX held (so it can be cleared on success); the
     server receives the quote as "> " lines, a blank line, then that text */
  await ask(composeMessage(text), ctx, undefined, messageTicket(text));
}
function wireChrome() {
  $$("[data-theme-set]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  const sb = $("#btnSidebar");
  if (sb) sb.addEventListener("click", () => setPane("sidebar", document.getElementById("app").dataset.sidebar !== "on"));
  const ib = $("#btnInfo");
  if (ib) ib.addEventListener("click", () => setPane("info", document.getElementById("app").dataset.info !== "on"));
  const nb = $("#btnNew");
  if (nb) nb.addEventListener("click", () => newSessionView());
  const rb = $("#btnReload");
  if (rb) rb.addEventListener("click", () => loadSessions());
  const cs = $("#btnCloseSidebar");
  if (cs) cs.addEventListener("click", () => setPane("sidebar", false));
  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("keydown", onGlobalKey);       /* M1: Escape shuts a drawer */
  }
  const search = $("#search");
  if (search) search.addEventListener("input", () => { S.search = search.value; renderSidebar(); });
  wireGutter($("#gutL"), "sidebar");
  wireGutter($("#gutR"), "info");
  if (typeof window !== "undefined" && window.addEventListener) {
    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { applyAutoPanes(); syncChromeHeight(); }, 120);
    });
  }
}
function restoreLayout() {
  let mode = lsGet("rt2.theme", "system");
  if (["system", "light", "dark"].indexOf(mode) < 0) mode = "system";
  setTheme(mode);
  setWidth("sidebar", lsGet("rt2.sidebar.w", 268));
  setWidth("info", lsGet("rt2.info.w", 330));
  setPane("sidebar", paneWanted("sidebar"), lsGet("rt2.sidebar.choice", null) !== null);
  setPane("info", paneWanted("info"), lsGet("rt2.info.choice", null) !== null);
  syncChromeHeight();
}
async function boot() {
  restoreLayout();
  wireChrome();
  wireComposer();
  renderComposer();
  try {
    S.config = await api("/api/config");
  } catch (e) {
    flash("Cannot reach the roundtable server: " + e.message);
    renderStream();
    return;
  }
  const bar = $("#fakebar");
  if (bar) bar.hidden = !S.config.fake;
  syncChromeHeight();                       /* the fake band changes the drawers' ceiling */
  await loadSessions();
  let wanted = null;
  try {
    const m = /(?:^|[?&])session=([0-9a-f]{8,64})(?:&|$)/.exec(window.location.search || "");
    if (m) wanted = m[1];
  } catch (e) { /* no location */ }
  if (wanted && S.sessions.some(r => r.id === wanted)) await selectSession(wanted);
  else {
    /* C3: an id in the address bar that this server does not have used to do
       nothing at all — the page landed on the empty view and the reader was
       never told the link was dead. Name the id, keep the line dismissable,
       and land on the list. It clears itself on the next session that loads. */
    if (wanted) {
      flash("Session " + shortId(wanted) + " did not load — no session with that id is in this server's list.",
            "err", "sessionload");
    }
    S.view = "empty"; renderTop(); renderStream(); renderInfo(); renderComposer();
  }
  syncChromeHeight();
  startTicker();
}

/* the same functions the buttons call, exposed for a headless harness */
if (typeof window !== "undefined") {
  window.RT = {
    boot: boot, state: S,
    md: { esc: esc, renderMd: renderMd, mdBlocks: mdBlocks, inlineMd: inlineMd },
    util: { mmss: mmss, elapsedLabel: elapsedLabel, worstStatus: worstStatus, mentionsIn: mentionsIn,
            addressableSeats: addressableSeats, orderedSeats: orderedSeats, configSeats: configSeats,
            fieldDirty: fieldDirty, fields: () => S.fields,
            pruneLive: pruneLive, rangeFor: rangeFor, answeredSeats: answeredSeats, narrow: narrow,
            liveFor: liveFor, terminal: TERMINAL, quoteFirstLine: quoteFirstLine, leadingQuote: leadingQuote },
    act: {
      newSessionView: newSessionView, createSession: createSession, ask: ask,
      selectSession: selectSession, refetch: refetch, loadSessions: loadSessions,
      runDisagreements: runDisagreements, runReview: runReview, runRelay: runRelay,
      runRelayFromComposer: runRelayFromComposer, runPersonaStep: runPersonaStep,
      rerunSeat: rerunSeat, cancelSeat: cancelSeat, exportSession: exportSession,
      saveDecision: saveDecision, scheduleNotes: scheduleNotes, seedRelay: seedRelay,
      sendComposer: sendComposer, setComposer: setComposer, buildCreatePayload: buildCreatePayload,
      setQuote: setQuote, clearQuote: clearQuote, composeMessage: composeMessage,
      editQuoteAsText: editQuoteAsText, quoteOverflow: quoteOverflow, relayTopic: relayTopic,
      handleEvent: handleEvent, setTheme: setTheme, setPane: setPane, paneWanted: paneWanted, personaProblem: personaProblem,
      personaProblemDraft: personaProblemDraft, nextDraft: nextDraft, defaultDraft: defaultDraft,
      serializeDraft: serializeDraft, blankDraft: blankDraft,
      applyAutoPanes: applyAutoPanes, restoreLayout: restoreLayout, relayDraft: relayDraft,
      closeDrawers: closeDrawers, onGlobalKey: onGlobalKey, syncChromeHeight: syncChromeHeight,
      togglePacket: togglePacket, openRelayFor: openRelayFor, composerNote: composerNote,
      flash: flash, clearFlashTag: clearFlashTag, markPending: markPending
    },
    render: { stream: renderStream, info: renderInfo, sidebar: renderSidebar, composer: renderComposer, top: renderTop }
  };
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
</script>
</body>
