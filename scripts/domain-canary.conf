# domain-canary.conf — config for the bounded domain-intake canary (AUTH-008).
#
# Read by domain_canary.py. Lines starting with # and blank lines are ignored.
# PARSING IS FAIL-OPEN: an unreadable file, a bad setting, or a malformed source
# line falls back to the built-in default and is noted in the run output — it
# never crashes the run. A MISSING file means "no sources": the canary still
# runs, still reports, and reports honestly that it fetched nothing.
#
# TWO LINE KINDS
#   setting = value
#   ENABLED|TYPE|NAME|URL|EXTRA
#
# SCOPE IS EXHAUSTIVE AND IS NOT SET HERE. AUTH-008 #2 fixes the source list, so
# the script carries an EXACT endpoint allow-list and refuses any URL that is not
# byte-identical to one of them (status: endpoint-not-allowed). Adding a source
# is deliberately a CODE edit plus review, not a conf edit. Editing a URL below
# does not widen anything; it only disables that source.

# ---- settings ---------------------------------------------------------------

# Probation length. AUTH-008 #4: the canary disables itself after this many
# scheduled runs and posts one final PROBATION ENDED message. Hard-capped at 8
# in code — a larger number here is clamped back down, it cannot extend the
# grant. Renewal is a new AUTH block, not an edit to this line.
probation_runs = 8

# Hard cap on admitted claims per run (clamped to 3 in code).
max_admitted = 3

# Consecutive zero-item runs before a source is called out as SOURCE SUSPECT in
# the Telegram message and flagged in canary-state.json. Verified hazard: a feed
# can answer HTTP 200 with zero items, which under a design where "empty" is a
# valid result is otherwise indistinguishable from an honest quiet week.
zero_yield_suspect = 3

# arXiv max_results (conductor-verified query returns ~6 hits over ~7 weeks).
arxiv_max_results = 15

# Ignore items older than this many days. Generous on purpose: dedupe against
# earlier runs is what stops repeats, so this is only a guard against a
# newest-first query surfacing something ancient on a first run.
max_age_days = 120

# Network + GLM budgets (seconds / bytes).
fetch_timeout = 60

# POLITENESS: seconds to wait BETWEEN SOURCES (not per item — there is no
# per-item fetching; each source is exactly one request per week). arXiv asks
# API callers for roughly 3 seconds between requests, so 3 is the floor to keep
# here. Raising it is free; the whole run makes two requests.
fetch_spacing = 3
glm_timeout = 300
max_glm_bytes = 60000
per_item_chars = 1400
max_items = 40

# CORPUS SEEDING. Vault-relative directories scanned once per run for arXiv
# identifiers this vault ALREADY holds, so the canary never re-announces a paper
# the user has already reviewed. (2026-08-05: the first clean live run admitted
# two candidates and BOTH were already assessed in the vault — a queue of stale
# re-finds is worse than an empty queue, because it teaches the user to stop
# opening the message.) Comma-separated; extend it here, no code edit needed.
# A missing root is a NOTE, not an error — the run continues either way. The
# canary never scans its own output directory (Research Desk/domain-canary).
# NOTE: "Strategy Article Reviews" does not exist in this vault today; it is
# listed because the conductor named it and the scan degrades soft. Its absence
# shows up as "corpus root missing" in the run notes, which is the honest report.
corpus_roots = Journal, Research Desk, Sources, Futures

# Safety bound on the scan (files, not bytes). The four roots hold ~131 .md
# files today; this only exists so the scan can never become a runaway.
corpus_max_files = 4000

# Telegram topic KEY in ~/.config/idle-research-bot/group_topics.json.
# The canary posts its OWN message and may NEVER post into the tooling digest
# topic (AUTH-008 #2). The script refuses `digest` by name AND refuses any key
# that resolves to the digest thread id. `ondemand` is the existing non-digest
# topic and is the shipped default; to give the canary a dedicated topic, add a
# "canary": <thread-id> entry to group_topics.json and change this line.
telegram_topic = ondemand

# ---- sources ----------------------------------------------------------------
# ENABLED|TYPE|NAME|URL|EXTRA
#   ENABLED = on | off
#   TYPE    = arxiv | rss | gmail
#   NAME    = short lowercase label (state key, log label, fixture filename)
#   URL     = must match the script allow-list byte for byte
#   EXTRA   = arxiv: the RAW search_query, UNENCODED. curl --get
#             --data-urlencode does the encoding; hand-encoding the quotes and
#             parens is what broke the first attempt at this query.

# A. arXiv — narrow, instrument- and COST-specific (AUTH-008 #2 forbids the broad
#    q-fin.TR/q-fin.ST sweep the retired /papers watcher used). Conductor-verified
#    2026-08-05: 6 hits over ~7 weeks. NOTE the https:// — arXiv answers http with
#    a 301 and curl without -L silently returns zero results.
on|arxiv|arxiv|https://export.arxiv.org/api/query|cat:q-fin.TR AND (abs:"transaction cost" OR abs:"slippage" OR abs:"execution cost")

# B. CFTC press releases — primary-source regulatory notices. Conductor-verified
#    2026-08-05: 10 items.
on|rss|cftc|https://www.cftc.gov/RSS/RSSGP/rssgp.xml|

# C. CME advisories & SERs — SLOT ONLY, NOT YET ACTIVE. CME publishes no RSS or
#    API and 403s scraping, so the intake route is the user's email subscription
#    to "Advisories & SERs". This line is off, and `gmail` is ALSO refused in
#    code (source_status_gate) so flipping it to `on` still fetches nothing and
#    fabricates nothing — it reports "not-active (gmail hand-off, see conf)".
#
#    HAND-OFF POINT when the subscription is live: the conductor reads those
#    mails with the connected Gmail tooling (a per-session, human-triggered read
#    under the vault's existing Gmail authorization) and pastes the advisory text
#    into a queue entry by hand. This script implements no Gmail auth and must
#    never call a Gmail API itself: an unattended weekly job holding mailbox
#    credentials is a materially larger grant than AUTH-008 gives, and faking
#    data here would be exactly the "summarised into authority" failure the queue
#    exists to prevent.
off|gmail|cme|-|from:cmegroup.com subject:(advisory OR SER)
